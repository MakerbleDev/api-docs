    patch:
      tags: [Formula Trackers]
      summary: Set a Formula Tracker's targets on a Project
      description: |
        Sets the one-off target and/or replaces this tracker's deadline targets on the Project (Set
        Targets). An additive tracker adds its targets up across deadlines; a snapshot uses each
        deadline's target on its own. A percentage tracker's targets are whole percentages from 0 to
        100. `deadlines: []` clears the deadline targets. Requires rights to edit the Project's targets.
      operationId: setFormulaTrackerProjectTargets
