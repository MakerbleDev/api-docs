  /project_story_categories/{id}/survey_links:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The Survey Campaign (Project Story Category) ID
    post:
      tags: [Project Story Categories]
      summary: Generate personal survey links for Contacts (without sending them)
      description: |
        Generates a personal survey link (Survey Invitation link) for each Contact, as the
        **Send Survey** page does, and returns the links. **Nothing is emailed or texted.**
        Each response submitted through a link is recorded against that Contact.

        - `beneficiary_ids` must be Contacts already in the Survey Campaign's Project.
        - `emails` are matched to an existing Contact of the organisation with that email
          address; if there is none, a new Contact is created for the organisation.
        - At most 200 `beneficiary_ids` and `emails` per request.
        - `link_expiry`: `use_once` (default) — the link stops working after one response;
          `evergreen` — the link stays active.

        Requires Project Editor or Organisation Editor access to the Survey Campaign's Project.
        The links then appear on the Unique Survey Links page.
      operationId: createSurveyLinks
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beneficiary_ids:
                  type: array
                  items:
                    type: integer
                  description: Contacts (Beneficiaries) in the Survey Campaign's Project
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: Email addresses, matched to or creating Contacts. No email is sent.
                send_survey_wave_id:
                  type: integer
                  description: Optional Wave, from GET /project_story_categories/{id}/survey_waves
                link_expiry:
                  type: string
                  enum: [use_once, evergreen]
                  default: use_once
                is_anonymised:
                  type: boolean
                  default: false
            example:
              beneficiary_ids: [1201, 1202]
              emails: ["sam@example.org"]
              link_expiry: use_once
              is_anonymised: false
      responses:
        "201":
          description: Links generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  send_survey_id:
                    type: integer
                    description: The Survey Invitation batch the links belong to
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SurveyLink'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user may not send surveys for this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: |
            Invalid request: Contacts outside the Project (listed in `invalid_beneficiary_ids`),
            more than 200 recipients, no recipients, an unknown `link_expiry`, or a Wave that
            is not available for this Survey Campaign.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  invalid_beneficiary_ids:
                    type: array
                    items:
                      type: integer
              example:
