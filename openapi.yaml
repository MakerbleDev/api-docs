  /versions:
    get:
      tags: [Versions]
      summary: List a record's Versions (audit trail)
      description: |
        Returns every Version of one record, newest first: each time it was created or edited, who did it and when.
        Only Contacts (Beneficiaries) are versioned so far, so `record_type` must be `Contact`.

        Visible to Charity Editors (any Contact in their Organisation) and Project Editors (Contacts in at least one
        of their Projects). Anything the caller may not see returns `404`, so the endpoint never confirms that
        another Organisation's record exists.

        `user_name` is `System` when no signed-in user made the change (e.g. a CSV import run in the background).
        One Save can write several Versions a fraction of a second apart. Use `GET /versions/{id}` to see the full
        record as it was saved in a Version.
      operationId: listVersions
      security: [{tokenAuth: []}]
      parameters:
        - name: record_type
          in: query
          required: true
          schema:
            type: string
            enum: [Contact]
          description: Type of record. Only `Contact` for now.
        - name: record_id
          in: query
          required: true
          schema:
            type: integer
          description: The Contact (Beneficiary) ID
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 200
          description: Records per page (default 10, max 200)
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of the record's Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVersions'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                record: { record_type: Contact, record_id: 185170, charity_id: 304, name: Bella Thornton, deleted: false }
                data:
                  - { id: 76, record_type: Contact, record_id: 185170, charity_id: 304, event: update, action: Edited, user_id: 190, user_name: Sam Ahmed, created_at: "2026-09-29T07:50:02.709Z" }
                  - { id: 74, record_type: Contact, record_id: 185170, charity_id: 304, event: create, action: Created, user_id: 190, user_name: Sam Ahmed, created_at: "2026-09-29T07:50:02.319Z" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /versions/{id}:
    get:
      tags: [Versions]
      summary: Get a single Version, with the full record snapshot
      description: |
        Returns one Version including `full_object`: every field of the record exactly as it was saved at that
        moment, not just the fields that changed. Compare two Versions' `full_object` to see what changed.
        Same permissions as `GET /versions`.
      operationId: getVersion
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Version with full_object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /access_logs:
    get:
      tags: [Access Logs]
      summary: List who viewed a record (Access Logs)
      description: |
        Returns the Access Log of one record, newest first: each time a colleague opened it in Makerble or fetched it
        through the API, who it was, when, and how many times. This is the **Access Logs** tab beside Versions on the
        Manage Versions page. Changes are in `GET /versions` instead.
        Only Contacts (Beneficiaries) are available so far, so `record_type` must be `Contact`.

        Views by the same colleague, through the same route, less than 30 minutes apart are one entry with a
        `view_count`. Entries older than the Organisation's retention period (3 to 12 months, set on Organisation
        Preferences) are rolled up into one entry per colleague per month, with `monthly_summary: true` and
        `first_viewed_at` / `last_viewed_at` spanning that month. `source` is `web` (opened in Makerble), `api` (fetched with `GET /beneficiaries/{id}`) or `mcp`
        (fetched through the Makerble MCP server).

        Visible to Charity Editors (any Contact in their Organisation) and Project Editors (Contacts in at least one
        of their Projects). Anything the caller may not see returns `404`, so the endpoint never confirms that
        another Organisation's record exists.
      operationId: listAccessLogs
      security: [{tokenAuth: []}]
      parameters:
        - name: record_type
          in: query
          required: true
          schema:
            type: string
            enum: [Contact]
          description: Type of record. Only `Contact` for now.
        - name: record_id
          in: query
          required: true
          schema:
            type: integer
          description: The Contact (Beneficiary) ID
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Only entries on or after this date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Only entries on or before this date (YYYY-MM-DD)
        - name: user_id
          in: query
          schema:
            type: integer
          description: Only this colleague's views
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 200
          description: Records per page (default 10, max 200)
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Access Log entries for the record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessLogs'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                record: { record_type: Contact, record_id: 185170, charity_id: 304, name: Bella Thornton, deleted: false }
                data:
                  - { id: 912, record_type: Contact, record_id: 185170, charity_id: 304, action: "Viewed ×1", view_count: 1, source: mcp, user_id: 190, user_name: Sam Ahmed, first_viewed_at: "2026-10-02T14:05:00.000+01:00", last_viewed_at: "2026-10-02T14:05:00.000+01:00", monthly_summary: false }
                  - { id: 877, record_type: Contact, record_id: 185170, charity_id: 304, action: "Viewed ×3", view_count: 3, source: web, user_id: 212, user_name: Jane Smith, first_viewed_at: "2026-10-01T09:20:00.000+01:00", last_viewed_at: "2026-10-01T09:30:00.000+01:00", monthly_summary: false }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

