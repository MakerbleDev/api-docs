  /formula_trackers:
    get:
      tags: [Formula Trackers]
      summary: List an Organisation's Formula Trackers
      description: |
        The Formula Trackers of an Organisation (Charity). Visible to the Organisation's editors and
        reporters, and to managers (editors) of its Projects.
      operationId: listFormulaTrackers
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Formula Trackers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFormulaTrackers'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user has no editor or reporter role in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Formula Trackers]
      summary: Create a Formula Tracker
      description: |
        Creates a Formula Tracker (Create a metric > Formula Tracker): a metric worked out from the
        Organisation's other trackers. `expression` is the formula as an ordered list of tokens, never
        free text:

        - `{kind: tracker, type, id}`: one of the Organisation's trackers that has a number. `type` is
          `Change` (Activity or Engagement tracker), `Indicator` (Achievement or Numerical tracker; not a
          Choice tracker), `CohortTracker`, `WorkflowTracker`, `FilteredMetric` (a filtered version) or
          `FormulaTracker`. List them with `GET /formula_trackers/operands`.
        - `{kind: operator, value}`: `+`, `-`, `*` or `/`. × and ÷ are worked out before + and −.
        - `{kind: number, value}`, e.g. 100.
        - `{kind: open}` and `{kind: close}`: brackets, worked out first.

        Refused (422) when the formula is empty, starts or ends with an operator, has two operators
        or two values in a row, unmatched or empty brackets, uses another Organisation's tracker, or
        uses itself (directly or through other Formula Trackers).

        Each timeframe's result is worked out from each tracker's result for the same Project or Album
        and timeframe, then the formula: a Year to Date percentage is Year to Date numerator ÷ Year to
        Date denominator. `result_kind` is `additive` only when the formula adds and subtracts trackers
        that add up, with no numbers; otherwise `snapshot`. Dividing by 0 gives no result (null).
        Requires an editor or reporter of the Organisation.
      operationId: createFormulaTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormulaTrackerRequest'
            examples:
              referralsCompleted:
                summary: Referrals completed = External referrals + Internal referrals
                value:
                  formula_tracker:
                    charity_id: 913
                    name: "Referrals completed"
                    expression:
                      - { kind: tracker, type: Change, id: 5120 }
                      - { kind: operator, value: "+" }
                      - { kind: tracker, type: WorkflowTracker, id: 41 }
              percentageSupported:
                summary: "% of children receiving support = Children supported ÷ Children enrolled × 100"
                value:
                  formula_tracker:
                    charity_id: 913
                    name: "% of children receiving support"
                    display_format: "percentage"
                    decimal_places: 1
                    expression:
                      - { kind: tracker, type: Change, id: 5121 }
                      - { kind: operator, value: "/" }
                      - { kind: tracker, type: CohortTracker, id: 77 }
                      - { kind: operator, value: "*" }
                      - { kind: number, value: 100 }
      responses:
        "201":
          description: Formula Tracker created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Formula Trackers for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /formula_trackers/operands:
    get:
      tags: [Formula Trackers]
      summary: List the trackers a formula can use
      description: |
        The Organisation's trackers that have a number, by name, with the `type` and `id` to send in a
        tracker token: its Activity, Engagement, Achievement and Numerical trackers (owned by it or used
        on its Projects), Cohort, Workflow and Formula Trackers, and filtered versions. Choice trackers
        aren't listed.
      operationId: listFormulaTrackerOperands
      security: [{tokenAuth: []}]
