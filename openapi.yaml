  /events/{id}:
    get:
      tags: [Events]
      summary: Get an event
      operationId: getEvent
      description: |
        One event, with everything shown on its event page and Edit Event page: its Event
        Format's custom fields and Dropdown answers, the Signup Page, the Self Check-in Survey
        and Wave, capacity and timesheet settings, listing details, and the links guests use to
        sign up and check themselves in. For a master event (the first in a recurring series)
        it also returns the Recurring Schedule, the Recurring End Date and how many events are
        in the series.

        Anyone who can open the event page can read it. A member of the organisation who can't
        gets `403`; an event of another organisation, or an unknown id, returns `404`.
        `can_edit` and `can_delete` say whether you may change or delete it.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                id: 9119
                name: "Yoga 1"
                charity_id: 123
                start_datetime: "2030-01-08T14:00:00.000Z"
                end_datetime: "2030-01-08T15:00:00.000Z"
                timezone: "Europe/London"
                location: "Main Hall"
                event_type: "master"
                listing_enabled: true
                created_at: "2026-10-01T09:00:00.000Z"
                updated_at: "2026-10-01T09:00:00.000Z"
                project: { id: 456, name: "Youth Club" }
                event_category: { id: 4521, name: "Workshops" }
                master_event_id: null
                guests_count: 12
                managers_count: 1
                workers_count: 2
                can_edit: true
                can_delete: true
                recurring_schedule:
                  rule: { rule_type: "IceCube::WeeklyRule", interval: 1, validations: { day: [2] } }
                  description: "Weekly on Tuesdays"
                recurring_end_date: "2030-03-26"
                series_events_count: 12
                custom_fields:
                  - { id: 77, name: "Room booking reference", value: "B-114" }
                dropdowns:
                  - id: 3012
                    name: "Session type"
                    answer_choices: [{ id: 88101, name: "Drop-in" }]
                signup_page: { id: 310, name: "Youth Club signup" }
                self_check_in:
                  survey: { id: 5501, name: "Session feedback", project_survey_id: 9921 }
                  wave: null
                capacity:
                  guests: "fixed"
                  max_guests: 20
                  allow_signup_after_full: true
                  guest_status_for_signup_id: 41
                  guest_status_after_full_id: 43
                  confirmation_message_after_full: "Unfortunately we have no more space, however we will keep your details on file and let you know if a space becomes available."
                  thank_you_message: "Your registration has been received. Thank you."
                  workers: "unlimited"
                  max_workers: 0
                  timesheets_for_workers: true
                  timesheets_for_guests: false
                listing:
                  listing_enabled: true
                  location: "Main Hall"
                  description: "<p>Gentle yoga for all abilities.</p>"
                  image_url: null
                links:
                  self_check_in: "https://app.makerble.com/events/9119/kiosk"
                  signup: "https://app.makerble.com/charities/123/projects/456/beneficiaries/new?event_id=9119&redirect_to_check_in=false&referral_link_detail_id=310"
                  signup_and_self_check_in: "https://app.makerble.com/charities/123/projects/456/beneficiaries/new?event_id=9119&referral_link_detail_id=310"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: You are in the organisation but may not see this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "You don't have permission to see this event."
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Events]
      summary: Update an event
      operationId: updateEvent
      description: |
        Changes the fields you give and leaves the rest as they are; Dropdowns you don't mention
        keep their answers. Anyone who can open the Edit Event page can update the event.

        For a master event (the first in a recurring series), `apply_to: all_events_in_series`
        also applies the change to every subsequent event, like the form's "Update this event
        and all future events" button. The default is `this_event`.

        Locked after creation, as on the Edit Event page: the project, a series' time zone, and
        a master event's start and end (they set the times of the whole series).

        To change a series' Recurring Schedule or Recurring End Date, as the Edit Event Series
        page does, send `recurring_schedule` and/or `recurring_end_date` on the master event.
        Call Preview a series schedule change first: it lists the events that would no longer
        fit the new schedule. Each of those must be listed in `keep_event_ids` or
        `delete_event_ids`, or nothing changes and you get `422`. Missing dates are created,
        and the series is renumbered in date order.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
            example:
              name: "Evening Youth Club"
              location: "Hall 3"
              apply_to: all_events_in_series
      responses:
        "200":
          description: The event, as Get an event returns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

    delete:
      tags: [Events]
      summary: Delete an event
      operationId: deleteEvent
      description: |
        Deletes an event, as the event page's Delete Event does. Deleting a master event (the
        first of a recurring series) deletes the whole series. For a later event in a series,
        `delete_option` chooses what goes: `this_event` (the default),
        `current_and_upcoming_series_events`, or `all_series_events`. Anyone who can edit the
        event can delete it. Deleting an event also deletes what is recorded against it.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: delete_option
          in: query
          required: false
          schema: { type: string, enum: [this_event, current_and_upcoming_series_events, all_series_events], default: this_event }
      responses:
        "200":
          description: The ids of the deleted events
          content:
            application/json:
              schema:
                type: object
                required: [deleted_event_ids]
                properties:
                  deleted_event_ids: { type: array, items: { type: integer } }
              example:
                deleted_event_ids: [9120, 9121]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /events/{id}/series_schedule_preview:
    post:
      tags: [Events]
      summary: Preview a series schedule change
      operationId: previewEventSeriesScheduleChange
      description: |
        Shows what a new Recurring Schedule or Recurring End Date would do to a recurring series,
        without changing anything, as the Edit Event Series page does before you save. Send it to
        the master event (the first event of the series). Leave out either field to keep its
        current value.

        `required_dates` lists every date the new schedule needs, with the event already on that
        date or `exists: false` for one that would be created. `no_longer_fitting_events` lists
        the events that don't fit the new schedule, and whether each has Stories or timesheets
        recorded against it. Pass each of their ids in `keep_event_ids` or `delete_event_ids`
        when you make the change with Update an event.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesScheduleChangeRequest'
            example:
              recurring_schedule: { frequency: weekly, interval: 2, days_of_week: [tuesday] }
              recurring_end_date: "2030-02-05"
      responses:
        "200":
          description: What the change would do
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesSchedulePreview'
              example:
                master_event_id: 9119
                recurring_schedule: { frequency: weekly, interval: 2, days_of_week: [tuesday], days_of_month: [], description: "Every 2 weeks on Tuesdays" }
                recurring_end_date: "2030-02-05"
                required_dates:
                  - { start_datetime: "2030-01-08T18:00:00.000Z", event_id: 9119, exists: true }
                  - { start_datetime: "2030-01-22T18:00:00.000Z", event_id: 9121, exists: true }
                  - { start_datetime: "2030-02-05T18:00:00.000Z", event_id: null, exists: false }
                no_longer_fitting_events:
                  - { id: 9120, name: "Youth Club 2", start_datetime: "2030-01-15T18:00:00.000Z", has_stories: false, has_timesheets: false }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /registers:
    get:
      tags: [Events]
      summary: List my Registers
      operationId: listRegisters
      description: |
        The Registers of the recurring event series the user staffs: each series in which they
        are an Event Worker or Event Manager of an event starting today or later, with that next
        event, soonest first. This is the list the Registers tab of the Events tile on My Homepage
        shows.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: A page of series
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            master_event_id: { type: integer }
                            name: { type: string, description: The series name, without the event's number }
                            project:
                              type: object
                              properties: { id: { type: integer }, name: { type: string } }
                            next_event:
                              type: object
                              properties:
                                id: { type: integer }
                                name: { type: string }
                                start_datetime: { type: string, format: date-time }
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data: [{ master_event_id: 812, name: Ruby Training, project: { id: 41, name: Coding Club }, next_event: { id: 815, name: Ruby Training 4, start_datetime: "2026-11-23T10:00:00Z" } }]
        "401":
          $ref: '#/components/responses/Unauthorized'
  /events/{id}/register:
    get:
      tags: [Events]
      summary: Get an event series' Register
      operationId: getEventRegister
      description: |
        The Register page of a recurring event series: a row per guest (Contact) invited to any
        event in the series, in alphabetical order, and for every event in the series, in date
        order, that guest's answers in their latest attendance Story for it. The attendance Survey
        is the one set on the master event's Event Format. Activity metrics are counted once per
        event, so they are returned as each event's `totals` rather than per guest. `id` is any
        event in the series; a one-off event has no register. Anyone who can open the event page
        can read it.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The series and a page of its guests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      master_event_id: { type: integer }
                      name: { type: string, description: "The series name, without the event's number" }
                      schedule: { type: string, example: Weekly on Mondays from 2nd November 2026 to 14th December 2026 }
                      project:
                        type: object
                        properties: { id: { type: integer }, name: { type: string } }
                      survey:
                        type: object
                        nullable: true
                        description: The attendance Survey, or null when the Event Format has none
                        properties: { id: { type: integer }, name: { type: string } }
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            current_field_id: { type: integer }
                            name: { type: string }
                            type: { type: string, enum: [scale, binary, value, participation, custom_field] }
                            compulsory: { type: boolean }
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            start_datetime: { type: string, format: date-time }
                            full: { type: boolean, description: The event has reached its guest capacity }
                            totals:
                              type: array
                              items:
                                type: object
                                properties:
                                  current_field_id: { type: integer }
                                  name: { type: string }
                                  total: { type: number }
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            contact_id: { type: integer }
                            name: { type: string }
                            events:
                              type: array
                              items:
                                type: object
                                properties:
                                  event_id: { type: integer }
                                  in_event: { type: boolean }
                                  story_id: { type: integer, nullable: true }
                                  answers:
                                    type: object
                                    description: Answers by current_field_id; empty when the guest is not in the event
                                    additionalProperties: { type: string, nullable: true }
              example:
                master_event_id: 812
                name: Ruby Training
                schedule: Weekly on Mondays from 2nd November 2026 to 14th December 2026
                project: { id: 41, name: Coding Club }
                survey: { id: 77, name: Attendance }
                columns: [{ current_field_id: 9001, name: Minutes late, type: value, compulsory: false }]
                events: [{ id: 812, name: Ruby Training 1, start_datetime: "2026-11-02T10:00:00Z", full: false, totals: [] }]
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data: [{ contact_id: 5521, name: Ann Smith, events: [{ event_id: 812, in_event: true, story_id: 33410, answers: { "9001": "4" } }] }]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
  /events/{id}/register/cells:
    patch:
      tags: [Events]
      summary: Save one answer on an event series' Register
      operationId: updateEventRegisterCell
      description: |
        Saves one guest's answer to one question of the attendance Survey for one event, as the
        pencil in a Register cell does. `id` is the event the answer is for. The answer goes in the
        guest's latest attendance Story for that event; if they have none, they are added to the
        event's latest Story, or a Story is created. Only that answer changes, and compulsory
        questions may be left unanswered. For an Activity metric, which is counted once per event,
        leave out `contact_id` and send the event's total as a whole number. The guest must already
        be in the event. The event's Event Workers and Event Managers, its Project Managers and
        Organisation Admins may save answers.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_field_id, value]
              properties:
                contact_id: { type: integer, description: The guest; leave out for an Activity metric total }
                current_field_id: { type: integer, description: "The question, from the Register's columns or an event's totals" }
                value:
                  description: |
                    scale: an array of answer choice (sub-ratio) ids; binary and participation: true or
                    false; value: a number of 0 or more; custom_field: text, a date as YYYY-MM-DD or a
                    time as HH:MM. An empty value clears the answer.
                  oneOf:
                    - { type: array, items: { type: integer } }
                    - { type: boolean }
                    - { type: number }
                    - { type: string }
            example: { contact_id: 5521, current_field_id: 9001, value: "4" }
      responses:
        "200":
          description: The saved answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id: { type: integer }
                  contact_id: { type: integer, nullable: true }
                  current_field_id: { type: integer }
                  story_id: { type: integer, nullable: true }
                  answer: { description: The answer as the Register shows it, or the event's total }
              example: { event_id: 812, contact_id: 5521, current_field_id: 9001, story_id: 33410, answer: "4" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
  /events/{id}/guests:
    get:
      tags: [Events]
      summary: List an event's guests
      operationId: listEventGuests
      description: |
        The event's guests (Contacts), with each one's Guest Status (event state) and, when
        the Event Format has Event Roles turned on, Event Role. Anyone who can open the event
        page can see them. Use search to find guests by part of their name or Contact ID, as
        the search box above the event page's guests table does.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: search
          in: query
          required: false
          description: Part of a guest's name or Contact ID (the prefix and leading zeros of a Contact ID are ignored). Searches every page.
          schema: { type: string }
          example: Mokoena
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: A page of guests, by name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventGuest' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Events]
      summary: Add guests to an event
      operationId: addEventGuests
      description: |
        Adds Contacts in the event's project as guests, as the event page's Add Guests does.
        Contacts already on the event are left as they are. `guest_status_id` is one of the
        Event Format's Guest Statuses (default: its first), and each Contact must meet that
        Guest Status's requirements. `event_role_id` must be one of the Event Format's Event
        Roles for guests. A fixed guest limit is respected. For an event in a recurring
        series, `apply_to: this_and_upcoming_events` adds them to the later events too.
        Anyone who can open the event page can add guests.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids]
              properties:
                contact_ids: { type: array, items: { type: integer } }
                guest_status_id: { type: integer }
                event_role_id: { type: integer }
                apply_to: { type: string, enum: [this_event, this_and_upcoming_events], default: this_event }
            example:
              contact_ids: [5501, 5502]
              guest_status_id: 12
              event_role_id: 4
      responses:
        "201":
          description: The guests were added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventGuestCount' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /events/{id}/guests/{contact_id}:
