  /referral_link_details/{id}/definition:
    get:
      tags: [Signup Pages]
      summary: Get a Signup Page's Form Definition (staff API access)
      description: |
        Returns the Form Definition JSON for a Signup Page — its contact form/survey
        fields, skip logic, branding, and settings — the same document format the
        Offline Collector renderer ingests.

        This is the **staff, token-authenticated** variant: standard `X-User-Email` /
        `X-User-Token` headers, scoped to Signup Pages belonging to a charity the
        authenticated user has access to. Useful for testing or integration work
        without a browser session.

        Unlike the anonymous device-fetch variant (`GET /offline_collector_definition`),
        this response does **not** include `submission_credential` — that bearer token
        is only issued to the offline device itself.
      operationId: getReferralLinkDetailDefinition
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Form Definition JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Signup Page not found, or not accessible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offline_collector_definition:
    get:
      tags: [Signup Pages]
      summary: Get a Signup Page's Form Definition (offline device fetch)
      description: |
        The **anonymous** variant of the Form Definition endpoint, called automatically
        by the installed Offline Collector PWA (`/offline/:token`) when it first loads.
        There is no Devise session and no `X-User-Email`/`X-User-Token` pair involved —
        the query-param token stands in for both identifying the Signup Page and
        authorising the request.

        The response is identical to the staff API variant, **plus one extra key**:
        `submission_credential` — the bearer token the device later uses to post the
        completed submission back via `POST /referral_submissions`.
      operationId: getOfflineCollectorDefinition
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The offline collector token embedded in the Signup Page's "Offline QR Code" / "Offline version" links
      responses:
        "200":
          description: Form Definition JSON, including submission_credential
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FormDefinition'
                  - type: object
                    properties:
                      submission_credential:
                        $ref: '#/components/schemas/SubmissionCredential'
        "401":
          description: Token unknown, or the Signup Page has been deactivated since the token was issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "unauthorized"

  /event_categories/{id}:
    delete:
      tags: [Event Formats]
      summary: Delete an Event Format
      operationId: deleteEventFormat
      description: |
        Permanently deletes an Event Format (Event Category in the API). This is the
        same action as **Delete** in the Actions menu on the Manage Event Formats page,
        and runs through the same permission and blocking rules.

        - Only an **Organisation Admin** of the organisation that owns the Event Format
          may delete it. Other members of that organisation get `403`.
        - An Event Format belonging to an organisation you are not a member of returns
          `404`, as does an unknown id.
        - Deletion is refused with `422` while the Event Format still has any events, or
          is still added to any project. The `error` gives the reason and the counts.
        - Default Event Formats (Appointments, Classes, Conferences, Gatherings, Meetings,
          Other Events, Sessions, Workshops) can be deleted under the same rules.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The Event Format was deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
              example:
                id: 4521
                message: "Event Format was successfully deleted."
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: You are not an Organisation Admin of the organisation that owns this Event Format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Only an Organisation Admin can delete Event Formats."
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: The Event Format has events or is added to projects, so it can't be deleted yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "This Event Format can't be deleted because it has 3 events. Delete or move those events first. This Event Format can't be deleted because it is added to 2 projects. Remove it from those projects first."

  /referral_submissions:
    post:
      tags: [Signup Pages]
      summary: Sync a completed offline submission
      description: |
        The endpoint an offline device posts a completed Signup Page submission to,
        once it regains connectivity. Reuses the exact same model methods the live,
        online submission flow calls — there's no separate "offline" data path to
        keep in sync with the online one.

        **Authentication is a `ReferralLinkSubmissionCredential` bearer token** (the
        `submission_credential.token` from the Form Definition), **not** the standard
        `X-User-Email`/`X-User-Token` pair. Deactivating a Signup Page automatically
        revokes its credential — there's no separate revoke action.

        `primary` is used for a **structured** link (one primary person plus zero or
        more `related_people`); `roles` is used instead for a **personalised** link
        (one entry per person, no "primary" concept). Every `contact_form_answers` /
        survey `answers` object is keyed by the field's `id` from the Form Definition,
        never by name. See the Form Definition's Field object for the value shape
        each `field_type` expects (Sub Ratio ids for dropdown/scale fields, digits-only
        for `telephone`, base64-encoded payload for `media`/`file`, etc.).
      operationId: createReferralSubmission
      security: [{submissionBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralSubmissionRequest'
      responses:
        "201":
          description: New submission processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSubmissionResponse'
        "200":
          description: This `idempotency_key` had already been processed — returns the original result, not a new one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSubmissionResponse'
        "401":
          description: Token unknown, or the Signup Page has been deactivated since the token was issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "unauthorized"
        "422":
          description: |
            Either the contact form is a `CustomFieldCategory` ("advanced custom field")
            form — unsupported by this endpoint — or a model validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupportedContactForm:
                  value: { error: "unsupported-contact-form", detail: "..." }
                invalidSubmission:
                  value: { error: "invalid-submission", detail: ["..."] }

  /cohort_trackers:
    get:
      tags: [Cohort Trackers]
      summary: List an Organisation's Cohort Trackers
      description: |
        The Cohort Trackers of an Organisation (Charity). Visible to the Organisation's
        editors and reporters, and to managers (editors) of its Projects.
      operationId: listCohortTrackers
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Cohort Trackers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCohortTrackers'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user has no editor or reporter role in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Cohort Trackers]
      summary: Create a Cohort Tracker
      description: |
        Creates a Cohort Tracker (Create a metric > Cohort Tracker). Every tracker counts only
        members of the Project or Album it is placed on: `membership` is `ever_enrolled`
        (default: anyone whose status History shows them Enrolled at any time) or
        `currently_enrolled` (their current Project State). `criteria` adds further conditions, in
        the Contact Filters format; see `POST /cohort_trackers/preview` for the keys.
        Requires an editor or reporter of the Organisation. `criteria` may also be sent as a JSON string.
      operationId: createCohortTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CohortTrackerRequest'
            example:
              cohort_tracker:
                charity_id: 913
                name: "Bambanani children who start Ignite"
                membership: "ever_enrolled"
                criteria:
                  bundle_ids: ["57", "58"]
      responses:
        "201":
          description: Cohort Tracker created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Cohort Trackers for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /cohort_trackers/preview:
    post:
      tags: [Cohort Trackers]
      summary: Preview Cohort Tracker criteria
      description: |
        How many of the Organisation's Contacts currently meet some criteria, before the tracker is
        placed on a Project or Album ("Currently matches N contacts across your organisation"), and
        the criteria as they would be stored. `criteria` takes any key the Contacts page's Filters
        sidebar sends; keys no filter reads are dropped from the stored criteria.

        These keys follow the Project or Album the tracker is placed on and the reporting period:
        - `project_ids` (with `project_ids_narrow: "true"` to require all of them), in any state
        - `bundle_ids` (Albums) and `narrow_bundle_ids`
        - `projects_states_hash`: `{project_id: beneficiary_state_id}`, current Project State in each
        - `project_beneficiary_states`: `{project_id: {state_id: {enabled: "true", added_from_date, removed_from_date}}}`, dates as `dd/mm/yyyy - dd/mm/yyyy`, matched against status History
        - `project_story_category_ids` (Survey Campaigns completed) with `project_story_category_filter_data: {id: {story_date_from}}`
        - `attendance_rate`: `{change_id, from, to, event_scope}`
        - `distance_travelled`: `{trackers: [{indicator_id, directions: [improved|no_change|worsened]}], same_project}`
        - `indicator_comparisons`: `{indicator_id: {response: any|latest, op, sub_ratio_ids, values}}`
        - `indicator_sub_ratios_hash`: `{indicator_id: [sub_ratio_id]}`

        The Contacts page's other sections apply as they do there, against the Contacts' current
        details, e.g. `group_ids`, `beneficiary_types`, `age_from` / `age_to` (`{year, month, day}`),
        `date_of_birth_from` and `created_at_from` (`yyyy/mm/dd - yyyy/mm/dd`), `created_by_ids`,
        `story_creator_ids`, `case_owner_ids`, `case_worker_ids`, `open_cases`, `closed_cases`,
        `custom_field_value_hash`, `custom_field_definition_hash`, `changes_hash`, `indicators_hash`,
        `outcome_hash`, `event_ids`, `flag_hash`, `relationship_category_hash` and `beneficiary_roles_hash`.
      operationId: previewCohortTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id]
              properties:
                charity_id:
                  type: integer
                cohort_tracker:
                  type: object
                  properties:
                    criteria:
                      type: object
                    membership:
                      type: string
                      enum: [ever_enrolled, currently_enrolled]
            example:
              charity_id: 913
              cohort_tracker:
                criteria:
                  attendance_rate: { change_id: "412", from: "75", to: "100" }
      responses:
        "200":
          description: The count and the normalised criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 42
                  criteria:
                    type: object
                  names_projects_or_albums:
                    type: boolean
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Cohort Trackers for this Organisation
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /cohort_trackers/{id}:
    get:
      tags: [Cohort Trackers]
      summary: Get a Cohort Tracker
      description: |
        A Cohort Tracker with where it is used. `names_projects_or_albums` is true when its criteria
        point at specific Projects or Albums, so it counts against those same ones wherever it is placed.
      operationId: getCohortTracker
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The Cohort Tracker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Cohort Trackers]
      summary: Update a Cohort Tracker
      description: |
        Updates the fields sent. Changes apply everywhere the tracker is used. Requires an
        Organisation editor, or the reporter who created it.
      operationId: updateCohortTracker
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CohortTrackerRequest'
            example:
              cohort_tracker:
                name: "Children attending 80%+"
      responses:
        "200":
          description: Cohort Tracker updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit this Cohort Tracker
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Cohort Trackers]
      summary: Delete a Cohort Tracker
      description: Refused (422) while the tracker is used on any Project, Album or Scorecard Template.
      operationId: deleteCohortTracker
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "204":
          description: Deleted
        "401":
