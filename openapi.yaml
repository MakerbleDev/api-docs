  /workflow_trackers:
    get:
      tags: [Workflow Trackers]
      summary: List an Organisation's Workflow Trackers
      description: |
        The Workflow Trackers of an Organisation (Charity). Visible to the Organisation's editors and
        reporters, and to managers (editors) of its Projects.
      operationId: listWorkflowTrackers
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Workflow Trackers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowTrackers'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user has no editor or reporter role in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Workflow Trackers]
      summary: Create a Workflow Tracker
      description: |
        Creates a Workflow Tracker (Create a metric > Workflow Tracker): a metric that counts records
        Makerble's own features create, rather than Contacts tagged in updates. `source` says what it counts:

        - `signpostings`: Signpostings made from the Project (or an Album's Projects) it is placed on.
          A signposting counts once whether it names the Organisation signposted to, the Person, or
          both. Signpostings saved without a Project aren't counted on any Project or Album.
        - `internal_referrals`: Contacts in the Project who are added to another of the Organisation's
          Projects, dated by the Status in Projects history. Moving between states of the same Project
          isn't a referral. `settings` choose which Projects count: `{destinations: any}`,
          `{destinations: only, project_ids: [...]}` or `{destinations: except, project_ids: [...]}`
          (the default, with none listed).
        - `cases_created`: Cases (Cases App) created on the Project, or on any of an Album's Projects,
          each Case counted once.
        - `cases_closed`: each time one of those Cases is closed. A Case closed, reopened and closed
          again counts twice, or once when counting each Contact once.
        - `cases_open`: the Cases open at the end of each timeframe (or today, while that is still to
          come). Always a snapshot.
        - `time_spent`: hours logged in Timesheets on the Project, or any of an Album's Projects, each
          entry once, to 1 decimal place. Task and Update Timesheets are dated by their Update (Story),
          or by when their Task was done; Event Timesheets by when the Event started. Timesheets on draft
          Updates aren't counted. `settings` choose `kinds` (any of `updates_and_tasks`, `event_staff`,
          `event_guests`; default the first two) and, optionally, only the time of some colleagues:
          `user_ids` and/or `roles` (`editor`: Organisation Admins and Project Managers, `reporter`:
          Changemakers, `observer`: Observers). These don't narrow Event guests' time. Always counts
          `items`; `unit` is `hours`.

        For the three Cases sources, `settings` can name one Case Form, `{case_form_id: ...}`, to count
        only the Cases created with it; leave it out or send null for any Case Form. Confidential Cases
        are counted, but only listed to people who can see them.

        `count_mode` is `items` (default: each signposting, referral, Case or closing; adds up across
        periods, except for `cases_open`) or `contacts` (each Contact once; a snapshot). Requires an
        editor or reporter of the Organisation.
      operationId: createWorkflowTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTrackerRequest'
            examples:
              internalReferrals:
                summary: Internal referrals to any Project but two
                value:
                  workflow_tracker:
                    charity_id: 913
                    name: "Internal referrals"
                    source: "internal_referrals"
                    count_mode: "items"
                    settings:
                      destinations: "except"
                      project_ids: [4512, 4513]
              casesOpen:
                summary: Cases open, for one Case Form
                value:
                  workflow_tracker:
                    charity_id: 913
                    name: "Safeguarding cases open"
                    source: "cases_open"
                    count_mode: "items"
                    settings:
                      case_form_id: 2207
      responses:
        "201":
          description: Workflow Tracker created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Workflow Trackers for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /workflow_trackers/preview:
    post:
      tags: [Workflow Trackers]
      summary: Preview a Workflow Tracker
      description: |
        What a Workflow Tracker with these settings gives on one of the Organisation's Projects, before
        it is saved: the result for the current Period (ending at the Project's next deadline, or today
        when it has none ahead), Year to Date and All-time, and the latest records counted.
      operationId: previewWorkflowTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id, project_id]
              properties:
                charity_id:
                  type: integer
                project_id:
                  type: integer
                workflow_tracker:
                  $ref: '#/components/schemas/WorkflowTrackerAttributes'
            example:
              charity_id: 913
              project_id: 4510
              workflow_tracker:
                source: "signpostings"
                count_mode: "items"
      responses:
        "200":
          description: The results and the latest records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTrackerPreview'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Workflow Trackers for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

