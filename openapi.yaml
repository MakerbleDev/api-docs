                type: integer
                example: 3
              assigned:
                type: integer
                example: 4
              over:
                type: integer
                description: Seats in use beyond those bought
                example: 1

    SeatColleague:
      type: object
      properties:
        user_id:
          type: integer
          example: 7
        name:
          type: string
          example: Amira Khan
        roles:
          type: string
          description: The colleague's roles that need a seat, in words
          example: Event Worker on 6 events
        lowest_seat_allowed:
          $ref: '#/components/schemas/SeatBillingRole'
        status:
          type: string
          enum: [covered, no_seat, seat_too_low, no_seat_needed]
        seats:
          type: array
          items:
            type: object
            properties:
              contract_id:
                type: integer
                example: 31
              billing_role:
                $ref: '#/components/schemas/SeatBillingRole'
              seat_too_low:
                type: boolean
              assigned_at:
                type: string
                format: date-time
              assigned_by_system:
                type: boolean
                description: Makerble gave the seat automatically when the colleague was given a role

    AgeBands:
      type: object
      required: [source, starts, bands]
      properties:
        source:
          type: string
          enum: [organisation, album, project]
          description: Whose bands these are. `organisation` for an Album or Project with none of its own.
        starts:
          type: array
          items:
            type: integer
          description: The age each band starts at, in order
          example: [0, 13, 18, 25]
        bands:
          type: array
          items:
            type: string
          description: The bands as shown on screen
          example: ["0–12", "13–17", "18–24", "25 and over"]
    AgeBandsRequest:
      type: object
      properties:
        starts:
          type: array
          items:
            type: integer
          description: The age each band starts at (0 to 120), in any order
        use_organisation_bands:
          type: boolean
          description: Albums and Projects only. `true` removes their own bands so they use their Organisation's.
    SnapshotPanel:
      type: object
      required: [key, name, source]
      properties:
        key:
          type: string
          description: '`age_band`, `split_by_project` (Albums only) or `ratio_set:<id>`'
          example: "ratio_set:12"
        name:
          type: string
          example: Gender
        source:
          type: string
          enum: [Ratio Set, From Date of Birth, Albums only]
    SnapshotChoice:
      type: object
      required: [key, name, kind]
      properties:
        key:
          type: string
          description: '`<type>:<id>`, the type being Change, Indicator, FilteredMetric, WorkflowTracker, CohortTracker or FormulaTracker'
          example: "Change:31"
        name:
          type: string
          example: Sessions run
        kind:
          type: string
          enum: [Progress Tracker, Indicator, Filtered version, Workflow Tracker, Cohort Tracker, Formula Tracker]
    SnapshotChoiceOrNull:
      type: object
      nullable: true
      description: What a tile shows, or null when it is hidden
      required: [key, name, kind]
      properties:
        key:
          type: string
          example: "Change:31"
        name:
          type: string
          example: Sessions run
        kind:
          type: string
          enum: [Progress Tracker, Indicator, Filtered version, Workflow Tracker, Cohort Tracker, Formula Tracker]
    SnapshotSettings:
      type: object
      required: [customised, panels, tiles, workload, choices]
      properties:
        customised:
          type: boolean
          description: false until the editors choose, when the defaults are shown (Age band and the first two Ratio Sets; the first metric in each column; no Workload tiles)
        panels:
          type: array
          description: The "Who we're working with" panels, in display order
          items:
            $ref: '#/components/schemas/SnapshotPanel'
        tiles:
          type: array
          description: One per Results Canvas column, in order
          items:
            type: object
            required: [column, column_label, choice]
            properties:
              column:
                type: string
                enum: [activities, engagement, potential, behaviour, growth]
              column_label:
                type: string
                description: The column's name on the Results Canvas
                example: Activity
              choice:
                $ref: '#/components/schemas/SnapshotChoiceOrNull'
        workload:
          type: array
          description: The three Workload tiles; null for a hidden one
          items:
            $ref: '#/components/schemas/SnapshotChoiceOrNull'
        choices:
          type: object
          required: [panels, columns, trackers]
          properties:
            panels:
              type: array
              items:
                $ref: '#/components/schemas/SnapshotPanel'
            columns:
              type: array
              description: The metrics in each Results Canvas column, filtered versions included
              items:
                type: object
                required: [key, label, options]
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  options:
                    type: array
                    items:
                      $ref: '#/components/schemas/SnapshotChoice'
            trackers:
              type: array
              description: The Workflow, Cohort and Formula Trackers, which can go on any tile and on Workload
              items:
                $ref: '#/components/schemas/SnapshotChoice'
    SnapshotSettingsRequest:
      type: object
      properties:
        panels:
          type: array
          items:
            type: string
          description: Panel keys in display order. An empty list shows no panels.
        tiles:
          type: object
          description: Results Canvas column => metric or tracker key, or null to hide the tile. Columns left out keep their tile.
          properties:
            activities: {type: string, nullable: true}
            engagement: {type: string, nullable: true}
            potential: {type: string, nullable: true}
            behaviour: {type: string, nullable: true}
            growth: {type: string, nullable: true}
        workload:
          type: array
          maxItems: 3
          items:
            type: string
            nullable: true
          description: Up to three tracker keys; null hides a tile
    SnapshotOwner:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [album, project]
        id:
          type: integer
        name:
          type: string
          example: Youth Programme 2026
    SnapshotTile:
      type: object
      required: [column, key, name, kind, value, unit]
      properties:
        column:
          type: string
          nullable: true
          description: The Results Canvas column's name; null on a Workload tile
          example: Activity
        key:
          type: string
          example: "Change:31"
        name:
          type: string
          example: Sessions run
        kind:
          type: string
          enum: [Progress Tracker, Indicator, Filtered version, Workflow Tracker, Cohort Tracker, Formula Tracker]
        value:
          type: number
          nullable: true
          description: The result over `timeframe`, as on the Results Canvas's Period view; null when the tracker has no single number
          example: 148
        unit:
          type: string
          nullable: true
          example: count
    Snapshot:
      type: object
      required: [showing, contacts_count, timeframe, panels, tiles, workload]
      properties:
        showing:
          allOf:
            - $ref: '#/components/schemas/SnapshotOwner'
            - type: object
              required: [pinned]
              properties:
                pinned:
                  type: boolean
                  description: Whether this is your pinned Snapshot
        contacts_count:
          type: integer
          description: The Album's or Project's Contacts that you can view
        timeframe:
          type: object
          description: What the tiles count. The Results Canvas's current period (from the day after the last deadline to the next, or to today once they have all passed), or all time when there are no deadlines.
          required: [kind, start_date, end_date]
          properties:
            kind:
              type: string
              enum: [period, all_time]
            start_date:
              type: string
              format: date
              nullable: true
              description: null for all time
            end_date:
              type: string
              format: date
        panels:
          type: array
          items:
            type: object
            required: [key, name, source, rows]
            properties:
              key:
                type: string
              name:
                type: string
                example: Gender
              source:
                type: string
                example: Ratio Set, as on the Demographics tab
              rows:
                type: array
                items:
                  type: object
                  required: [label, contacts, percent]
                  properties:
                    label:
                      type: string
                      example: Female
                    contacts:
                      type: integer
                      nullable: true
                      description: null when below the Minimum Results Threshold
                    percent:
                      type: number
                      nullable: true
                      example: 51.1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotTile'
        workload:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotTile'
    AgeBandCounts:
      type: object
      required: [source, total_count, data]
      properties:
        source:
          type: string
          enum: [organisation, album, project]
          description: Whose age bands were used
        total_count:
          type: integer
          description: Every Contact counted, including any the threshold hides
        data:
          type: array
          items:
            type: object
            required: [band, contacts]
            properties:
              band:
                type: string
                example: "13–17"
              contacts:
                type: integer
                nullable: true
                description: Contacts in the band; null when below the Minimum Results Threshold
    SeatChangeRequest:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: integer
          description: One of the Organisation's current Contracts
        billing_role_id:
          type: integer
          nullable: true
          description: Role-based Pricing only. The Billing Role to give, or `null` to take the seat away.
        has_seat:
          type: boolean
          description: Flat Pricing only. `true` gives a seat, `false` takes it away.

    PaginatedSeats:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            contracts:
              type: array
              items:
                $ref: '#/components/schemas/SeatContract'
            data:
              type: array
              items:
                $ref: '#/components/schemas/SeatColleague'

    PaginatedWebhookEndpoints:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WebhookEndpoint'

    PaginatedWebhookDeliveries:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WebhookDelivery'
