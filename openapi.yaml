      required: [charity_id]
      properties:
        charity_id:
          type: integer
          description: The organisation the user is acting for
        name:
          type: string
        availability:
          type: string
          enum: [platform, network, charity]
        network_id:
          type: integer
        level1_singular:
          type: string
        level1_plural:
          type: string
        level2_singular:
          type: string
        level2_plural:
          type: string
        value_source:
          type: string
          enum: [organisation_values, set_values]
        version_label:
          type: string
        supersedes_id:
          type: integer
        status:
          type: string
          enum: [draft, live]
        frameworks:
          type: array
          description: Impact Frameworks in order. Replaces the current list.
          items:
            type: object
            required: [template_id]
            properties:
              template_id:
                type: integer
              short_code:
                type: string
              colour:
                type: string
                example: "#C5192D"
              text_colour:
                type: string
                example: "#FFFFFF"
        new_frameworks:
          type: array
          description: Names of new Impact Frameworks to create and add at the end
          items:
            type: string
        financial_values:
          type: array
          description: The Financial Value for each Outcome, used when value_source is set_values. Replaces the current list.
          items:
            type: object
            properties:
              outcome_id:
                type: integer
              financial_value_id:
                type: integer

    FrameworkContribution:
      type: object
      properties:
        framework_set_id:
          type: integer
        charity_id:
          type: integer
        project_id:
          type: integer
          nullable: true
        bundle_id:
          type: integer
          nullable: true
        period:
          type: string
          example: all_time
        summary:
          type: object
          description: Each Story, Contact and entry counted once for the whole set
          properties:
            frameworks_contributed:
              type: integer
              description: How many of the set's Impact Frameworks (e.g. SDG Goals) at least one Story contributes to
            frameworks_total:
              type: integer
            stories:
              type: integer
            reached:
              type: integer
              description: Distinct Contacts (people and organisations) tagged on the counted entries
            entries:
              type: integer
            financial_value:
              type: number
        frameworks:
          type: array
          description: Every Impact Framework in the set, in order. Figures overlap, so never add them up.
          items:
            type: object
            properties:
              template_id:
                type: integer
              name:
                type: string
                example: Quality education
              short_code:
                type: string
                nullable: true
                example: "4"
              position:
                type: integer
              stories:
                type: integer
              outcomes:
                type: array
                description: The Outcomes (e.g. SDG Targets) with a contribution
                items:
                  type: object
                  properties:
                    outcome_id:
                      type: integer
                    title:
                      type: string
                    indicators:
                      type: array
                      items:
                        type: object
                        properties:
                          indicator_id:
                            type: integer
                          name:
                            type: string
                          membership:
                            type: string
                            enum: [core, linked]
                            description: "`core`: part of the framework itself; `linked`: one of the organisation's own Indicators"
                          stories:
                            type: integer
                          reached:
                            type: integer
                          financial_value:
                            type: number

    FrameworkLinkMigration:
      type: object
      properties:
        carried:
          type: array
          items:
            $ref: '#/components/schemas/FrameworkLinkReference'
        not_carried:
          type: array
          items:
            $ref: '#/components/schemas/FrameworkLinkReference'

    FrameworkLinkReference:
      type: object
      properties:
        id:
          type: integer
        indicator_id:
          type: integer
        outcome_id:
          type: integer

    FrameworkLink:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              type: integer
            charity_id:
              type: integer
            indicator_id:
              type: integer
            indicator_name:
              type: string
              example: Bootcamp completions
            outcome_id:
              type: integer
            outcome_title:
              type: string
              example: "4.4 Increase the number of youth and adults who have relevant skills"
            project_ids:
              type: array
              items:
                type: integer
              description: The projects the link counts in; empty when it counts in every project
            all_projects:
              type: boolean

    PaginatedFrameworkLinks:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FrameworkLink'

    PaginatedOutcomeIndicators:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/OutcomeIndicator'

    PaginatedRatioSets:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RatioSet'

    PaginatedSubRatios:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SubRatio'

    PaginatedRatioSetChoiceables:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RatioSetChoiceable'

    PaginatedMediaItems:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            kind_counts:
              type: object
              description: Files of each kind for the same filters, ignoring `kind`
              properties:
                all: { type: integer }
                photo: { type: integer }
                video: { type: integer }
                audio: { type: integer }
                document: { type: integer }
            data:
              type: array
              items:
                $ref: '#/components/schemas/MediaItem'

    MediaItem:
      type: object
      description: One file in the Media Gallery. It points at the file on its Story or Contact; it is not a copy.
      properties:
        id: { type: integer }
        kind: { type: string, enum: [photo, video, audio, document] }
        file_name: { type: string }
        content_type: { type: string, nullable: true }
        file_size: { type: integer, nullable: true, description: Bytes }
        caption: { type: string, nullable: true }
        source_type: { type: string, enum: [story, contact], description: "`contact` means a file on a Contact's bio" }
        source_id: { type: integer, description: Story ID or Contact (Beneficiary) ID }
        source_title: { type: string, nullable: true, description: Story title or Contact name }
        project_id: { type: integer, nullable: true, description: The Story's Project; null for Contact bio files }
        project_name: { type: string, nullable: true }
        uploaded_by_id: { type: integer, nullable: true }
        uploaded_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        thumbnail_url: { type: string, nullable: true, description: Photos only }

    MediaItemDetail:
      allOf:
        - $ref: '#/components/schemas/MediaItem'
        - type: object
          properties:
            field_name:
              type: string
              description: "Where the file sits: `Profile picture`, `<field> (file field)`, `Story attachment` or `Contact attachment`"
            download_url:
              type: string
              nullable: true
              description: Signed link that downloads the file. Null if the file has no stored address.
            download_url_expires_in:
              type: integer
              description: Seconds until `download_url` stops working

    FormDefinitionField:
      type: object
      description: One entry in `contact_form.fields` or a survey's `fields` — the same shape regardless of which form it came from.
      properties:
        id:
          type: integer
          description: The CurrentField id — key submitted answers back to the server using this, not the field name
          example: 500
        name:
          type: string
          example: "Full Name"
        field_type:
          type: string
          nullable: true
          enum: [string, text, boolean, integer, float, date, time, datetime, list, media, file, telephone, email_address, location, extended_table, section]
          description: "null for a genuinely unrecognised field"
        field_kind:
          type: string
          enum: [in_built_field, custom_field, ratio_set, indicator, change, outcome]
        order:
          type: integer
        mandatory:
          type: boolean
        options:
          type: array
          description: "{id, name} Sub Ratio options, for ratio_set/indicator fields — always submit the id, never the name"
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        choice:
          type: string
          nullable: true
          enum: [single_choice, limited_choice, unlimited_choice]
          description: Only present for ratio_set/indicator fields
        choice_max:
          type: integer
          nullable: true
          description: Only present when choice is limited_choice
        indicator_type:
          type: string
          nullable: true
          enum: [scale, binary, value]
          description: "Only present for field_kind: indicator"
        validation:
          type: object
          nullable: true
          description: Only present for CustomFields with validation configured
          properties:
            add_validation:
              type: boolean
            min_length:
              type: integer
            max_length:
              type: integer
            character_type:
              type: string
            earliest_date:
              type: string
            latest_date:
              type: string
            default_country:
              type: string
        columns:
          type: array
          items:
            type: string
          description: "Column names — only present for field_type: extended_table"
        description:
          type: string
          description: The field's Question Explanation — only present when set

    FormDefinitionSkipLogicRule:
      type: object
      properties:
        source_field_id:
          type: integer
          description: The field whose answer is the trigger
        destination_field_id:
          type: integer
          description: The field the rule affects
        kind:
          type: string
          enum: [hide_unless, jump_to]
          description: Contact forms only ever produce hide_unless; surveys can produce either
        sub_ratio_ids:
          type: array
          items:
            type: integer

    FormDefinitionFormSection:
      type: object
      description: Shared shape for contact_form and each entry in surveys
      properties:
        type:
          type: string
          example: "BeneficiaryCategory"
        id:
          type: integer
        name:
          type: string
        wave:
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormDefinitionField'
        skip_logic:
          type: array
          items:
            $ref: '#/components/schemas/FormDefinitionSkipLogicRule'
        beneficiary_role:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        beneficiary_type:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string

    FormDefinition:
      type: object
      properties:
        definition_version:
          type: string
          description: ISO 8601 timestamp identifying this snapshot of the Signup Page — echo back unchanged in the submission sync request
          example: "2026-08-28T12:00:00.000+01:00"
        signup_page:
          type: object
          properties:
            id:
              type: integer
              example: 123
            name:
              type: string
              example: "Bambanani Signup"
            description:
              type: string
              nullable: true
            link_type:
              type: string
              enum: [structured, personalised]
            status:
              type: string
              example: "activated"
            thank_you_message:
              type: string
            allow_referrer:
              type: boolean
            project:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            beneficiary_state:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            contact_form:
              $ref: '#/components/schemas/FormDefinitionFormSection'
            surveys:
              type: array
              items:
                $ref: '#/components/schemas/FormDefinitionFormSection'
            settings:
              type: object
              properties:
                redirect_after_signup:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    url:
                      type: string
                      nullable: true
                redirect_after_deactivate:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    url:
                      type: string
                      nullable: true
                delete_abandoned_beneficiary:
                  type: boolean
                hide_add_another_button_on_thank_you_page:
                  type: boolean
                display_project_image:
                  type: boolean
                see_summary:
                  type: boolean
                event_guest_person_names:
                  type: boolean
            charity:
              type: object
              properties:
                name:
                  type: string
                logo_url:
                  type: string
                  nullable: true
                hide_makerble_cobranding:
                  type: boolean
        branding:
          type: object
          nullable: true
          description: The charity's full ReferralLookAndFeel attributes, or null if none configured
          additionalProperties: true
        related_people:
          type: array
          description: Only present for a structured link — one entry per possible related person, each with a referral_link_relationship_detail_id
          items:
            type: object
            additionalProperties: true
        roles:
          type: array
          description: Only present for a personalised link — one entry per role, each with a referral_link_beneficiary_role_detail_id
          items:
            type: object
            additionalProperties: true

    SubmissionCredential:
      type: object
      description: Only present in the anonymous offline-device Form Definition response
      properties:
        signup_page_id:
          type: integer
          example: 123
        token:
          type: string
          description: Bearer token for POST /referral_submissions
        scope:
          type: string
          example: "referral_submission"
        submit_url:
          type: string
          example: "https://makerble.com/api/v2/referral_submissions"

    ReferralSubmissionRequest:
      type: object
      required: [idempotency_key, definition_version]
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: A fresh UUID v4, generated once at the moment a submission is completed (not per sync attempt). Retrying the same key returns the original result rather than creating duplicates.
        definition_version:
          type: string
          description: The definition_version the offline device's cached Form Definition was fetched with
        primary:
          type: object
          description: Present for a structured link (one primary person plus zero or more related_people)
          properties:
            contact_form_answers:
              type: object
              additionalProperties: true
              description: Keyed by field id from the Form Definition
            survey_answers:
              type: array
              items:
                type: object
                properties:
                  story_category_id:
                    type: integer
                  answers:
                    type: object
                    additionalProperties: true
        related_people:
          type: array
          description: Present for a structured link
          items:
            type: object
            properties:
              referral_link_relationship_detail_id:
                type: integer
              contact_form_answers:
                type: object
                additionalProperties: true
              survey_answers:
                type: array
                items:
                  type: object
        roles:
          type: array
          description: Present for a personalised link instead of primary/related_people — one entry per person, no "primary" concept
          items:
            type: object
            properties:
              referral_link_beneficiary_role_detail_id:
                type: integer
              contact_form_answers:
                type: object
                additionalProperties: true
              survey_answers:
                type: array
                items:
                  type: object
      example:
        idempotency_key: "8f14e45f-ceea-467e-8a4c-b1a2c9c6f2a3"
        definition_version: "2026-08-28T12:00:00.000+01:00"
        primary:
          contact_form_answers: { "500": "Jane Doe", "501": "44 7911 123456" }
          survey_answers:
            - story_category_id: 200
              answers: { "600": "Great progress this month" }
        related_people:
          - referral_link_relationship_detail_id: 12
            contact_form_answers: { "502": "Baby Doe" }
            survey_answers: []

    ReferralSubmissionResponse:
      type: object
      properties:
        idempotent_replay:
          type: boolean
          description: true if this idempotency_key had already been processed — the response reflects the original processing result, not a new one
        definition_version_mismatch:
          type: boolean
          description: true if the submitted definition_version doesn't match the Signup Page's current one. Non-blocking — surfaced but doesn't prevent processing
        created_beneficiary_ids:
          type: array
          items:
            type: integer
        created_story_ids:
          type: array
          items:
            type: integer
      example:
        idempotent_replay: false
        definition_version_mismatch: false
        created_beneficiary_ids: [4501, 4502]
        created_story_ids: [8801]

    CohortTracker:
      type: object
      properties:
        id:
          type: integer
          example: 17
        name:
          type: string
          example: "Children attending 75%+"
        description:
          type: string
          nullable: true
        charity_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        membership:
          type: string
          enum: [ever_enrolled, currently_enrolled]
          description: Membership of the Project or Album the tracker is placed on
        result_type:
          type: string
          enum: [number, percentage]
          description: Show the result as a number of Contacts, or a percentage of the denominator
        denominator:
          type: string
          enum: [members, enough_data, filtered]
          nullable: true
          description: |
            For a percentage, what it is out of: `members` (Contacts in this Project / Album),
            `enough_data` (Contacts with enough data to be judged on every data-based criterion: invited
            to an event in scope for Attendance Rate, two or more Choice Tracker responses for Distance
            Travelled Direction, a response to the question for an answer-based criterion), or `filtered`
            (members who also meet `denominator_criteria`). null for a number.
        denominator_criteria:
          type: object
          description: For a `filtered` denominator, the Contact Filter criteria the members must meet. `{}` otherwise
          example:
            group_ids: ["12"]
        criteria:
          type: object
          description: Contact Filter criteria, in the shape a Saved Filter uses
          example:
            attendance_rate: { change_id: "412", from: "75", to: "100" }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CohortTrackerDetail:
      allOf:
        - $ref: '#/components/schemas/CohortTracker'
        - type: object
          properties:
            usage:
              type: object
              properties:
                projects:
                  type: integer
                albums:
                  type: integer
                templates:
                  type: integer
            names_projects_or_albums:
              type: boolean

    CohortTrackerRequest:
      type: object
      properties:
        cohort_tracker:
          type: object
          properties:
            charity_id:
              type: integer
              description: Required when creating
            name:
              type: string
            description:
              type: string
            membership:
              type: string
              enum: [ever_enrolled, currently_enrolled]
            criteria:
              type: object
            result_type:
              type: string
              enum: [number, percentage]
              description: Default number
            denominator:
              type: string
              enum: [members, enough_data, filtered]
              description: For a percentage. Defaults to members
            denominator_criteria:
              type: object
              description: |
                Required when denominator is `filtered`: Contact Filter criteria, the same keys as `criteria`,
                for the Contacts the percentage is out of. Cleared for any other denominator
        confirm_clear_targets:
          type: boolean
          description: |
            Update only. Switching result_type between number and percentage clears the tracker's
            targets everywhere, so it is refused (422) while it has targets unless this is true.

    CohortTrackerDeadline:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-12-31"
        number:
          type: integer
          example: 40

    CohortTrackerTargetsRequest:
      type: object
      description: |
        Send target, deadlines or both. deadlines replaces the tracker's deadline targets. For a
        percentage tracker, the target and each deadline number are a whole percentage from 0 to 100.
      properties:
        target:
          type: integer
          minimum: 0
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/CohortTrackerDeadline'

    CohortTrackerPlacement:
      type: object
      properties:
        cohort_tracker_id:
          type: integer
        project_id:
          type: integer
        column:
          type: string
          enum: [activities, engagement, potential, behaviour, growth]
        target:
          type: integer
          example: 40
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/CohortTrackerDeadline'

    CohortTrackerAlbumTargets:
      type: object
      properties:
        cohort_tracker_id:
          type: integer
        album_id:
          type: integer
        album_target_type:
          type: string
          enum: [manual_target, automatic_target]
        target:
          type: integer
          example: 120
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/CohortTrackerDeadline'

    CohortTrackerResult:
      type: object
      properties:
        cohort_tracker_id:
          type: integer
        name:
          type: string
        project_id:
          type: integer
          description: Present for a Project's result
        album_id:
          type: integer
          description: Present for an Album's result
        timeframe:
          type: string
          enum: [period, year_to_date, all_time]
        starts_on:
          type: string
          format: date
          nullable: true
          description: null when the window runs from the start
        ends_on:
          type: string
          format: date
        count:
          type: integer
          description: The result, a number of distinct Contacts
        eligible_count:
          type: integer
          description: Members the criteria could judge (who have the data the criteria need)
        result_type:
          type: string
          enum: [number, percentage]
        denominator:
          type: string
          enum: [members, enough_data, filtered]
          nullable: true
        denominator_count:
          type: integer
          nullable: true
          description: For a percentage, how many Contacts it is out of. null for a number
        percentage:
          type: integer
          nullable: true
          description: count as a whole percentage of denominator_count. null for a number, or when denominator_count is 0
        target:
          type: object
          nullable: true
          properties:
            number:
              type: integer
            date:
              type: string
              format: date
              nullable: true
              description: null for the one-off target
        qualifying_value_label:
          type: string
          nullable: true
          example: Attendance rate
        cohort:
          type: string
          enum: [in, not_in]
          description: Which Contacts data lists
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          type: integer
        total_count:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              restricted:
                type: boolean
                description: true for a Contact the user may not read; no other fields are given
              id:
                type: integer
              name:
                type: string
              qualifying_value:
                type: number
                nullable: true

    PaginatedCohortTrackers:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CohortTracker'

    WorkflowTrackerAttributes:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [signpostings, internal_referrals, cases_created, cases_closed, cases_open, time_spent]
          description: What it counts
        count_mode:
          type: string
          enum: [items, contacts]
          description: "items: each signposting, referral, Case or Case closing (adds up across periods, except cases_open); contacts: each Contact once (a snapshot)"
        settings:
          type: object
          description: "internal_referrals: which Projects count as a referral. The Cases sources: the Case Form to count (null for any). time_spent: which Timesheets, and whose time. signpostings has none."
          properties:
            destinations:
              type: string
              enum: [any, only, except]
            project_ids:
              type: array
              items:
                type: integer
            case_form_id:
              type: integer
              nullable: true
              description: "Cases sources only: count only the Cases created with this one of the Organisation's Case Forms"
            kinds:
              type: array
              description: "time_spent only: which Timesheets count (default updates_and_tasks and event_staff)"
              items:
                type: string
                enum: [updates_and_tasks, event_staff, event_guests]
            user_ids:
              type: array
              description: "time_spent only: count only these colleagues' time (with roles, either counts)"
              items:
                type: integer
            roles:
              type: array
              description: "time_spent only: count only the time of people with these roles in the Organisation or the Project"
              items:
                type: string
                enum: [editor, reporter, observer]

    WorkflowTracker:
      type: object
      properties:
        id:
          type: integer
