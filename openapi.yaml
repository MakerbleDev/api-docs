  /media_items:
    get:
      tags: [Media Gallery]
      summary: List Media Gallery files
      description: |
        Lists every photo, video, audio file and document attached to Stories and to Contacts' bios in one organisation — the files shown on the **Media Gallery** page (Impact → Media Gallery).

        Only files from Stories and Contacts the user is already allowed to view are returned, so two users can get different results for the same organisation. Filters combine with AND.

        `kind_counts` gives the number of files of each kind for the same filters, ignoring `kind` — the counts on the File type buttons.
      operationId: listMediaItems
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: Organisation ID
        - name: kind
          in: query
          schema:
            type: string
            enum: [photo, video, audio, document]
          description: File type
        - name: search
          in: query
          schema:
            type: string
          description: Matches the start of words in the file name, Story title, Contact name and caption
        - name: source[]
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [stories, contacts]
          style: form
          explode: true
          description: Story files, Contact bio files, or both (default both)
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
          description: By upload date
        - name: story_filters
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          example: { project_ids: [19], story_category_ids: [327] }
          description: |
            Timeline (Story) Filters, as on the homepage. Keys (arrays of ids unless noted): `project_ids`, `story_category_ids` (Surveys), `bundle_ids` (Albums), `beneficiary_ids` (Contacts tagged in the Story), `label_ids`, `outcome_ids`, `change_ids` (Engagement), `indicator_ids`, `user_ids` (Authors), `charity_ids`, and `created_at_from` (Date Happened range, `YYYY/MM/DD - YYYY/MM/DD`).

            Story files must match them. For Contact bio files, `project_ids` matches the Contact's Project memberships, and any other key means the Contact must appear in at least one matching Story.
        - name: contact_filters
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          example: { group_ids: [4], beneficiary_types: [1] }
          description: |
            Contact Filters, as on Manage Contacts. Common keys (arrays of ids): `project_ids`, `group_ids`, `beneficiary_types` (Contact types: 1 Person, 2 Object, 3 Organisation, 4 Animal), `beneficiary_state_ids`, `created_by_ids`, `bundle_ids`.

            Contact bio files must match them, and Story files must involve at least one matching Contact.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Media Gallery files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaItems'
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                kind_counts: { all: 1, photo: 1, video: 0, audio: 0, document: 0 }
                data:
                  - id: 512
                    kind: photo
                    file_name: harvest_day.jpg
                    content_type: image/jpeg
                    file_size: 248310
                    caption: Volunteers at the allotment
                    source_type: story
                    source_id: 90211
                    source_title: Harvest day at the allotment
                    project_id: 19
                    project_name: Growing Together
                    uploaded_by_id: 6207
                    uploaded_at: "2026-09-12T10:14:00Z"
                    updated_at: "2026-09-12T10:15:02Z"
                    thumbnail_url: https://makerble.s3.amazonaws.com/medias/files/000/000/512/thumbnail/harvest_day.jpg
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user is not a member of that organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: forbidden
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /media_items/{id}:
    get:
      tags: [Media Gallery]
      summary: Get one Media Gallery file, with a download link
      description: |
        Returns one file from the **Media Gallery**, as shown in its preview panel, with a signed `download_url` that downloads the file.

        Permissions are checked again on every request. The user must still be able to view the Story or Contact the file belongs to.

        The link expires after `download_url_expires_in` seconds, so request the file again for a fresh link rather than storing it.
      operationId: getMediaItem
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The file, its field name and a short-lived download link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemDetail'
              example:
                id: 512
                kind: document
                file_name: consent_form.pdf
                content_type: application/pdf
                file_size: 84211
                caption: null
                source_type: contact
                source_id: 30144
                source_title: Jordan T.
                project_id: null
                project_name: null
                uploaded_by_id: 6207
                uploaded_at: "2026-09-12T10:14:00Z"
                updated_at: "2026-09-12T10:15:02Z"
                thumbnail_url: null
                field_name: Consent form (file field)
                download_url: https://files.example.com/medias/files/000/000/512/original/consent_form.pdf?X-Amz-Expires=300&X-Amz-Signature=...
                download_url_expires_in: 300
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The file exists, but the user can't view its Story or Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: forbidden
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints:
    get:
      tags: [Webhooks]
      summary: List an Organisation's webhook endpoints
      description: |
        The Organisation's (Charity's) webhook endpoints, without their secrets. Only the
        Organisation's admins can manage webhooks, and only once an admin has ticked **Turn on Webhooks**
        in the Organisation's Settings (otherwise `403`).
      operationId: listWebhookEndpoints
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of webhook endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookEndpoints'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: |
        Starts sending the chosen events to an HTTPS URL. Leave out `event_types` to send every
        event. An Organisation can have at most 10 endpoints. The response includes the signing
        `secret`, which is shown only this once.
      operationId: createWebhookEndpoint
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
            example:
              webhook_endpoint:
                charity_id: 913
                url: "https://crm.example.org/makerble"
                description: "Dynamics sync"
                event_types: ["contact.created", "contact.updated"]
      responses:
        "201":
          description: Endpoint created, with its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /webhook_endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Webhooks]
      summary: Get a webhook endpoint
      operationId: getWebhookEndpoint
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: The endpoint, without its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      summary: Change, pause or resume a webhook endpoint
      description: |
        Send only the fields to change. `active: false` pauses the endpoint; `active: true`
        resumes it, and also turns back on an endpoint Makerble switched off after repeated
        failure (clearing `disabled_at` and `failure_count`). Changes made while it was off are
        not sent afterwards.
      operationId: updateWebhookEndpoint
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
            example:
              webhook_endpoint:
                active: true
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: Deletes the endpoint and its delivery log. Makerble stops sending to it at once.
      operationId: deleteWebhookEndpoint
      security: [{tokenAuth: []}]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/rotate_secret:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Webhooks]
      summary: Rotate a webhook endpoint's secret
      description: |
        Replaces the signing secret and returns the new one, shown only this once. Deliveries
        are signed with it straight away.
      operationId: rotateWebhookEndpointSecret
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: The endpoint with its new secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Webhooks]
      summary: Send a test event
      description: |
        Queues a `webhook.test` event (`data: { "test": true, "message": "This is a test event from Makerble." }`) for the endpoint. Check the
        delivery log a few seconds later for the result.
      operationId: sendWebhookTestEvent
      security: [{tokenAuth: []}]
      responses:
        "202":
          description: The queued delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Webhooks]
      summary: List a webhook endpoint's deliveries
      description: The delivery log, newest first, kept for 30 days. Payloads are not included.
      operationId: listWebhookDeliveries
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookDeliveries'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: delivery_id
        in: path
        required: true
        schema:
          type: integer
        description: The delivery's ID
    post:
      tags: [Webhooks]
      summary: Send a delivery again
      description: |
        Sends the delivery again with the same event `id`, so a receiver that already processed
        it can ignore it. `data` shows the record as it is now.
      operationId: replayWebhookDelivery
      security: [{tokenAuth: []}]
      responses:
        "202":
          description: The delivery, queued again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: X-User-Token
      description: |
        Long-lived token from `POST /users/sign_in`. Does not expire.
        Must be accompanied by `X-User-Email` header.
    submissionBearerAuth:
      type: http
      scheme: bearer
      description: |
        A `ReferralLinkSubmissionCredential` token, scoped to a single Signup Page —
        obtained from `submission_credential.token` in the Offline Collector's Form
        Definition response, **not** a Devise session or `X-User-Email`/`X-User-Token`
        pair. Used only by `POST /referral_submissions`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Unique integer identifier
    CohortTrackerAlbumId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: integer
      description: The Album (Bundle) ID
    CohortTrackerProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
      description: The Project ID
    CohortTrackerTimeframe:
      name: timeframe
      in: query
      required: false
      schema:
        type: string
        enum: [period, year_to_date, all_time]
        default: all_time
      description: |
        period: the day after the previous Target Deadline up to the deadline. year_to_date: the
        start of the Project's or Album's year up to the deadline. all_time: everything up to the deadline.
    CohortTrackerAsOf:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: The deadline the window ends on. Defaults to the next Target Deadline, or today when there is none.
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (default 1)
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        maximum: 200
      description: Records per page (default 10, max 200)
    LastSyncDatetime:
      name: last_sync_datetime
      in: query
      schema:
        type: string
        example: "2023-07-30 08:48:55.781228"
      description: ISO 8601 datetime — returns only records updated after this value
    FilteredMetricProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
      description: The Project ID
    FilteredMetricBundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: integer
      description: The Album (Bundle) ID
    FilteredMetricId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: The filtered version's ID
    FilteredMetricTimeframe:
      name: timeframe
      in: query
      schema:
        type: string
        enum: [period, year_to_date, all_time]
        default: all_time
      description: |
        `period`: from the day after the previous Target Deadline; `year_to_date`: from the Year
        Start; `all_time`: everything. Each ends at `as_of`.
    FilteredMetricAsOf:
      name: as_of
      in: query
      schema:
        type: string
        format: date
      description: The date the timeframe ends (YYYY-MM-DD). Defaults to the next Target Deadline, or today.
    IncludePublicLibrary:
      name: include_public_library
      in: query
      schema:
        type: boolean
        default: false
      example: true
      description: Also include Indicators from the public library shared by all organisations (default false)

  responses:
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "You need to sign in before continuing."
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Record not found."
    Forbidden:
      description: The user doesn't have permission for this Project or organisation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              errors:
                type: string
          example:
            success: false
            errors: "Permission denied."
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityList:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
          example:
            errors: ["Name can't be blank"]
    ForbiddenError:
