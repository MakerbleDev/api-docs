        details, custom fields and Dropdowns with their answer choices), the Surveys and Waves
        available for Self Check-in, the Project's Signup Pages, the Guest Statuses a Signup Page
        can put guests into, and the Event Roles. Pass event_id to get the Edit Event form for an
