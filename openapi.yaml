        of the period results. `target` is the tracker's deadline target on the window's last day, or
        else its one-off target; targets are never summed across deadlines.

        `data` lists the Contacts in the cohort alphabetically, with `qualifying_value` (named by
        `qualifying_value_label`, e.g. an attendance rate as a percentage) where the criteria have one.
        A Contact the user may not read is listed as `{restricted: true}` with no details, so the
        list always adds up to `count`. Requires the same rights as viewing that Results Canvas.

        A percentage tracker also returns `denominator_count` and `percentage`, as the canvas shows
        "84% Children attending 75%+" with "42 of 50 contacts with enough data". The cohort is always
        within the denominator. `percentage` is a whole number, or null when `denominator_count` is 0
