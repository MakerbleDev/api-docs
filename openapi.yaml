components:

  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: X-User-Token
      description: |
        Long-lived token from `POST /users/sign_in`. Does not expire.
        Must be accompanied by `X-User-Email` header.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Unique integer identifier
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (default 1)
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        maximum: 200
      description: Records per page (default 10, max 200)
    LastSyncDatetime:
      name: last_sync_datetime
      in: query
      schema:
        type: string
        example: "2023-07-30 08:48:55.781228"
      description: ISO 8601 datetime — returns only records updated after this value

  responses:
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "You need to sign in before continuing."
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Record not found."
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Timestamps:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T09:30:00.000+00:00"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T09:30:00.000+00:00"

    PaginationEnvelope:
      type: object
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 10
        page_count:
          type: integer
          example: 42
        total_count:
          type: integer
          example: 418

    PaginatedGeneric:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object

    AuthResponse:
      type: object
      properties:
        user_id:
          type: integer
          example: 42
        email:
          type: string
          format: email
          example: user@example.com
        authentication_token:
          type: string
          description: Long-lived token. Does not expire.
          example: "sJxyz_abc123longtoken"

    Charity:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              type: integer
              example: 31
            name:
              type: string
              example: "Greenfield Community Trust"

    Project:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
