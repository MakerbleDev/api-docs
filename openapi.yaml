  /projects:
    get:
      tags: [Projects]
      summary: List all Projects
      description: |
        Returns all Projects accessible to the authenticated user. Every Story and Case belongs to a Project.

        Users hold one of three roles per Project:

        | Role | API name | Front-end | Permissions |
        |---|---|---|---|
        | Editor | `editor` | Manager | Admin — edit Project, manage users |
        | Reporter | `reporter` | Changemaker | Create Stories |
        | Observer | `observer` | Analyst | Read-only |
      operationId: listProjects
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create a Project
      description: |
        Creates a Project in an Organisation, as the **Create Project** page does, with the same permissions:
        you must be allowed to create projects there (an Organisation Admin, or a colleague with project creation
        switched on). Project Reporters and Observers can't. You become the Project's Manager unless you send
        `project.editor_ids`. The Project Category's Surveys are added to the Project, and any Project Automation
        the new Project matches is applied.

        Get the Project Types and the Organisation's Project Categories, with each category's form fields, from
        `GET /projects/form` first. Before creating a Project, check with `GET /projects` that the Organisation
        doesn't already have it.
      operationId: createProject
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [charity_id, project]
                  properties:
                    charity_id:
                      type: integer
                      description: The Organisation to create the Project in.
                      example: 31
                - $ref: '#/components/schemas/ProjectSaveRequest'
            example:
              charity_id: 31
              project:
                name: "Youth Mentoring"
                project_type_id: 4
                project_category_id: 88
                help_statement: "Weekly mentoring for 14 to 18 year olds"
                reporter_ids: [237]
              story_category_ids: [1203]
              privacy: only_charity_colleagues
      responses:
        "201":
          description: The new Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /projects/form:
    get:
      tags: [Projects]
      summary: Get the Create Project form
      description: |
        What the **Create Project** form offers in an Organisation: the Project Types (each with its solutions)
        and the Organisation's Project Categories. Each category lists its form fields in order:

        - `standard` fields, with the `parameter` that sets them (e.g. `project[help_statement]` for Short
          Description, `project[reporter_ids]` for Changemakers);
        - `custom_field` questions, answered under `custom_fields` by their `field_id`;
        - `dropdown` fields, whose choices go under `sub_ratios` by their `field_id`.

        `is_mandatory` marks the fields the form requires. Returns 404 for an Organisation you don't work in.
      operationId: getProjectForm
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          description: The Organisation the Project is for.
          schema:
            type: integer
            example: 31
      responses:
        "200":
          description: The Create Project form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectForm'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

