        "404":
          $ref: '#/components/responses/NotFound'

  /metrics/{id}/copy:
    post:
      tags: [Outcomes]
      summary: Copy a metric (an Output, Outcome or Indicator)
      description: >-
        Copies an Output (API: Change), an Outcome or an Indicator (Progress Tracker), as on a metric's page in Makerble.
        The copy is called "Copy of <original name>" (numbered, e.g. "Copy of X (2)", when that name is taken), keeps the
        original's owner, settings, survey question wording and levels, and is not added to any Project, Survey or
        Impact Framework. A copied Indicator keeps the original's Outcomes; a copied Outcome keeps the original's
        Indicators. Only someone who can edit the original may copy it.
      operationId: copyMetric
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metric_class]
              properties:
                metric_class:
                  type: string
                  enum: [Change, Indicator, Outcome]
                  description: What kind of metric `id` is.
            example:
              metric_class: Indicator
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  metric_class: {type: string, enum: [Change, Indicator, Outcome]}
                  name: {type: string}
                  owner_type: {type: string, enum: [Charity, User]}
                  owner_id: {type: integer}
                  copied_from_id: {type: integer}
              example:
                id: 912
                metric_class: Indicator
                name: Copy of Hours of sleep
                owner_type: Charity
                owner_id: 42
                copied_from_id: 311
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /outcome_indicators:
    get:
      tags: [Outcome Indicators]
      summary: List all Outcome Indicators
      description: Join table pairing Outcomes with Indicators (many-to-many). Use to find the `outcome_id` when creating story indicator responses.
      operationId: listOutcomeIndicators
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOutcomeIndicators'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /framework_sets:
    get:
      tags: [Framework Sets]
      summary: List the Framework Sets an organisation can use
      description: |
        A Framework Set groups Impact Frameworks (backend: templates) into one thing an organisation
        reports its contribution towards, e.g. the 17 SDG Impact Frameworks form "UN Sustainable
        Development Goals". Returns the live sets available to the organisation (platform sets, sets of
        Networks it belongs to, and its own sets), plus the draft sets the user can edit.
      operationId: listFrameworkSets
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The organisation (Charity) whose available sets to list. The user must belong to it.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Framework Sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFrameworkSets'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Framework Sets]
      summary: Create a Framework Set
      description: |
        Creates a Framework Set from existing Impact Frameworks (and, optionally, new ones named in
        `new_frameworks`). Who can use it is set by `availability`: `platform` (every organisation,
        System Access users only), `network` (organisations in `network_id`, that Network's admins) or
        `charity` (the organisation in `charity_id` only, its organisation admins).
      operationId: createFrameworkSet
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameworkSetInput'
            example:
              charity_id: 913
              name: Our strategy 2027
              level1_singular: Objective
              level1_plural: objectives
              level2_singular: Key result
              level2_plural: key results
              availability: charity
              status: live
              frameworks:
                - template_id: 1475
                  short_code: O1
                  colour: "#C5192D"
                  text_colour: "#FFFFFF"
      responses:
        "201":
          description: The created Framework Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkSet'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /framework_sets/{id}:
    get:
      tags: [Framework Sets]
      summary: Get a Framework Set
      description: A Framework Set with its Impact Frameworks in order, and the Financial Values it defines per Outcome.
      operationId: getFrameworkSet
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Framework Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkSet'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Framework Sets]
      summary: Update a Framework Set
      description: |
        Updates a Framework Set the user can edit. Send `frameworks` to replace the list of Impact
        Frameworks (in order), and `financial_values` to replace the Financial Value defined for each
        Outcome. `charity_id` is the organisation the user is acting for.
      operationId: updateFrameworkSet
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameworkSetInput'
            example:
              charity_id: 913
              name: Our strategy 2027 (revised)
              availability: charity
              value_source: set_values
              frameworks:
                - template_id: 1475
              financial_values:
                - outcome_id: 5521
                  financial_value_id: 88
      responses:
        "200":
          description: The updated Framework Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkSet'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /framework_sets/{id}/contribution:
    get:
      tags: [Framework Sets]
      summary: Get an organisation's contribution to a Framework Set
      description: |
        The figures on the Contribution page: which Impact Frameworks (e.g. SDG Goals) and Outcomes (e.g.
        SDG Targets) in the set the organisation's Stories contribute to. A Story counts when it records
        a value against an Indicator inside an Outcome as a Core indicator, or as one of the
        organisation's Linked indicators whose project scope includes the Story's project. Draft
        Stories never count.

        `summary` counts each Story, Contact (person or organisation reached) and indicator entry once
        for the whole set. `financial_value` is the value the counted entries generate, worked out the
        way each project's Financial Calculator works it out, or from the set's own Financial Values
        when the set defines them. The per-framework and per-Outcome figures overlap (an entry linked
        to two Outcomes appears under both), so never add them up into a total. Core indicators that
        no Story records are listed with zero Stories.
      operationId: getFrameworkSetContribution
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The organisation (Charity) whose contribution to report. The user must belong to it.
        - name: project_id
          in: query
          schema:
            type: integer
          description: Only count Stories in this project of the organisation.
        - name: bundle_id
          in: query
          schema:
            type: integer
          description: Only count Stories in the projects of this Album (Bundle) of the organisation.
        - name: period
          in: query
          schema:
            type: string
            enum: [all_time, last_12_months, financial_year, custom]
            default: all_time
          description: "`financial_year` starts on 5 April. `custom` uses `from` and `to`."
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: First day of a custom period
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Last day of a custom period
      responses:
        "200":
          description: The contribution figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkContribution'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'

  /framework_sets/{id}/migrate_links:
    post:
      tags: [Framework Sets]
      summary: Copy Linked indicators onto a new version of a Framework Set
      description: |
        For a Framework Set that replaces an older version (`supersedes_id`), copies the organisation's
        Linked indicators from the older version onto this one, wherever the same Outcome is in this
        version, either as the same Outcome or as one with the same title. Project scopes are kept.
        The links on the older version stay, so its reports don't change. Returns the links carried
        across and those that couldn't be, because this version has no matching Outcome. Needs an
        organisation admin.
      operationId: migrateFrameworkLinks
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id]
              properties:
                charity_id:
                  type: integer
                  description: The organisation whose links to copy. The user must be one of its admins.
            example:
              charity_id: 913
      responses:
        "200":
          description: The links carried across, and those that could not be
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkLinkMigration'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'

  /framework_links:
    get:
      tags: [Framework Sets]
      summary: List an organisation's Linked indicators
      description: |
        A Linked indicator is one of the organisation's own Indicators linked to an Outcome (e.g. an SDG
        Target) in a Framework Set it can use. Every Story recorded against the Indicator then counts
        towards that Outcome, in every project or only in the projects listed.
      operationId: listFrameworkLinks
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The organisation (Charity) whose links to list. The user must belong to it.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Linked indicators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFrameworkLinks'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Framework Sets]
      summary: Link an Indicator to an Outcome in a Framework Set
      description: |
        Links one of the organisation's Indicators (one it owns or one used in its projects) to an
        Outcome in a Framework Set available to it. Leave `project_ids` empty to count it in every
        project. If the link already exists for some projects, the new projects are added to it.
        Requires an organisation admin.
      operationId: createFrameworkLink
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id, indicator_id, outcome_id]
              properties:
                charity_id:
                  type: integer
                indicator_id:
                  type: integer
                outcome_id:
                  type: integer
                project_ids:
                  type: array
                  items:
                    type: integer
            example:
              charity_id: 913
              indicator_id: 2201
              outcome_id: 5521
              project_ids: [3104]
      responses:
        "201":
          description: The Linked indicator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkLink'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /framework_links/{id}:
    delete:
      tags: [Framework Sets]
      summary: Remove a Linked indicator
      description: Requires an organisation admin of the organisation in `charity_id`.
      operationId: deleteFrameworkLink
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'

  /ratio_sets:
    get:
      tags: [Ratio Sets]
      summary: List all Ratio Sets (Dropdown/List fields)
      description: |
        Reusable dropdown field definitions. Each has a type:
        - **Identity** — for Beneficiary Categories (Contact Bio Forms)
        - **Progress** — for Scale Indicators
      operationId: listRatioSets
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Ratio Sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRatioSets'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /ratio_sets/{id}/records_populated:
    get:
      tags: [Ratio Sets]
      summary: Count the records holding answers from a Dropdown
      description: |
        Records populated on Manage Dropdowns. For a Dropdown (Ratio Set), how many Contacts, Stories, Projects and
        Events hold an option chosen from it, and how many Surveys and Ideas are set up with its options, in each
        organisation the user is an Organisation Admin of. `external_usage` says whether records outside those
        organisations hold any, without counting them. A Dropdown can be deleted (`deletable`) once it is in no form
        and no record holds answers from it.
      operationId: getRatioSetRecordsPopulated
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Records holding answers, per organisation
          content:
            application/json:
              schema:
                type: object
                required: [ratio_set_id, title, deletable, records]
                properties:
                  ratio_set_id:
                    type: integer
                    example: 412
                  title:
                    type: string
                    example: Do you have a Freedom Pass?
                  deletable:
                    type: boolean
                    example: false
                  records:
                    type: array
                    items:
                      type: object
                      required: [record, organisations, external_usage]
                      properties:
                        record:
                          type: string
                          enum: [Contacts, Stories, Projects, Events, Surveys, Ideas]
                        organisations:
                          type: array
                          items:
                            type: object
                            required: [id, name, count]
                            properties:
                              id:
                                type: integer
                                example: 16
                              name:
                                type: string
                                example: Riverside Trust
                              count:
                                type: integer
                                example: 1
                        external_usage:
                          type: boolean
                          example: false
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /sub_ratios:
    get:
      tags: [Sub Ratios]
      summary: List all Sub Ratios (Answer Choices)
      description: |
        Individual answer choices within Ratio Sets. Filter by `ratio_set_ids[]`.

        Use returned IDs as `sub_ratio_id` when submitting Scale Indicator responses in a Story.
      operationId: listSubRatios
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - name: "ratio_set_ids[]"
          in: query
          schema:
            type: integer
          description: Filter by Ratio Set ID (repeat for multiple)
      responses:
        "200":
          description: Paginated list of Sub Ratios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubRatios'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /sub_ratios/{id}:
    get:
      tags: [Sub Ratios]
