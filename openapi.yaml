            example:
              target: 40
              deadlines:
                - { date: "2026-06-30", number: 20 }
      responses:
        "200":
          description: Targets saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTrackerPlacement'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit this Project's targets
        "404":
          $ref: '#/components/responses/NotFound'
