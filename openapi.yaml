        "200":
          description: The Cohort Tracker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Cohort Trackers]
      summary: Update a Cohort Tracker
      description: |
        Updates the fields sent. Changes apply everywhere the tracker is used. Requires an
        Organisation editor, or the reporter who created it.

        Switching `result_type` between a number of Contacts and a percentage clears the tracker's
        targets on every Project and Album, because the two aren't comparable. While it has targets,
        the switch is refused (422, "Switching result type clears this tracker's N targets. Confirm to
        continue.") unless `confirm_clear_targets` is true.
      operationId: updateCohortTracker
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CohortTrackerRequest'
            example:
              cohort_tracker:
                name: "Children attending 80%+"
      responses:
        "200":
          description: Cohort Tracker updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit this Cohort Tracker
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Cohort Trackers]
      summary: Delete a Cohort Tracker
      description: Refused (422) while the tracker is used on any Project, Album or Scorecard Template.
      operationId: deleteCohortTracker
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "204":
          description: Deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't delete this Cohort Tracker
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

