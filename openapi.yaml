  /beneficiaries/bulk_project_moves:
    post:
      tags: [Beneficiaries]
      summary: Move many Contacts through Projects at once
      description: |
        Adds many Contacts (Beneficiaries) to Projects, changes their status (Beneficiary State, e.g.
        Enrolled, Waiting List, Alumni, Declined) in them, or removes them from them, in one request.
        This is **Move through projects** for the Contacts selected on the Manage Contacts page. Each
        change is made the same way as moving one Contact from their profile, so it appears in each
        Contact's History and the Project's team is notified.

        **Which Contacts.** Either
        - `beneficiary_ids`: at most 500 Contacts of the organisation; or
        - everyone matching `filter_data` (the Manage Contacts filters, e.g.
          `{"project_ids": ["572"], "beneficiary_state_ids": ["1"]}`), leaving out `excluded_ids`. Give
          `project_id` as a shortcut for the Project filter. With neither, every Contact the user can
          see in the organisation is selected.

        **What changes.** `changes` lists one entry per Project: `project_id` and `state`, which is a
        status id switched on for that Project (`beneficiary_states` in `GET /projects/{id}`) or
        `remove`. Projects must be open (not closed) and in the organisation.

        **Skipped Contacts.** Contacts are skipped, not refused, and counted in `skip_counts`:
        - `headline_only`: the user only has Headline Only Access to them;
        - `not_allowed`: the user may not move them between Projects (Organisation Editors, Reporters
          and Observers may move any Contact; others only Contacts they may edit).
        A Contact already in the chosen status, or not in a Project they'd be removed from, is left as
        they are and isn't counted as changed.

        **Small and large requests.** Up to 50 Contacts change straight away and the reply is `200`
        with the counts. More than 50 run in the background: the reply is `202` with an `id`, and
        `GET /beneficiaries/bulk_project_moves/{id}` reports the progress until `status` is
        `completed` or `failed`. The user also gets a notification when it finishes.

        `charity_id` may be left out when the user belongs to one organisation. Not available to
        connected apps (OAuth tokens) yet.
      operationId: moveBeneficiariesThroughProjects
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                charity_id:
                  type: integer
                  description: The organisation whose Contacts to move
                beneficiary_ids:
                  type: array
                  maxItems: 500
                  items: { type: integer }
                  description: The Contacts to move, at most 500. Leave out to use filter_data instead.
                filter_data:
                  type: object
                  additionalProperties: true
                  description: Manage Contacts filters selecting the Contacts, used when beneficiary_ids is left out
                project_id:
                  type: integer
                  description: Shortcut for the Project filter (Contacts in this Project)
                excluded_ids:
                  type: array
                  items: { type: integer }
                  description: Contacts matching the filters to leave out
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [project_id, state]
                    properties:
                      project_id:
                        type: integer
                      state:
                        description: A status id switched on for the Project, or `remove`
                        oneOf:
                          - type: integer
                          - type: string
                            enum: [remove]
            example:
              charity_id: 12
              beneficiary_ids: [160498, 160499, 160500]
              changes:
                - project_id: 572
                  state: 3
                - project_id: 573
                  state: remove
      responses:
        "200":
          description: The Contacts were moved straight away
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkProjectMove'
              example:
                id: 41
                status: completed
                total_count: 3
                processed_count: 3
                changed_count: 2
                skip_counts: { headline_only: 1 }
                background: false
                summary: "2 contacts changed. 1 skipped: 1 because you have Headline Only Access to them."
        "202":
          description: More than 50 Contacts, so the move runs in the background. Poll GET /beneficiaries/bulk_project_moves/{id}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkProjectMove'
              example:
                id: 42
                status: pending
                total_count: 812
                processed_count: 0
                changed_count: 0
                skip_counts: {}
                background: true
                summary: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'
  /beneficiaries/bulk_project_moves/{id}:
    get:
      tags: [Beneficiaries]
      summary: Get the progress of a bulk project move
      description: |
        The progress of a move started with `POST /beneficiaries/bulk_project_moves`. Only the user
        who started it can see it. `status` is `pending`, `running`, `completed` or `failed`;
        `processed_count` of `total_count` Contacts have been reached so far, and `summary` is filled in
        once it has finished.
      operationId: getBulkProjectMove
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The move's progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkProjectMove'
              example:
                id: 42
                status: running
                total_count: 812
                processed_count: 240
                changed_count: 231
                skip_counts: { not_allowed: 9 }
                background: true
                summary: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
  /project_beneficiaries:
    get:
      tags: [Beneficiaries]
      summary: List Project–Beneficiary associations
      description: >
        Join table linking Contacts (Beneficiaries) to Projects (many-to-many). Only projects the
        authenticated user can see are included. Use project_ids to narrow the results to specific
        projects; it can never widen them to projects the user cannot see.
      operationId: listProjectBeneficiaries
      security: [{tokenAuth: []}]
      parameters:
        - name: project_ids
          in: query
          required: false
          description: >
            Only include these projects. Send as repeated project_ids[]=12&project_ids[]=34, or as a
            JSON array string (project_ids=[12,34]).
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
          example: [12, 34]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Project–Beneficiary records (id, project_id, beneficiary_id, created_at, updated_at)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneric'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Beneficiaries]
      summary: Add existing Contacts to a Project
      description: |
        Adds existing Contacts (Beneficiaries) to a Project, all with one status (Beneficiary State,
        e.g. Enrolled or Waiting List). This is the same as "Assign Contacts to projects" on the
        Contacts page: each Contact added gets an entry on their activity timeline, and the Project's
        team is notified. It doesn't create Contacts: use `POST /beneficiaries` for that.

        Use it before `POST /project_story_categories/{id}/survey_links` with `beneficiary_ids`, when
        the Contacts aren't in the Survey Campaign's Project yet.

        - `beneficiary_state_id` is optional. Without it the Contacts are Enrolled, or get the
          Project's first status if Enrolled is switched off. `GET /projects/{id}` lists the
          statuses switched on in `beneficiary_states`.
        - A Contact already in the Project is left as they are (their status doesn't change) and is
          returned with `already_in_project: true`.
        - Nothing is added if any Contact is refused.
        - The Project must be open (not closed).

        Requires an Organisation Editor, Reporter or Observer, or a user who may edit the Contact
        (a Project Editor, or a Project Reporter if the organisation allows it, of a Project the
        Contact is in).
      operationId: addProjectBeneficiaries
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, beneficiary_ids]
              properties:
                project_id:
                  type: integer
                  description: The Project to add the Contacts to
                beneficiary_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: integer
                  description: Contacts of the Project's organisation, at most 200
                beneficiary_state_id:
                  type: integer
                  description: Optional Contact status, from `beneficiary_states` in GET /projects/{id}
            example:
              project_id: 572
              beneficiary_ids: [160498, 160499]
              beneficiary_state_id: 3
      responses:
        "201":
          description: One entry per Contact, in the order given
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The Project–Contact link
                        project_id:
                          type: integer
                        beneficiary_id:
                          type: integer
                        beneficiary_state_id:
                          type: integer
                          nullable: true
                          description: The Contact's status in the Project
                        already_in_project:
                          type: boolean
                          description: The Contact was already in the Project and was left as they were
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
              example:
                data:
                  - id: 88121
                    project_id: 572
                    beneficiary_id: 160498
                    beneficiary_state_id: 3
                    already_in_project: false
                    created_at: "2026-10-22T10:15:00.000Z"
                    updated_at: "2026-10-22T10:15:00.000Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user may not move these Contacts between Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors: ["You do not have permission to move these contacts between projects: 160498."]
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: |
            Invalid request: ids that aren't Contacts of the Project's organisation (listed in
            `beneficiary_ids_not_found`; the same whether the Contact is in another organisation or
            doesn't exist), a status not switched on for the Project, a closed Project, no ids, or more
            than 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  beneficiary_ids_not_found:
                    type: array
                    items:
                      type: integer
              example:
                errors: ["These contacts were not found in the project's organisation: 9876."]
                beneficiary_ids_not_found: [9876]


