openapi: 3.0.3
info:
  title: Makerble API
  description: |
    The Makerble API enables developers to integrate with the Makerble CRM and impact measurement platform — reading and writing data on contacts, projects, surveys, cases, outcomes, metrics, and more.

    ## Base URL
    ```
    https://makerble.com/api/v2
    ```
    A staging environment is also available at `https://staging.makerble.com/api/v2`.

    ## Authentication
    All endpoints (except `/users/sign_in` and the password reset endpoints) require token-based authentication. Pass both headers on every authenticated request:

    | Header | Value |
    |---|---|
    | `X-User-Email` | The authenticated user's email address |
    | `X-User-Token` | The user's long-lived authentication token |

    Tokens are obtained via `POST /users/sign_in` and **do not expire**. Each user has one fixed token.

    > **Multi-user integrations:** If activity must be attributed to specific users, authenticate separately per user. A single Organisation Admin token is acceptable when attribution to one admin is sufficient.

    ## Creating Users via the API
    `POST /users` requires a separate API Key (`auth_code`). Request one at [api-key-request@makerble.com](mailto:api-key-request@makerble.com).

    ## Terminology
    Makerble uses different terms in the UI and the API:

    | Front-end | API |
    |---|---|
    | Organisation | Charity |
    | Contact | Beneficiary |
    | Contact Bio Form | Beneficiary Category |
    | Contact Type | Beneficiary Type |
    | Survey | Story Category |
    | Survey Campaign | Project Story Category |
    | Survey Response / Timeline Update / Instant Update | Story |
    | Activity / Engagement tracker | Change (stage: activity / participation) |
    | Achievement / Choice / Numerical tracker | Indicator (type: binary / scale / value) |
    | Dropdown / List field | Ratio Set |
    | Answer Choice | Sub Ratio |
    | Case Form | Custom Field Category |
    | Case Owner | Case Creator |
    | Case Worker | Case Member |
    | Project Manager | Project Editor |
    | Changemaker | Project Reporter |
    | Analyst | Project Observer |
    | Signup Page | Referral Link Detail |

    ## Story timestamps
    Stories carry three timestamps:

    | API field | Front-end label | Meaning |
    |---|---|---|
    | `actual_created_at` | Date Posted | Real database insertion time |
    | `created_at` | Date Happened | Activity date chosen by the user (can be backdated) |
    | `updated_at` | Date Edited | Most recent modification |

    ## Pagination
    All list endpoints accept:

    | Parameter | Type | Default | Max | Description |
    |---|---|---|---|---|
    | `page` | integer | 1 | — | Page number |
    | `per_page` | integer | 10 | 200 | Records per page |
    | `last_sync_datetime` | string (ISO 8601) | — | — | Return only records updated after this datetime |

    Paginated responses use this envelope:
    ```json
    { "page": 1, "page_size": 10, "page_count": 146, "total_count": 1458, "data": [] }
    ```

    ## Webhooks
    Instead of polling, an Organisation's admins can register **webhook endpoints**: HTTPS URLs that Makerble sends a signed JSON `POST` to when records change. Manage them under **Connect > Webhooks** or with the Webhooks endpoints below. An Organisation's admin turns webhooks on by ticking **Turn on Webhooks** in the Organisation's Settings (Preferences) page; until then those endpoints answer `403`.

    | Event | Sent when | `data` |
    |---|---|---|
    | `contact.created` | A Contact is created | Same as `GET /beneficiaries/{id}` |
    | `contact.updated` | A Contact is edited, including its Contact Type or a dropdown answer (not when only counts Makerble keeps up to date change) | Same, plus `changed_fields` on the envelope. A changed dropdown is listed as `custom_fields.<dropdown title>` |
    | `contact.deleted` | A Contact is deleted (archived), or removed for good without being archived first | `id`, `deleted_at`. No name or other personal data |
    | `contact.merged` | A Contact is merged into another Contact. No `contact.deleted` is sent for it | `kept_contact_id`, `merged_contact_ids`, `merged_at` |
    | `contact.restored` | A deleted Contact is restored, or a merge is undone | Same as `GET /beneficiaries/{id}` |
    | `story.created` | A Story is posted, about 30 seconds later so its survey answers are included (not drafts) | Same as `GET /stories/{id}` |
    | `story.updated` | A Story is edited, including a draft being published | Same |
    | `story.deleted` | A Story is deleted (not drafts) | `id`, `project_id`, `contact_ids`, `deleted_at` |
    | `project.created` / `project.updated` | A Project is created / edited. Closing (archiving) or reopening a Project is an edit | Same as `GET /projects/{id}` |
    | `project.deleted` | A Project is deleted | `id`, `name`, `deleted_at` |
    | `project.contact_added` / `project.contact_removed` | A Contact joins / leaves a Project (not when the Contact is being deleted, and not from imports) | `project_id`, `project_name`, `contact_id`, `contact_state` (the Contact's state in the Project, e.g. `Enrolled`) |
    | `import.completed` | A spreadsheet import has processed every row. Rows of an import send no events of their own | `import_id`, `import_type`, `kind`, `status`, `counts`, `charity_id` |
    | `webhook.test` | Someone sends a test event | `{ "test": true, "message": "This is a test event from Makerble." }` |

    `*.updated` events are sent about 10 seconds after the change, so several saves of one change (publishing a draft Story saves it more than once) arrive as one event showing the latest state.

    The `data` of `contact.deleted`, `contact.merged`, `story.deleted`, `project.deleted` and the `project.contact_*` events is recorded when the event happens, as the record may be gone by the time it is sent.

    A webhook created before an event existed doesn't receive it until an admin ticks it under **Send a message when**. New webhooks receive every event unless unticked.

    Bulk actions (merging many Contacts, adding many Contacts to a Project, undoing an import) still send one event per record. Once an endpoint has 100 events waiting, further ones are spaced out at 5 a second, so a bulk action on thousands of records may take some minutes to arrive in full.

    Every request has this body:
    ```json
    {
      "id": "evt_6f0c2a4e-8d1b-4b7e-9a53-2f1d6c3e9b10",
      "event": "contact.updated",
      "occurred_at": "2026-10-04T09:15:00Z",
      "charity_id": 123,
      "changed_fields": ["name", "mobile"],
      "data": { "id": 456, "name": "Ada Lovelace" }
    }
    ```
    `data` shows the record as it is when the request is sent, which can be newer than `occurred_at`. New fields may be added to `data` over time.

    Headers: `X-Makerble-Event` (the event), `X-Makerble-Delivery` (the `id`), `User-Agent: Makerble-Webhooks/1` and `X-Makerble-Signature: t=<unix time>,v1=<signature>`.

    **Verify the signature** before trusting a request. `v1` is the hex HMAC-SHA256 of `"<t>.<raw request body>"`, keyed with the endpoint's secret (shown once, when the endpoint is created or its secret is rotated). Reject old timestamps to stop replays:
    ```ruby
    t, v1 = request.headers['X-Makerble-Signature'].split(',').map { |part| part.split('=', 2).last }
    expected = OpenSSL::HMAC.hexdigest('SHA256', secret, "#{t}.#{request.raw_post}")
    valid = Rack::Utils.secure_compare(expected, v1) && (Time.now.to_i - t.to_i).abs < 300
    ```

    **Respond with any 2xx within 10 seconds.** Anything else, a timeout or a refused connection is retried 8 more times over about 25 hours (after 1 and 5 minutes, then 15 minutes, 1, 2, 4, 8 and 10 hours). Redirects are not followed. After 10 deliveries in a row fail, or 7 days without a success, Makerble switches the endpoint off and emails the Organisation's admins; turn it back on with `PATCH /webhook_endpoints/{id}` and `active: true`.

    Delivery is **at least once** and in no guaranteed order: de-duplicate on `id`, and use `occurred_at` (or fetch the record) where order matters. Delivery logs are kept for 30 days and any delivery can be sent again with its replay endpoint.

  version: "2.0.0"
  contact:
    name: Makerble Support
    url: https://discover.makerble.com
    email: support@makerble.com
  license:
    name: Proprietary

servers:
  - url: https://makerble.com/api/v2
    description: Production
  - url: https://staging.makerble.com/api/v2
    description: Staging
  - url: /mock
    description: Mock server (safe for testing — no real data)

tags:
  - name: Authentication
    description: Obtain and manage authentication tokens
  - name: Users
    description: Platform users with login credentials
  - name: Charities
    description: Organisations — the top-level entity that owns Projects
  - name: Projects
    description: The primary organisational unit — every Story and Case belongs to a Project
  - name: Albums
    description: Albums (Bundles; being renamed Portfolios on screen) group Projects so their results can be seen together
  - name: Age Bands
    description: |
      Age bands worked out from each Contact's (Beneficiary's) Date of Birth, as of today. An
      Organisation always has age bands (by default 0–12, 13–17, 18–24 and 25 and over); an Album or
      Project can have its own, and otherwise uses its Organisation's. The Demographics tab of
      Manage Contacts and the Snapshot use the same bands.
  - name: Focus
    description: |
      Focus under Today: one list of everything that needs the signed-in user, grouped by when it's
      due (Overdue, Today, This week, Later) and filtered by type. The first source is Checklist
      Actions: the next step on each Contact's Checklist that the user is responsible for.
  - name: Start page
    description: |
      The page the signed-in user lands on after signing in, and whenever they click Home or the
      Makerble logo: one of the Today pages, chosen under Personal Settings › Preferences › Start page.
  - name: Snapshot
    description: |
      The Snapshot under Today: one Album's (Portfolio's) or Project's headline numbers on one page.
      "Who we're working with" shows how its Contacts (Beneficiaries) split by Ratio Set, by age band
      and, on an Album, by Project; "How the work is going" shows one headline number per Results
      Canvas column; "Workload" shows up to three Workflow, Cohort or Formula Trackers. The Album's or
      Project's editors choose what goes on it on the Snapshot tab of its Preferences.
  - name: Beneficiaries
    description: Contacts — the people your organisation works with
  - name: Beneficiary Categories
    description: Contact Bio Forms — field schemas for creating and editing Beneficiary records
  - name: Beneficiary Types
    description: The four contact types — Person, Organisation, Animal, Object
  - name: Cases
    description: Cases linked to a Beneficiary and a Project
  - name: Stories
    description: Survey responses, timeline updates, and instant updates — the primary content format
  - name: Story Categories
    description: Surveys — form templates used to create Stories
  - name: Project Story Categories
    description: Survey Campaigns — a Survey assigned to a specific Project
  - name: Story Metrics
    description: Per-story metric records (Story Changes, Story Indicators, Story Beneficiaries)
  - name: Changes
    description: Activity and Participation custom KPIs tracked across Projects
  - name: Versions
    description: Audit trail — who created or edited a Contact, when, and what it looked like at the time
  - name: Access Logs
    description: Audit trail of views — who opened or fetched a Contact, when, and how many times
  - name: Audit Trail
    description: Organisation-wide feed of changes (Versions) and views (Access Logs) across Contacts and Stories
  - name: Indicators
    description: Scale, Binary, and Value progress trackers linked to Outcomes
  - name: Outcomes
    description: Impact outcomes that Indicators are grouped under
  - name: Outcome Indicators
    description: Join table linking Outcomes to Indicators
  - name: Framework Sets
    description: Groups of Impact Frameworks (e.g. the SDGs) that organisations report their contribution towards
  - name: Explore
    description: The Makerble® ImpactStore™'s Explore pages, with the same search, filters and counts as the app
  - name: Library
    description: Search the organisation's library and the public library of reusable building blocks, read an item in full, and see where it is used
  - name: ImpactStore
    description: Search the Makerble ImpactStore (the Explore pages) for published Surveys, Contact Forms, Case Forms, Impact Frameworks, Report Templates, Toolkits and Project Types to reuse
  - name: Ratio Sets
    description: Dropdown / List field definitions
  - name: Sub Ratios
    description: Individual answer choices within a Ratio Set
  - name: Ratio Set Choiceables
    description: Selection rules governing how many Sub Ratios can be chosen from a Ratio Set
  - name: Custom Field Categories
    description: Case Forms — field schemas for creating Case records
  - name: Media Gallery
    description: Photos, videos, audio and documents attached to Stories and to Contacts' bios
  - name: Events
    description: Events and recurring series of events, with their guests (Contacts) and staff
  - name: Signup Pages
    description: |
      Referral Link Details — public-facing signup forms, including the
      Offline Collector endpoints that let a form be filled in with no
      network connection and synced back later.
  - name: Suggested Merges
    description: |
      Sets of two or more Contacts (Beneficiaries) that Makerble thinks are the same person,
      waiting for someone to merge them or mark them as Not duplicates. They come from Merge Rules
      set to Suggest mode and from contacts with similar names.
  - name: Duplicate Contacts
    description: |
      Scan for duplicate contacts (Contacts > Merge Contacts > Scan for duplicates): sets of
      Contacts (Beneficiaries) whose names are spelt exactly the same or look similar, and the
      "Suggest possible duplicates when contacts are created" setting.
  - name: Merge Rules
    description: |
      An Organisation's custom rules for finding duplicate Contacts: which fields must be
      identical, and whether matches are merged automatically or suggested for review.
  - name: Checklists
    description: |
      An Organisation's lists of actions it expects to be done for each Contact (Beneficiary),
      e.g. give them a Role, complete a Contact Form, invite them to an induction event. Projects
      offer a Checklist by hand or add it to every Contact automatically, and each Contact's
      profile shows which actions are done.
  - name: Cohort Trackers
    description: |
      Metrics that count the Contacts (Beneficiaries) in a Project or Album who meet a
      set of Contact Filter criteria, e.g. "Children attending 75%+". Placed in an
      Impact Scorecard column like other metrics, and targeted with a number of
      Contacts to reach.
  - name: Workflow Trackers
    description: |
      Metrics that count records Makerble's own features create, e.g. Signpostings made or
      Contacts referred to another Project, rather than Contacts tagged in updates. Placed in an
      Impact Scorecard column like other metrics.
  - name: Automations
    description: |
      Contact Automations (when Contacts in a Project meet a criteria, do actions such as sending a
      Survey), Project Automations (settings copied onto Projects that match a saved project filter)
      and Automation Templates (saved Contact Automations applied to other Projects).
  - name: Filtered Metrics
    description: |
      Filtered versions of standard metrics: a Change (Activity or Engagement tracker) or an
      Indicator (Choice, Achievement or Numerical tracker) counted again for only some responses
      and Contacts, e.g. "Session attendances — Female, under 21". Each has its own row, name,
      column and targets on a Project's or Album's Results Canvas.
  - name: Add Metric To
    description: |
      The Add metric to popup: the places a metric (a Change, Outcome or Indicator) can be added
      to, and adding or removing it there. Projects are the first destination; an Indicator is only
      ever added to a Project through one of its Outcomes.
  - name: Event Formats
    description: Event Categories — templates for an organisation's events (e.g. Workshops, Classes, Meetings)
  - name: Formula Trackers
    description: |
      Metrics worked out from other trackers with + − × ÷, numbers and brackets, e.g. Referrals
      completed = External referrals + Internal referrals, or a percentage of one tracker in another.
      Placed in an Impact Scorecard column like other metrics.
  - name: Seats
    description: |
      Seats per Colleague: which seat each colleague holds on each of an Organisation's current
      Contracts, and changing one. A colleague's roles decide the lowest seat (Billing Role) they
      need on Role-based Pricing. Only the Organisation's admins can change seats.
  - name: Webhooks
    description: |
      HTTPS endpoints an Organisation's admins register to receive signed events when
      Contacts, Stories and Projects change and when imports finish. See Webhooks above.

paths:

  /users/sign_in:
    post:
      tags: [Authentication]
      summary: Sign in — obtain an authentication token
      description: |
        Authenticates with email and password. Returns a long-lived token for all subsequent requests.
        Tokens **do not expire**. No auth headers needed on this endpoint.
      operationId: signIn
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: ["user[email]", "user[password]"]
              properties:
                "user[email]":
                  type: string
                  format: email
                  example: user@example.com
                "user[password]":
                  type: string
                  format: password
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                user_id: 42
                email: user@example.com
                authentication_token: "sJxyz_abc123longtoken"
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List all Users
      operationId: listUsers
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Users]
      summary: Create a new User
      description: |
        Registers a new user. Requires an `auth_code` API Key — request one at [api-key-request@makerble.com](mailto:api-key-request@makerble.com).

        **Password rules:** min 8 chars · at least 1 number · 1 special character · 1 capital letter
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_code, user, charity_id]
              properties:
                auth_code:
                  type: string
                  description: API Key from api-key-request@makerble.com
                user:
                  type: object
                  required: [email, first_name, last_name, password, password_confirmation]
                  properties:
                    email:
                      type: string
                      format: email
                    first_name:
                      type: string
                    last_name:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                charity_id:
                  type: integer
                charity_controlled:
                  type: boolean
                  default: false
                disable_email_notification:
                  type: boolean
                  default: false
            example:
              auth_code: "qspehLnbRlUS0uiA2mN..."
              user:
                email: "jane@charity.org"
                first_name: "Jane"
                last_name: "Smith"
                password: "Secur3!Pass"
                password_confirmation: "Secur3!Pass"
              charity_id: 31
              charity_controlled: true
              disable_email_notification: false
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                  message:
                    type: string
                    example: "Sign up successfully!!!"
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a single User
      operationId: getUser
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /users/permissions:
    get:
      tags: [Users]
      summary: Get user permissions
      description: Returns the authenticated user's permissions across all Projects and Organisations.
      operationId: getUserPermissions
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: Permissions object
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users/request_password_reset_code:
    get:
      tags: [Users]
      summary: Request a password reset code
      description: Sends a reset code to the user's email. No authentication required.
      operationId: requestPasswordResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Reset code sent

  /users/check_password_reset_code:
    get:
      tags: [Users]
      summary: Verify a password reset code
      operationId: checkPasswordResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: reset_code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_reset_code_correct:
                    type: boolean

  /users/reset_password:
    post:
      tags: [Users]
      summary: Reset a user's password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reset_code, password]
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                  example: "DD3CB5B7C260"
                password:
                  type: string
      responses:
        "200":
          description: Password reset successful
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /charities/{id}:
    get:
      tags: [Charities]
      summary: Get a single Organisation
      description: Returns a single Charity (Organisation). Each Charity owns one or more Projects.
      operationId: getCharity
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Charity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /albums:
    get:
      tags: [Albums]
      summary: List Albums (Portfolios)
      description: |
        The Albums the user's Albums list shows: those they made, manage or are an Album Analyst of,
        and the Albums of the Organisations they are an editor of. An Album (Bundle in the database;
        being renamed Portfolio on screen) groups Projects so their results can be seen together.
      operationId: listAlbums
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Albums
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumList'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Albums]
      summary: Make an Album (Portfolio)
      description: |
        Makes an Album, as the Make an Album form does. Its owner is either the user (`owner_type:
        User`, a personal Album) or one of their Organisations (`owner_type: Charity` with that
        Organisation's ID); the user must be an editor of that Organisation. The user becomes the
        Album's manager. Projects in `project_ids` join straight away when they're the Organisation's
        or the user's own; another Organisation's Project is invited instead and shows in
        `pending_project_ids` until its managers accept.
      operationId: createAlbum
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequest'
            example:
              name: "Youth programmes 2027"
              owner_type: Charity
              owner_id: 42
              project_ids: [101, 102]
      responses:
        "201":
          description: The Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /albums/{id}:
    get:
      tags: [Albums]
      summary: Get an Album (Portfolio)
      description: |
        One Album, if the user can see it (its visibility setting decides who can). An Album the user
        can't see returns 404.
      operationId: getAlbum
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Albums]
      summary: Change an Album's (Portfolio's) settings
      description: |
        Changes the settings on the Edit Album and Album Edit pages. Only the fields sent change;
        `manager_ids` and `analyst_ids` replace the Album's managers and Album Analysts (the Album's
        maker always stays a manager). Projects are added and removed with `/albums/{id}/projects`.
        Only the Album's managers may change it.
      operationId: updateAlbum
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumUpdateRequest'
            example:
              name: "Youth programmes 2027"
              description: "Every after-school club we run"
              analyst_ids: [7]
      responses:
        "200":
          description: The Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user isn't one of the Album's managers
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /albums/{id}/projects:
