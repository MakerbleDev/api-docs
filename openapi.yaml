  /cohort_trackers/{id}/projects/{project_id}/results:
    get:
      tags: [Cohort Trackers]
      summary: Get a Cohort Tracker's result on a Project
      description: |
        A Cohort Tracker's result on a Project's Results Canvas, with the Contacts behind it. Only data saved
        in the Project counts. The tracker must be on the Project.

        The result is the number of distinct Contacts who meet the tracker's membership setting and all
        its criteria, counting only stories, events and survey responses saved in scope and dated in the
        window. Results are worked out afresh for each window, so a Year to Date result is not the sum
        of the period results. `target` is the tracker's deadline target on the window's last day, or
        else its one-off target; targets are never summed across deadlines.

        `data` lists the Contacts in the cohort alphabetically, with `qualifying_value` (named by
        `qualifying_value_label`, e.g. an attendance rate as a percentage) where the criteria have one.
        A Contact the user may not read is listed as `{restricted: true}` with no details, so the
        list always adds up to `count`. Requires the same rights as viewing that Results Canvas.
      operationId: getCohortTrackerProjectResults
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CohortTrackerProjectId'
        - $ref: '#/components/parameters/CohortTrackerTimeframe'
        - $ref: '#/components/parameters/CohortTrackerAsOf'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The result and the Contacts behind it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerResult'
              example:
                cohort_tracker_id: 12
                name: Children attending 75%+
                project_id: 34
                timeframe: year_to_date
                starts_on: "2026-04-01"
                ends_on: "2026-06-30"
                count: 42
                eligible_count: 60
                target: { number: 50, date: "2026-06-30" }
                qualifying_value_label: Attendance rate
                page: 1
                page_size: 2
                page_count: 21
                total_count: 42
                data:
                  - { restricted: false, id: 101, name: Aisha Dlamini, qualifying_value: 82.5 }
                  - { restricted: true }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see this Results Canvas

  /projects/{project_id}/filtered_metrics:
    parameters:
      - $ref: '#/components/parameters/FilteredMetricProjectId'
    get:
      tags: [Filtered Metrics]
      summary: List a Project's filtered versions of metrics
      description: |
        The filtered versions on a Project's Results Canvas. Visible to the Project's or its
        Organisation's managers (editors), changemakers (reporters) and analysts (observers): the
        same people who can see the Results Canvas.
      operationId: listProjectFilteredMetrics
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of filtered versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFilteredMetrics'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see the Project's Results Canvas
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Filtered Metrics]
      summary: Add a filtered version of a metric to a Project
      description: |
        Edit Project Metrics > Add filtered version. The metric being filtered must already be on the
        Project: a Change in one of its columns, or an Indicator under one of its Outcomes. A Change's
        filtered version goes directly after it in its column (or at the end of `column` if given); an
        Indicator's sits under the same Outcome, directly after it. Albums show every filtered version on
        their Projects.

        `response_criteria` filters the responses (stories) the metric was recorded in, as a Progress
        Board's "Filter responses/stories by" does: `story_category_ids` (Surveys), `wave_ids`
        (Intervals), `date_range` ("dd/mm/yyyy - dd/mm/yyyy", Date Happened, either end optional),
        `label_ids` and `author_ids`. Project and Album keys are refused: the responses always come from
        the Project or Album it is on.

        `contact_criteria` filters the Contacts tagged in them, in the Contact Filters format (see
        `POST /cohort_trackers/preview`). Age (`age_from` / `age_to`) is worked out at the date of each
        response; other Bio fields use the Contact's current value; the other sections are judged at the
        end of each reporting period. Either may be sent as a JSON string. Requires the right to edit the
        Project's metrics.
      operationId: createFilteredMetric
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilteredMetricRequest'
            example:
              filtered_metric:
                parent_type: "Change"
                parent_id: 4021
                display_name: "Session attendances — Female, under 21"
                response_criteria:
                  wave_ids: ["12"]
                contact_criteria:
                  sub_ratio_ids: ["881"]
                  age_to: {year: "20", month: "11", day: "30"}
      responses:
        "201":
          description: Filtered version added to the Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredMetric'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit the Project's metrics
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{project_id}/filtered_metrics/preview:
    parameters:
      - $ref: '#/components/parameters/FilteredMetricProjectId'
    post:
      tags: [Filtered Metrics]
      summary: Preview a filtered version
      description: |
        The Add filtered version dialog's "N of M session attendances in this project currently match",
        before it is added: `count` is how many of the metric's tagged responses on the Project pass
        the filters to date (a Numerical tracker's total), `total` how many there are with no filters.
        Takes the same body as adding one; `display_name` is optional.
      operationId: previewFilteredMetric
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilteredMetricRequest'
            example:
              filtered_metric:
                parent_type: "Change"
                parent_id: 4021
                contact_criteria:
                  sub_ratio_ids: ["881"]
      responses:
        "200":
          description: The count and the unfiltered total
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                  total:
                    type: number
              example:
                count: 262
                total: 1540
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit the Project's metrics
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /cohort_trackers/{id}/albums/{bundle_id}/results:
    get:
      tags: [Cohort Trackers]
      summary: Get a Cohort Tracker's result on an Album
      description: |
        A Cohort Tracker's result on an Album's Results Canvas, with the Contacts behind it. The Album's
        Projects are counted together and each Contact once, so the result is never the sum of the
        Projects' results. The tracker must be on one of the Album's Projects.

        The result is the number of distinct Contacts who meet the tracker's membership setting and all
        its criteria, counting only stories, events and survey responses saved in scope and dated in the
        window. Results are worked out afresh for each window, so a Year to Date result is not the sum
        of the period results. `target` is the tracker's deadline target on the window's last day, or
        else its one-off target; targets are never summed across deadlines.

        `data` lists the Contacts in the cohort alphabetically, with `qualifying_value` (named by
        `qualifying_value_label`, e.g. an attendance rate as a percentage) where the criteria have one.
        A Contact the user may not read is listed as `{restricted: true}` with no details, so the
        list always adds up to `count`. Requires the same rights as viewing that Results Canvas.
      operationId: getCohortTrackerAlbumResults
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CohortTrackerAlbumId'
        - $ref: '#/components/parameters/CohortTrackerTimeframe'
        - $ref: '#/components/parameters/CohortTrackerAsOf'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The result and the Contacts behind it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerResult'
              example:
                cohort_tracker_id: 12
                name: Children attending 75%+
                album_id: 34
                timeframe: year_to_date
                starts_on: "2026-04-01"
                ends_on: "2026-06-30"
                count: 42
                eligible_count: 60
                target: { number: 50, date: "2026-06-30" }
                qualifying_value_label: Attendance rate
                page: 1
                page_size: 2
                page_count: 21
                total_count: 42
                data:
                  - { restricted: false, id: 101, name: Aisha Dlamini, qualifying_value: 82.5 }
                  - { restricted: true }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see this Results Canvas

  /projects/{project_id}/filtered_metrics/{id}:
    parameters:
      - $ref: '#/components/parameters/FilteredMetricProjectId'
      - $ref: '#/components/parameters/FilteredMetricId'
    get:
      tags: [Filtered Metrics]
      summary: Get a filtered version on a Project
      operationId: getProjectFilteredMetric
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: The filtered version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredMetric'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see the Project's Results Canvas
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Filtered Metrics]
      summary: Update a filtered version
      description: |
        Renames it or replaces its filters: `response_criteria` and `contact_criteria`, when sent,
        replace the stored ones (`{}` clears them). The metric it filters and its placement can't be
        changed. The change applies wherever it is used. Requires the right to edit the Project's metrics.
      operationId: updateFilteredMetric
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilteredMetricRequest'
            example:
              filtered_metric:
                display_name: "Session attendances — Female"
                contact_criteria:
                  sub_ratio_ids: ["881"]
      responses:
        "200":
          description: Filtered version updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredMetric'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit the Project's metrics
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Filtered Metrics]
      summary: Remove a filtered version from a Project
      description: |
        Removes it from the Project and its Albums. It is deleted once it is on no other Project or
        Scorecard Template. Requires the right to edit the Project's metrics.
      operationId: removeFilteredMetric
      security: [{tokenAuth: []}]
      responses:
        "204":
          description: Removed
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit the Project's metrics
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{project_id}/filtered_metrics/{id}/results:
    parameters:
      - $ref: '#/components/parameters/FilteredMetricProjectId'
