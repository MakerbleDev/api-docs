      description: |
        Returns 404 for an Outcome the signed-in user cannot see, with the same body as for
        an ID that does not exist. A public-library Outcome owned by another organisation is
        returned only when `include_public_library=true`.
      operationId: getOutcome
      security: [{tokenAuth: []}]
      parameters:
