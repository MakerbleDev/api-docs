    FormulaToken:
      type: object
      required: [kind]
      description: "One part of a formula: a tracker, an operator, a number or a bracket"
      properties:
        kind:
          type: string
          enum: [tracker, operator, number, open, close]
        type:
          type: string
          enum: [Change, Indicator, CohortTracker, WorkflowTracker, FilteredMetric, FormulaTracker]
          description: "tracker only: the tracker's type"
        id:
          type: integer
          description: "tracker only: the tracker's id"
        value:
          description: "operator: +, -, * or /. number: the number."
          oneOf:
            - type: string
            - type: number

    FormulaTracker:
      type: object
      properties:
        id:
          type: integer
