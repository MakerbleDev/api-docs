openapi: 3.0.3
info:
  title: Makerble API
  description: |
    The Makerble API enables developers to integrate with the Makerble CRM and impact measurement platform — reading and writing data on contacts, projects, surveys, cases, outcomes, metrics, and more.

    ## Base URL
    ```
    https://makerble.com/api/v2
    ```
    A staging environment is also available at `https://staging.makerble.com/api/v2`.

    ## Authentication
    All endpoints (except `/users/sign_in` and the password reset endpoints) require token-based authentication. Pass both headers on every authenticated request:

    | Header | Value |
    |---|---|
    | `X-User-Email` | The authenticated user's email address |
    | `X-User-Token` | The user's long-lived authentication token |

    Tokens are obtained via `POST /users/sign_in` and **do not expire**. Each user has one fixed token.

    > **Multi-user integrations:** If activity must be attributed to specific users, authenticate separately per user. A single Organisation Admin token is acceptable when attribution to one admin is sufficient.

    ## Creating Users via the API
    `POST /users` requires a separate API Key (`auth_code`). Request one at [api-key-request@makerble.com](mailto:api-key-request@makerble.com).

    ## Terminology
    Makerble uses different terms in the UI and the API:

    | Front-end | API |
    |---|---|
    | Organisation | Charity |
    | Contact | Beneficiary |
    | Contact Bio Form | Beneficiary Category |
    | Contact Type | Beneficiary Type |
    | Survey | Story Category |
    | Survey Campaign | Project Story Category |
    | Survey Response / Timeline Update / Instant Update | Story |
    | Activity / Engagement tracker | Change (stage: activity / participation) |
    | Achievement / Choice / Numerical tracker | Indicator (type: binary / scale / value) |
    | Dropdown / List field | Ratio Set |
    | Answer Choice | Sub Ratio |
    | Case Form | Custom Field Category |
    | Case Owner | Case Creator |
    | Case Worker | Case Member |
    | Project Manager | Project Editor |
    | Changemaker | Project Reporter |
    | Analyst | Project Observer |
    | Signup Page | Referral Link Detail |

    ## Story timestamps
    Stories carry three timestamps:

    | API field | Front-end label | Meaning |
    |---|---|---|
    | `actual_created_at` | Date Posted | Real database insertion time |
    | `created_at` | Date Happened | Activity date chosen by the user (can be backdated) |
    | `updated_at` | Date Edited | Most recent modification |

    ## Pagination
    All list endpoints accept:

    | Parameter | Type | Default | Max | Description |
    |---|---|---|---|---|
    | `page` | integer | 1 | — | Page number |
    | `per_page` | integer | 10 | 200 | Records per page |
    | `last_sync_datetime` | string (ISO 8601) | — | — | Return only records updated after this datetime |

    Paginated responses use this envelope:
    ```json
    { "page": 1, "page_size": 10, "page_count": 146, "total_count": 1458, "data": [] }
    ```

    ## Webhooks
    Instead of polling, an Organisation's admins can register **webhook endpoints**: HTTPS URLs that Makerble sends a signed JSON `POST` to when records change. Manage them under **Connect > Webhooks** or with the Webhooks endpoints below. An Organisation's admin turns webhooks on by ticking **Turn on Webhooks** in the Organisation's Settings (Preferences) page; until then those endpoints answer `403`.

    | Event | Sent when | `data` |
    |---|---|---|
    | `contact.created` | A Contact is created | Same as `GET /beneficiaries/{id}` |
    | `contact.updated` | A Contact is edited (not when only counts Makerble keeps up to date change) | Same, plus `changed_fields` on the envelope |
    | `story.created` | A Story is posted, about 30 seconds later so its survey answers are included (not drafts) | Same as `GET /stories/{id}` |
    | `story.updated` | A Story is edited, including a draft being published | Same |
    | `project.created` / `project.updated` | A Project is created / edited | Same as `GET /projects/{id}` |
    | `import.completed` | A spreadsheet import has processed every row. Rows of an import send no events of their own | `import_id`, `import_type`, `kind`, `status`, `counts`, `charity_id` |
    | `webhook.test` | Someone sends a test event | `{ "test": true, "message": "This is a test event from Makerble." }` |

    `*.updated` events are sent about 10 seconds after the change, so several saves of one change (publishing a draft Story saves it more than once) arrive as one event showing the latest state.

    Every request has this body:
    ```json
    {
      "id": "evt_6f0c2a4e-8d1b-4b7e-9a53-2f1d6c3e9b10",
      "event": "contact.updated",
      "occurred_at": "2026-10-04T09:15:00Z",
      "charity_id": 123,
      "changed_fields": ["name", "mobile"],
      "data": { "id": 456, "name": "Ada Lovelace" }
    }
    ```
    `data` shows the record as it is when the request is sent, which can be newer than `occurred_at`. New fields may be added to `data` over time.

    Headers: `X-Makerble-Event` (the event), `X-Makerble-Delivery` (the `id`), `User-Agent: Makerble-Webhooks/1` and `X-Makerble-Signature: t=<unix time>,v1=<signature>`.

    **Verify the signature** before trusting a request. `v1` is the hex HMAC-SHA256 of `"<t>.<raw request body>"`, keyed with the endpoint's secret (shown once, when the endpoint is created or its secret is rotated). Reject old timestamps to stop replays:
    ```ruby
    t, v1 = request.headers['X-Makerble-Signature'].split(',').map { |part| part.split('=', 2).last }
    expected = OpenSSL::HMAC.hexdigest('SHA256', secret, "#{t}.#{request.raw_post}")
    valid = Rack::Utils.secure_compare(expected, v1) && (Time.now.to_i - t.to_i).abs < 300
    ```

    **Respond with any 2xx within 10 seconds.** Anything else, a timeout or a refused connection is retried 8 more times over about 25 hours (after 1 and 5 minutes, then 15 minutes, 1, 2, 4, 8 and 10 hours). Redirects are not followed. After 10 deliveries in a row fail, or 7 days without a success, Makerble switches the endpoint off and emails the Organisation's admins; turn it back on with `PATCH /webhook_endpoints/{id}` and `active: true`.

    Delivery is **at least once** and in no guaranteed order: de-duplicate on `id`, and use `occurred_at` (or fetch the record) where order matters. Delivery logs are kept for 30 days and any delivery can be sent again with its replay endpoint.

  version: "2.0.0"
  contact:
    name: Makerble Support
    url: https://discover.makerble.com
    email: support@makerble.com
  license:
    name: Proprietary

servers:
  - url: https://makerble.com/api/v2
    description: Production
  - url: https://staging.makerble.com/api/v2
    description: Staging
  - url: /mock
    description: Mock server (safe for testing — no real data)

tags:
  - name: Authentication
    description: Obtain and manage authentication tokens
  - name: Users
    description: Platform users with login credentials
  - name: Charities
    description: Organisations — the top-level entity that owns Projects
  - name: Projects
    description: The primary organisational unit — every Story and Case belongs to a Project
  - name: Beneficiaries
    description: Contacts — the people your organisation works with
  - name: Beneficiary Categories
    description: Contact Bio Forms — field schemas for creating and editing Beneficiary records
  - name: Beneficiary Types
    description: The four contact types — Person, Organisation, Animal, Object
  - name: Cases
    description: Cases linked to a Beneficiary and a Project
  - name: Stories
    description: Survey responses, timeline updates, and instant updates — the primary content format
  - name: Story Categories
    description: Surveys — form templates used to create Stories
  - name: Project Story Categories
    description: Survey Campaigns — a Survey assigned to a specific Project
  - name: Story Metrics
    description: Per-story metric records (Story Changes, Story Indicators, Story Beneficiaries)
  - name: Changes
    description: Activity and Participation custom KPIs tracked across Projects
  - name: Versions
    description: Audit trail — who created or edited a Contact, when, and what it looked like at the time
  - name: Access Logs
    description: Audit trail of views — who opened or fetched a Contact, when, and how many times
  - name: Indicators
    description: Scale, Binary, and Value progress trackers linked to Outcomes
  - name: Outcomes
    description: Impact outcomes that Indicators are grouped under
  - name: Outcome Indicators
    description: Join table linking Outcomes to Indicators
  - name: Framework Sets
    description: Groups of Impact Frameworks (e.g. the SDGs) that organisations report their contribution towards
  - name: Ratio Sets
    description: Dropdown / List field definitions
  - name: Sub Ratios
    description: Individual answer choices within a Ratio Set
  - name: Ratio Set Choiceables
    description: Selection rules governing how many Sub Ratios can be chosen from a Ratio Set
  - name: Custom Field Categories
    description: Case Forms — field schemas for creating Case records
  - name: Media Gallery
    description: Photos, videos, audio and documents attached to Stories and to Contacts' bios
  - name: Signup Pages
    description: |
      Referral Link Details — public-facing signup forms, including the
      Offline Collector endpoints that let a form be filled in with no
      network connection and synced back later.
  - name: Cohort Trackers
    description: |
      Metrics that count the Contacts (Beneficiaries) in a Project or Album who meet a
      set of Contact Filter criteria, e.g. "Children attending 75%+". Placed in an
      Impact Scorecard column like other metrics, and targeted with a number of
      Contacts to reach.
  - name: Workflow Trackers
    description: |
      Metrics that count records Makerble's own features create, e.g. Signpostings made or
      Contacts referred to another Project, rather than Contacts tagged in updates. Placed in an
      Impact Scorecard column like other metrics.
  - name: Filtered Metrics
    description: |
      Filtered versions of standard metrics: a Change (Activity or Engagement tracker) or an
      Indicator (Choice, Achievement or Numerical tracker) counted again for only some responses
      and Contacts, e.g. "Session attendances — Female, under 21". Each has its own row, name,
      column and targets on a Project's or Album's Results Canvas.
  - name: Event Formats
    description: Event Categories — templates for an organisation's events (e.g. Workshops, Classes, Meetings)
  - name: Webhooks
    description: |
      HTTPS endpoints an Organisation's admins register to receive signed events when
      Contacts, Stories and Projects change and when imports finish. See Webhooks above.

paths:

  /users/sign_in:
    post:
      tags: [Authentication]
      summary: Sign in — obtain an authentication token
      description: |
        Authenticates with email and password. Returns a long-lived token for all subsequent requests.
        Tokens **do not expire**. No auth headers needed on this endpoint.
      operationId: signIn
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: ["user[email]", "user[password]"]
              properties:
                "user[email]":
                  type: string
                  format: email
                  example: user@example.com
                "user[password]":
                  type: string
                  format: password
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                user_id: 42
                email: user@example.com
                authentication_token: "sJxyz_abc123longtoken"
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List all Users
      operationId: listUsers
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Users]
      summary: Create a new User
      description: |
        Registers a new user. Requires an `auth_code` API Key — request one at [api-key-request@makerble.com](mailto:api-key-request@makerble.com).

        **Password rules:** min 8 chars · at least 1 number · 1 special character · 1 capital letter
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_code, user, charity_id]
              properties:
                auth_code:
                  type: string
                  description: API Key from api-key-request@makerble.com
                user:
                  type: object
                  required: [email, first_name, last_name, password, password_confirmation]
                  properties:
                    email:
                      type: string
                      format: email
                    first_name:
                      type: string
                    last_name:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                charity_id:
                  type: integer
                charity_controlled:
                  type: boolean
                  default: false
                disable_email_notification:
                  type: boolean
                  default: false
            example:
              auth_code: "qspehLnbRlUS0uiA2mN..."
              user:
                email: "jane@charity.org"
                first_name: "Jane"
                last_name: "Smith"
                password: "Secur3!Pass"
                password_confirmation: "Secur3!Pass"
              charity_id: 31
              charity_controlled: true
              disable_email_notification: false
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                  message:
                    type: string
                    example: "Sign up successfully!!!"
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a single User
      operationId: getUser
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /users/permissions:
    get:
      tags: [Users]
      summary: Get user permissions
      description: Returns the authenticated user's permissions across all Projects and Organisations.
      operationId: getUserPermissions
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: Permissions object
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users/request_password_reset_code:
    get:
      tags: [Users]
      summary: Request a password reset code
      description: Sends a reset code to the user's email. No authentication required.
      operationId: requestPasswordResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Reset code sent

  /users/check_password_reset_code:
    get:
      tags: [Users]
      summary: Verify a password reset code
      operationId: checkPasswordResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: reset_code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_reset_code_correct:
                    type: boolean

  /users/reset_password:
    post:
      tags: [Users]
      summary: Reset a user's password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reset_code, password]
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                  example: "DD3CB5B7C260"
                password:
                  type: string
      responses:
        "200":
          description: Password reset successful
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /charities/{id}:
    get:
      tags: [Charities]
      summary: Get a single Organisation
      description: Returns a single Charity (Organisation). Each Charity owns one or more Projects.
      operationId: getCharity
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Charity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /projects:
    get:
      tags: [Projects]
      summary: List all Projects
      description: |
        Returns all Projects accessible to the authenticated user. Every Story and Case belongs to a Project.

        Users hold one of three roles per Project:

        | Role | API name | Front-end | Permissions |
        |---|---|---|---|
        | Editor | `editor` | Manager | Admin — edit Project, manage users |
        | Reporter | `reporter` | Changemaker | Create Stories |
        | Observer | `observer` | Analyst | Read-only |
      operationId: listProjects
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get a single Project
      operationId: getProject
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Project record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /projects/add_colleague.json:
    post:
      tags: [Projects]
      summary: Add users to a Project
      description: Grants roles on a Project. A user can hold Editor, Reporter, and Observer simultaneously.
      operationId: addColleague
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_data]
              properties:
                role_data:
                  type: array
                  items:
                    type: object
                    required: [project_id]
                    properties:
                      project_id:
                        type: integer
                        example: 619
                      editor_ids:
                        type: array
                        items:
                          type: integer
                        example: [559]
                      reporter_ids:
                        type: array
                        items:
                          type: integer
                        example: [560]
                      observer_ids:
                        type: array
                        items:
                          type: integer
                        example: [561]
      responses:
        "200":
          description: Users added
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /project_results:
    get:
      tags: [Projects]
      summary: Get Results Canvas figures for Projects
      description: |
        Returns the figures shown on each Project's **Results Canvas** (the Results panel on a Project page),
        one entry per tracker, calculated by Makerble. Covers the Projects you can view (Editor, Reporter or
        Observer of the Project or its Organisation), optionally for a period and split by Project or month.

        | Tracker (front-end) | Backend type | Figures |
        |---|---|---|
        | Activity tracker | Change of Activity type | `times_recorded`, `contacts`, `anonymous_count` |
        | Engagement tracker | Change of Participation type | `times_recorded`, `contacts`, `anonymous_count` |
        | Achievement tracker | Indicator of Binary type | `times_recorded`, `contacts_achieved`, `anonymous_count` |
        | Choice tracker | Indicator of Scale type | `times_recorded`, `contacts`, `answers` (count and contacts per Sub Ratio), `anonymous_count` |
        | Numerical tracker | Indicator of Value type | `total`, `contacts`, `average_per_contact`, `anonymous_count`, `anonymous_total` |

        `times_recorded` counts records, including headcounts and the same Contact recorded more than once, so it is
        not a number of people. `contacts` and `contacts_achieved` count distinct Contacts tagged. `anonymous_count`
        is what was recorded with no Contact tagged.

        Stories count by their date (`created_at`). `target`, `target_deadline` and `percent_of_target` appear when
        the Project has a target: target deadlines dated in the period are added together, otherwise the Project's
        own target is used. `last_sync_datetime` doesn't apply, as the figures are totals.
      operationId: getProjectResults
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: project_ids
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          example: [619, 620]
          description: Projects to include, as project_ids[]=619&project_ids[]=620 or a JSON array string ("[619,620]"). Defaults to every Project you can view; Projects you can't view are left out.
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          example: "2026-04-01"
          description: First Story date to include (YYYY-MM-DD). Omit start_date and end_date for all time.
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          example: "2027-03-31"
          description: Last Story date to include (YYYY-MM-DD)
        - name: tracker_types
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [activity, engagement, achievement, choice, numerical]
          example: [activity, choice]
          description: Tracker types to include, as an array or a comma-separated list. Defaults to all.
        - name: group_by
          in: query
          schema:
            type: string
            enum: [project, month]
          description: Split each tracker's figures into a `groups` array by Project or by month (months with nothing recorded are included). Default is one total.
      responses:
        "200":
          description: One page of trackers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectResults'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries:
    get:
      tags: [Beneficiaries]
      summary: List all Beneficiaries (Contacts)
      description: |
        Returns all Contacts visible to the authenticated user. Filter by `charity_id` or `project_id`.
        Response includes `custom_fields` defined by the Beneficiary Category.
      operationId: listBeneficiaries
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - name: charity_id
          in: query
          schema:
            type: integer
          description: Filter to Contacts in this Organisation
        - name: project_id
          in: query
          schema:
            type: integer
          description: Filter to Contacts enrolled in this Project
      responses:
        "200":
          description: Paginated list of Beneficiaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBeneficiaries'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Beneficiaries]
      summary: Create a Beneficiary (Contact)
      description: |
        Creates a new Contact. Required: `name`, `owner_id`.

        Call `GET /beneficiary_types` for `beneficiary_type_id` values and `GET /custom_fields` for available custom field IDs.
      operationId: createBeneficiary
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryCreateRequest'
            example:
              beneficiary:
                name: "Jack Smith"
                date_of_birth: "13-05-1990"
                address: "123 Example Street, London"
                latitude: "51.5074"
                longitude: "-0.1278"
                beneficiary_type_id: 1
                owner_id: 237
              project_ids: [572]
              beneficiary_category_ids: [294]
              custom_fields:
                "173": "some value"
      responses:
        "200":
          description: Beneficiary created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries/{id}:
    get:
      tags: [Beneficiaries]
      summary: Get a single Beneficiary (Contact)
      description: "Returns a Contact's full profile including all custom fields. Opening a Contact this way is recorded in its Access Log, the audit trail of who has viewed it, under the caller's name and marked as via the API (or via MCP when the Makerble MCP server sends `X-Makerble-Client: makerble-mcp`). Views by the same caller less than 30 minutes apart are counted together. Use the list endpoint when you only need to find or scan Contacts."
      operationId: getBeneficiary
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Beneficiary record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiaries/{beneficiary_id}/summary:
    parameters:
      - name: beneficiary_id
        in: path
        required: true
        schema:
          type: integer
        description: Contact (Beneficiary) ID
    get:
      tags: [Beneficiaries]
      summary: Get the AI summary of a Contact (SummaryMaker)
      description: |
        Returns the SummaryMaker summary of a Contact, as shown in the Summary tile on the
        Contact profile: three sections (**Who**, **Progress**, **Watch for**) written from the
        Contact's bio and the Stories the signed-in user is allowed to see. Every sentence
        lists its sources: `bio` (true if it came from the bio) and `story_ids`.

        A summary is never made from, and never returns, a Story or bio field the user can't
        see. Users with the same access share one summary, and it is only remade when the bio
        or Stories change, so repeated calls return the same text.

        `status` is one of:
        - `ready`: the summary is current.
        - `stale`: an older summary made only from Stories you can see; `new_story_count`
          Stories have been added since. POST to make a fresh one.
        - `pending`: SummaryMaker is writing it in the background. `summary` is null, or the
          previous version while an update is made. Call again in a few seconds.
        - `failed`: it could not be made. POST to try again.
        - `empty`: the Contact has no bio or Stories you can see.

        Only available to organisations that have turned on SummaryMaker in their
        preferences (off by default).
      operationId: getBeneficiarySummary
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: The Contact summary and its status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSummaryResponse'
              example:
                status: ready
                new_story_count: 0
                summary:
                  id: 812
                  generated_at: "2026-09-29T10:14:03Z"
                  model: claude-haiku-4-5-20251001
                  source_story_ids: [5521, 5530, 5544]
                  sections:
                    - heading: Who
                      text: Amira joined the programme in June and is looking for warehouse work.
                      bio: true
                      story_ids: []
                      sentences:
                        - text: Amira joined the programme in June and is looking for warehouse work.
                          bio: true
                          story_ids: []
                    - heading: Progress
                      text: Amira updated her CV and has started interview practice.
                      bio: false
                      story_ids: [5530, 5544]
                      sentences:
                        - text: Amira updated her CV and has started interview practice.
                          bio: false
                          story_ids: [5530, 5544]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: SummaryMaker is not turned on for this organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SummaryMaker is not enabled for this organisation
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Beneficiaries]
      summary: Update the AI summary of a Contact (SummaryMaker)
      description: |
        Makes a fresh summary from the latest bio and Stories the signed-in user can see, like
        the **Update summary** button on the Contact profile. Returns `202` with status
        `pending`; call the GET endpoint until the status is `ready`. No request body.
      operationId: updateBeneficiarySummary
      security: [{tokenAuth: []}]
      responses:
        "202":
          description: Summary update started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSummaryResponse'
              example:
                status: pending
                new_story_count: 0
                summary: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: SummaryMaker is not turned on for this organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SummaryMaker is not enabled for this organisation
        "404":
          $ref: '#/components/responses/NotFound'

