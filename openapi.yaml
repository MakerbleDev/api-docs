        Whatever you don't send stays as it is. Only Project Managers and Organisation Admins (whoever
        can change Project Preferences) can change it.
      operationId: setProjectSnapshotSettings
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotSettingsRequest'
            examples:
              panels:
                value:
                  panels: [age_band, "ratio_set:12"]
              tiles:
                value:
                  tiles: {activities: "Change:31", engagement: null}
                  workload: ["WorkflowTracker:4", null, null]
      responses:
        "200":
          description: What the Snapshot shows after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotSettings'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /focus:
    get:
      tags: [Focus]
      summary: Get what needs you, as on your Focus page
      description: |
        Everything that needs you, from every source you haven't switched off, most overdue first,
        as on Today › Focus. Today the only source is **Checklist Actions** (`type: checklist_actions`):
        for each Contact and Checklist, the first step not yet done, when you are responsible for it
        (the Checklist's "Who is responsible?", or the Contact's own choice in its place). "The
        colleague who added this checklist" counts when that was you.

        `scope=me` (the default) gives what you are responsible for; `scope=teams` adds what your
        Teams are responsible for, and is only available when you are in a Team (`teams: true`).
        There is no view of everyone's work: a Checklist's progress gives that.

        Each item has `id`, `type`, `title`, `contact` ({id, name}), `context` (e.g. "Checklist Action ·
        Intake · step 2 of 5", plus who is responsible when it isn't you), `url`, `due_on` (the day the
        Checklist was added plus the step's due days, or null), `due_text`, `section` (`overdue`,
        `today`, `this_week` for the next 7 days, or `later` for later or undated) and `action`
        ({label, url, method}), the row's button. `counts`, `sections` and `sources` describe the whole
        list, whatever `section` or page you ask for. Only Contacts you can see are included.
      operationId: getFocus
      security: [{tokenAuth: []}]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [me, teams]
          description: "`teams` adds what your Teams are responsible for. Falls back to `me` when you are in no Team."
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Only items from this source, e.g. `checklist_actions`. A type with no items gives every item.
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [overdue, today, this_week, later]
          description: Only items in this section.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: What needs you
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusFeed'
              example:
                scope: me
                teams: true
                type: null
                sources: [{key: checklist_actions, label: Checklist Actions, shown: true}]
                counts: {all: 1, checklist_actions: 1}
                sections: [{key: overdue, label: Overdue, count: 1}]
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data:
                  - id: checklist_actions-812
                    type: checklist_actions
                    title: Consent form
                    contact: {id: 4021, name: Ayanda Dlamini}
                    context: Checklist Action · Youth Programme Intake · step 3 of 6
                    url: /beneficiaries/4021
                    due_on: "2026-10-11"
                    raised_on: null
                    due_text: 15 days overdue
                    section: overdue
                    action: {label: Open, url: /beneficiaries/4021, method: get}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /focus/settings:
    patch:
      tags: [Focus]
      summary: Choose what your Focus page shows
      description: |
        The sources your Focus page shows, as chosen under its ⚙ "What Focus shows you". Send the keys
        of the sources to show; every other source is switched off. Saved for you only: your email and
        web notification settings are unchanged.
      operationId: updateFocusSettings
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shown_sources]
              properties:
                shown_sources:
                  type: array
                  items:
                    type: string
                  description: Source keys from `sources` in GET /focus; `[]` shows none.
            example:
              shown_sources: [checklist_actions]
      responses:
        "200":
          description: The sources after the change
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/FocusSource'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /start_page:
    get:
      tags: [Start page]
      summary: Get your start page
      description: |
        The Today page you land on after signing in, and whenever you click Home or the Makerble logo,
        as chosen under Personal Settings › Preferences › Start page, and the pages you can choose.
        Newsfeed (formerly My Home) is the default. Focus and Snapshot are offered while they are in
        the Today section of your sidebar, and Autopilot while it is on for one of your organisations.
        If you chose a page that is no longer offered to you, `start_page` is `newsfeed`.
      operationId: getStartPage
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: Your start page and the pages you can choose
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPage'
              example:
                start_page: focus
                options:
                  - {key: newsfeed, label: Newsfeed, description: "What’s happened across your projects. Formerly My Home."}
                  - {key: focus, label: Focus, description: "Your next steps across checklists, overdue first."}
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Start page]
      summary: Choose your start page
      description: |
        Choose the Today page you land on after signing in and when you click Home or the Makerble logo,
        as Personal Settings › Preferences › Start page does. Saved for you only. If you choose Focus
        but can neither see nor create a Checklist, Home takes you to Newsfeed with a note saying why.
      operationId: updateStartPage
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_page]
              properties:
                start_page:
                  type: string
                  enum: [newsfeed, focus, snapshot, autopilot]
                  description: The key of one of the `options` GET /start_page returns.
            example:
              start_page: focus
      responses:
        "200":
          description: Your start page after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPage'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /snapshot:
    get:
      tags: [Snapshot]
      summary: Get an Album (Portfolio)'s or Project's Snapshot
      description: |
        The numbers Today › Snapshot shows for one Album or Project. **panels** ("Who we're working
        with") count its Contacts by Ratio Set, age band or Project, by the Demographics tab's rules:
        only Contacts you can view are counted, Contacts without a value are under "No Data" or "No
        date of birth" (left out if the Organisation hides untagged Contacts from charts), and groups
        below the Organisation's Minimum Results Threshold have `contacts: null` and are added up under
        "Below Threshold". `percent` is of all the Album's or Project's Contacts. **tiles** ("How the
        work is going", one per Results Canvas column not hidden) and **workload** give each chosen
        metric's or tracker's result for the Results Canvas's current period, or all time when there are
        no deadlines (`timeframe` says which); `value` is null for a tracker with no single number.

        Name the Album or Project with `album_id` or `project_id`; without either, you get your pinned
        one, or else the last one you viewed in Makerble (`404` when there's neither). What appears is
        chosen with PUT /albums/{album_id}/snapshot_settings or /projects/{project_id}/snapshot_settings.
      operationId: getSnapshot
      security: [{tokenAuth: []}]
      parameters:
        - name: album_id
          in: query
          required: false
          schema:
            type: integer
          description: The Album's (Bundle's) ID
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
          description: The Project's ID
      responses:
        "200":
          description: The Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /snapshot/pin:
    put:
      tags: [Snapshot]
      summary: Pin an Album (Portfolio) or Project as your Snapshot
      description: |
        Makes Today › Snapshot (and GET /snapshot without an id) open this Album or Project for you,
        as the **Pin as my Snapshot** button does. It only changes your own Snapshot.
      operationId: pinSnapshot
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                album_id:
                  type: integer
                project_id:
                  type: integer
            examples:
              project:
                value:
                  project_id: 412
      responses:
        "200":
          description: What is now pinned
          content:
            application/json:
              schema:
                type: object
                required: [pinned]
                properties:
                  pinned:
                    $ref: '#/components/schemas/SnapshotOwner'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints:
    get:
      tags: [Webhooks]
      summary: List an Organisation's webhook endpoints
      description: |
        The Organisation's (Charity's) webhook endpoints, without their secrets. Only the
        Organisation's admins can manage webhooks, and only once an admin has ticked **Turn on Webhooks**
        in the Organisation's Settings (otherwise `403`).
      operationId: listWebhookEndpoints
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of webhook endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookEndpoints'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: |
        Starts sending the chosen events to an HTTPS URL. Leave out `event_types` to send every
        event. An Organisation can have at most 10 endpoints. The response includes the signing
        `secret`, which is shown only this once.
      operationId: createWebhookEndpoint
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
            example:
              webhook_endpoint:
                charity_id: 913
                url: "https://crm.example.org/makerble"
                description: "Dynamics sync"
                event_types: ["contact.created", "contact.updated"]
      responses:
        "201":
          description: Endpoint created, with its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /webhook_endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Webhooks]
      summary: Get a webhook endpoint
      operationId: getWebhookEndpoint
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: The endpoint, without its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      summary: Change, pause or resume a webhook endpoint
      description: |
        Send only the fields to change. `active: false` pauses the endpoint; `active: true`
        resumes it, and also turns back on an endpoint Makerble switched off after repeated
        failure (clearing `disabled_at` and `failure_count`). Changes made while it was off are
        not sent afterwards.
      operationId: updateWebhookEndpoint
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
            example:
              webhook_endpoint:
                active: true
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: Deletes the endpoint and its delivery log. Makerble stops sending to it at once.
      operationId: deleteWebhookEndpoint
      security: [{tokenAuth: []}]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/rotate_secret:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Webhooks]
      summary: Rotate a webhook endpoint's secret
      description: |
        Replaces the signing secret and returns the new one, shown only this once. Deliveries
        are signed with it straight away.
      operationId: rotateWebhookEndpointSecret
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: The endpoint with its new secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Webhooks]
      summary: Send a test event
      description: |
        Queues a `webhook.test` event (`data: { "test": true, "message": "This is a test event from Makerble." }`) for the endpoint. Check the
        delivery log a few seconds later for the result.
      operationId: sendWebhookTestEvent
      security: [{tokenAuth: []}]
      responses:
        "202":
          description: The queued delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Webhooks]
      summary: List a webhook endpoint's deliveries
      description: The delivery log, newest first, kept for 30 days. Payloads are not included.
      operationId: listWebhookDeliveries
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookDeliveries'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /webhook_endpoints/{id}/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: delivery_id
        in: path
        required: true
        schema:
          type: integer
        description: The delivery's ID
    post:
      tags: [Webhooks]
      summary: Send a delivery again
      description: |
        Sends the delivery again with the same event `id`, so a receiver that already processed
        it can ignore it. `data` shows the record as it is now.
      operationId: replayWebhookDelivery
      security: [{tokenAuth: []}]
      responses:
        "202":
          description: The delivery, queued again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WebhooksNotTurnedOn'
        "404":
          $ref: '#/components/responses/NotFound'

  /metrics/{metric_type}/{metric_id}/destinations:
    get:
      tags: [Add Metric To]
      summary: List where a metric can be added
      description: |
        The options of "What would you like to add this to?" in the Add metric to popup, for a Change,
        Outcome or Indicator the user can see. An Indicator has no Projects option: it reaches a
        Project only through one of its Outcomes. A Cohort or Workflow Tracker gets `projects` (its own
        Organisation's) and `impact_frameworks`. `progress_boards` is offered for a Change or an Indicator only with `project_id`
        or `bundle_id`, as the popup offers Progress Boards only from a Project's or Album's Results Canvas.
      operationId: listMetricDestinations
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/MetricId'
        - $ref: '#/components/parameters/MetricDestinationProjectId'
        - $ref: '#/components/parameters/MetricDestinationBundleId'
      responses:
        "200":
          description: The destination types offered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string, example: projects}
                        label: {type: string, example: Projects}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /metrics/{metric_type}/{metric_id}/destinations/{destination}:
    get:
      tags: [Add Metric To]
      summary: List the places a metric can be added to
      description: |
        A page of the places of one destination type the user can add the metric to, alphabetically,
        each with `added: true` if the metric is already there. For `projects`: the open Projects whose
        metrics the user can edit (as a Project editor or an editor of its Organisation), with their
        Organisation. For `impact_frameworks`: the Impact Frameworks the user created, the only ones
        they can edit. For `collections`: the user's own Collections and those of Organisations they
        are an editor of; each item has `owner` ({type, id, name}) instead of `organisation`, as do
        `surveys` (the Surveys the user can edit; `removable` is false once the Survey asks the metric). For
        `outcomes` (an Indicator's): the Outcomes the user can edit, with `stage_id`. For `indicators`
        (an Outcome's, offered only if the user can edit it): the Indicators they can see, including the
        public library, with `indicator_type`. For `progress_boards`: the open Progress Boards the user
        created or is a Board Admin of, with `board_type` (`managed` or `basic`); `added` is for the given
        Project's or Album's card. For a tracker, each item has `column`: the Impact Scorecard column it is
        in, or null.
      operationId: listMetricDestinationTargets
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/MetricId'
        - $ref: '#/components/parameters/MetricDestinationProjectId'
        - $ref: '#/components/parameters/MetricDestinationBundleId'
        - $ref: '#/components/parameters/MetricDestination'
        - name: q
          in: query
          required: false
          schema: {type: string}
          description: Search by name (`outcomes` and `indicators` only)
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: Paginated places
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: {type: integer}
                  page_size: {type: integer}
                  page_count: {type: integer}
                  total_count: {type: integer}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        added: {type: boolean}
                        removable:
                          type: boolean
                          description: False when it can't be removed here (a Survey that asks the metric, or an Outcome/Indicator link that stories have used)
                        organisation:
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                data:
                  - {id: 41, name: Albany, added: false, organisation: {id: 7, name: Bambanani Trust}}
                  - {id: 12, name: Bambanani, added: true, organisation: {id: 7, name: Bambanani Trust}}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Add Metric To]
      summary: Create a Progress Board with a metric on it
      description: |
        "+ Create a new Progress Board and add this to it" in the Add metric to popup. Creates a Managed
        Progress Board named "<your name>'s Progress Board" for the Organisation of the Project (or Album)
        given by `project_id` or `bundle_id`, with that Project (or the Album's Projects) on it, "Colleagues
        have their own personalised version of the board" ticked, and the metric as its card. Only
        `progress_boards` supports this. There is no request body.
      operationId: createMetricDestination
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/MetricId'
        - $ref: '#/components/parameters/MetricDestinationProjectId'
        - $ref: '#/components/parameters/MetricDestinationBundleId'
        - $ref: '#/components/parameters/MetricDestination'
      responses:
        "201":
          description: Created, with the card on it
          content:
            application/json:
              example: {added: true, data: {id: 88, name: "Thandi Mokoena's Progress Board"}}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /metrics/{metric_type}/{metric_id}/destinations/{destination}/{target_id}:
    post:
      tags: [Add Metric To]
      summary: Add a metric to a Project, Impact Framework or Collection
      description: |
        Adds a Change or Outcome. To a Project, as Edit Project Metrics does: in the Impact Scorecard column
        of the metric's own stage, after the metrics already there; it is also added to the Project's
        Default Survey and, if the Organisation uses one, its default Progress Board. Requires rights to
        edit the Project's metrics. To an Impact Framework: in the metric's own stage, which is added to
        the framework if missing; only the framework's creator can. To a Collection (which also takes an
        Indicator): at the end; you must own the Collection or edit the Organisation that owns it. With
        `outcomes` or `indicators`: makes the Outcome a parent of the Indicator; you must be able to edit
        the Outcome. To a Survey: as its last, optional question (a scale Indicator is Single Choice;
        an Outcome adds each of its Indicators, as a grid when they share answer choices). To a Progress
        Board (with `project_id` or `bundle_id`): as its last card, showing that Project's or Album's
        results; you must have created the board or be a Board Admin. A Cohort or Workflow Tracker goes in
        the `column` given (default `engagement`) of a Project in its own Organisation or of an Impact
        Framework you created. There is no request body.
      operationId: addMetricToDestination
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MetricDestinationColumn'
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/MetricId'
        - $ref: '#/components/parameters/MetricDestinationProjectId'
        - $ref: '#/components/parameters/MetricDestinationBundleId'
        - $ref: '#/components/parameters/MetricDestination'
        - $ref: '#/components/parameters/MetricDestinationTargetId'
      responses:
        "201":
          description: Added
          content:
            application/json:
              example: {added: true}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Add Metric To]
      summary: Remove a metric from a Project, Impact Framework or Collection
      description: Removes a metric from a Project's metrics, an Impact Framework, a Collection or a Progress Board (only the card for the given `project_id` or `bundle_id`), or unlinks an Indicator from an Outcome (refused with 422 once stories have recorded the Indicator under that Outcome). A Survey's questions are removed by editing the Survey, so `surveys` always answers 422. Requires the same rights as adding it.
      operationId: removeMetricFromDestination
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/MetricId'
        - $ref: '#/components/parameters/MetricDestinationProjectId'
        - $ref: '#/components/parameters/MetricDestinationBundleId'
        - $ref: '#/components/parameters/MetricDestination'
        - $ref: '#/components/parameters/MetricDestinationTargetId'
      responses:
        "200":
          description: Removed
          content:
            application/json:
              example: {added: false}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

components:

  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: X-User-Token
      description: |
        Long-lived token from `POST /users/sign_in`. Does not expire.
        Must be accompanied by `X-User-Email` header.
    submissionBearerAuth:
      type: http
      scheme: bearer
      description: |
        A `ReferralLinkSubmissionCredential` token, scoped to a single Signup Page —
        obtained from `submission_credential.token` in the Offline Collector's Form
        Definition response, **not** a Devise session or `X-User-Email`/`X-User-Token`
        pair. Used only by `POST /referral_submissions`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Unique integer identifier
    MetricType:
      name: metric_type
      in: path
      required: true
      schema:
        type: string
        enum: [change, outcome, indicator, cohort_tracker, workflow_tracker]
      description: The kind of metric. A Cohort or Workflow Tracker can go to `projects` and `impact_frameworks` only.
    MetricDestinationColumn:
      name: column
      in: query
      required: false
      schema:
        type: string
        enum: [activities, engagement, potential, behaviour, growth]
        default: engagement
      description: For a Cohort or Workflow Tracker, the Impact Scorecard column to put it in.
    MetricId:
      name: metric_id
      in: path
      required: true
      schema:
        type: integer
      description: The Change, Outcome or Indicator ID
    MetricDestination:
      name: destination
      in: path
      required: true
      schema:
        type: string
        enum: [projects, impact_frameworks, surveys, collections, outcomes, indicators, progress_boards]
      description: Where to add the metric (`impact_frameworks` are Templates, `surveys` are Story Categories; `outcomes` is for an Indicator, `indicators` for an Outcome; `progress_boards` needs `project_id` or `bundle_id`)
    MetricDestinationProjectId:
      name: project_id
      in: query
      required: false
      schema: {type: integer}
      description: The Project whose results a Progress Board card shows. Offers `progress_boards`; you need a role on the Project.
    MetricDestinationBundleId:
      name: bundle_id
      in: query
      required: false
      schema: {type: integer}
      description: The Album (Bundle) whose results a Progress Board card shows, instead of a Project. You must be able to see the Album.
    MetricDestinationTargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: integer
      description: The ID of the Project (or other destination) to add the metric to
    CohortTrackerAlbumId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: integer
      description: The Album (Bundle) ID
    CohortTrackerProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
      description: The Project ID
    CohortTrackerTimeframe:
      name: timeframe
      in: query
      required: false
      schema:
        type: string
        enum: [period, year_to_date, all_time]
        default: all_time
      description: |
        period: the day after the previous Target Deadline up to the deadline. year_to_date: the
        start of the Project's or Album's year up to the deadline. all_time: everything up to the deadline.
    CohortTrackerCohort:
      name: cohort
      in: query
      required: false
      schema:
        type: string
        enum: [in, not_in]
        default: in
      description: Which Contacts `data` lists. `in` the cohort; for a percentage, `not_in` lists the Contacts in the denominator who aren't in the cohort (the popup's Not in cohort tab).
    CohortTrackerAsOf:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: The deadline the window ends on. Defaults to the next Target Deadline, or today when there is none.
    OrganisationId:
      name: organisation_id
      in: path
      required: true
      schema:
        type: integer
      description: The Organisation (Charity) ID
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (default 1)
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        maximum: 200
      description: Records per page (default 10, max 200)
    LastSyncDatetime:
      name: last_sync_datetime
      in: query
      schema:
        type: string
        example: "2023-07-30 08:48:55.781228"
      description: ISO 8601 datetime — returns only records updated after this value
    FilteredMetricProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
      description: The Project ID
    FilteredMetricBundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: integer
      description: The Album (Bundle) ID
    FilteredMetricId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: The filtered version's ID
    FilteredMetricTimeframe:
      name: timeframe
      in: query
      schema:
        type: string
        enum: [period, year_to_date, all_time]
        default: all_time
      description: |
        `period`: from the day after the previous Target Deadline; `year_to_date`: from the Year
        Start; `all_time`: everything. Each ends at `as_of`.
    FilteredMetricAsOf:
      name: as_of
      in: query
      schema:
        type: string
        format: date
      description: The date the timeframe ends (YYYY-MM-DD). Defaults to the next Target Deadline, or today.
    IncludePublicLibrary:
      name: include_public_library
      in: query
      schema:
        type: boolean
        default: false
      example: true
      description: Also include Indicators or Outcomes from the public library shared by all organisations (default false)

  responses:
    LibraryItemCreated:
      description: Created. The new item as **Get a library item** shows it, and whether it is approved for the public library
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                allOf:
                  - $ref: '#/components/schemas/LibraryItem'
                  - type: object
                    properties:
                      approved:
                        type: boolean
          example:
            data:
              id: 5521
              type: list
              name: "Agree - Disagree"
              owner: your organisation
              choices:
                - {id: 90101, name: "Agree", points: null}
                - {id: 90102, name: "Disagree", points: null}
              approved: false
    LibraryItemUpdated:
      description: Changed. The item as **Get a library item** shows it
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/LibraryItem'
          example:
            data:
              id: 5521
              type: list
              name: "Interview confidence scale"
              owner: your organisation
              choices:
                - {id: 90101, name: "Very confident", points: null}
                - {id: 90102, name: "Not confident", points: null}
    LibraryDuplicates:
      description: |
        Nothing was created: items you can reuse already have the same or a near-identical name. Reuse
        one, or send `force: true` to create it anyway. An exact duplicate in your own organisation is
        refused even with `force`, and is listed by `id` and `type` only.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              duplicates:
                type: array
                items:
                  type: object
                  required: [id, type]
                  properties:
                    id:
                      type: integer
                    type:
                      type: string
                    name:
                      type: string
                    owner:
                      type: string
                      enum: [your organisation, public library, Makerble]
          example:
            error: "A List with this name already exists. Reuse it, or send force: true to create another."
            duplicates:
              - {id: 4410, type: list, name: "Agree – Disagree", owner: your organisation}
    LibraryCreateForbidden:
      description: You may not create this kind of item, as in the Makerble app (e.g. only Makerble staff create Units)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "You do not have permission to create ratio sets."
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "You need to sign in before continuing."
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Record not found."
    Forbidden:
      description: The user doesn't have permission for this Project or organisation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              errors:
                type: string
          example:
            success: false
            errors: "Permission denied."
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityList:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
          example:
            errors: ["Name can't be blank"]
    ForbiddenError:
      description: The user may not do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
    WebhooksNotTurnedOn:
      description: Webhooks are not turned on for this Organisation yet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Webhooks are not turned on for this organisation"

  schemas:
    BulkProjectMove:
      type: object
      description: A move of many Contacts through Projects, and how far it has got
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed, undone]
        total_count:
          type: integer
          description: Contacts the move will try to change (the selection, less Headline Only Contacts)
        processed_count:
          type: integer
          description: Contacts reached so far
        changed_count:
          type: integer
          description: Contacts whose Projects or status changed
        skip_counts:
          type: object
          additionalProperties: { type: integer }
          description: Skipped Contacts by reason, e.g. headline_only, not_allowed or error
        background:
          type: boolean
          description: True when the move runs in the background (more than 50 Contacts)
        summary:
          type: string
          nullable: true
          description: The finished message, e.g. "12 contacts changed. 3 skipped …"; null until it has finished
    StartPage:
      type: object
      required: [start_page, options]
      properties:
        start_page:
          type: string
          enum: [newsfeed, focus, snapshot, autopilot]
          description: The key of your start page; newsfeed when you have never chosen
        options:
          type: array
          description: The pages you can choose, in the order the Today section lists them
          items:
            type: object
            required: [key, label, description]
            properties:
              key:
                type: string
                description: e.g. focus
              label:
                type: string
                description: Its name under Today, e.g. Focus
              description:
                type: string
                description: The line under it in Personal Settings › Preferences
    FocusSource:
      type: object
      required: [key, label, shown]
      properties:
        key:
          type: string
          description: e.g. checklist_actions
        label:
          type: string
          description: Its name under ⚙ What Focus shows you, e.g. Checklist Actions
        shown:
          type: boolean
          description: False when you have switched it off
    FocusItem:
      type: object
      required: [id, type, title, context, contact, url, due_on, raised_on, due_text, section, action]
      properties:
        id:
          type: string
          description: Unique across every source, e.g. checklist_actions-812
        type:
          type: string
          description: The source it came from, e.g. checklist_actions
        title:
          type: string
          description: What it is, e.g. the Checklist step
        context:
          type: string
          description: Where it belongs, e.g. "Checklist Action · Intake · step 2 of 5", plus who is responsible when it isn't you
        contact:
          type: object
          nullable: true
          description: The Contact it is about, when there is one
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        url:
          type: string
          description: Where the row leads
        due_on:
          type: string
          format: date
          nullable: true
          description: The day it is due, or null
        raised_on:
          type: string
          format: date
          nullable: true
          description: For something with no due date, the day it was raised
        due_text:
          type: string
          description: e.g. "15 days overdue", "Due today", "Due in 4 days", "No due date"
        section:
          type: string
          enum: [overdue, today, this_week, later]
        action:
          type: object
          description: The row's one button
          required: [label, url, method]
          properties:
            label:
              type: string
              description: e.g. Open
            url:
              type: string
            method:
              type: string
              description: The HTTP method, e.g. get
    FocusFeed:
      type: object
      required: [scope, teams, type, sources, counts, sections, page, page_size, page_count, total_count, data]
      properties:
        scope:
          type: string
          enum: [me, teams]
        teams:
          type: boolean
          description: You are in a Team, so scope=teams is available
        type:
          type: string
          nullable: true
          description: The type filtered by, or null for every type
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FocusSource'
        counts:
          type: object
          description: "`all`, and the number of items of each type that has any, e.g. {all: 4, checklist_actions: 4}"
          required: [all]
          additionalProperties:
            type: integer
          properties:
            all:
              type: integer
        sections:
          type: array
          description: The sections that have items, in order
          items:
            type: object
            required: [key, label, count]
            properties:
              key:
                type: string
                enum: [overdue, today, this_week, later]
              label:
                type: string
              count:
                type: integer
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          type: integer
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/FocusItem'

    ImpactStoreSearchResult:
      type: object
      description: A published ImpactStore item found by **Search the ImpactStore**.
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [survey, contact_form, case_form, impact_framework, report_template, toolkit, project_type]
        type_label:
          type: string
          description: The front-end name of the type, e.g. Contact Form
        name:
          type: string
        description:
          type: string
          nullable: true
          description: One line of plain text (always null for a Case Form)
        causes:
          type: array
          items:
            type: string
          description: Cause and subcause names, causes first
        used_by_count:
          type: integer
          description: How many organisations use it
        explore_url:
          type: string
          nullable: true
          description: Its page on Explore (null for a Project Type)
        matched_words:
          type: integer
          description: How many of the query's words it matched

    PaginatedImpactStoreSearch:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          type: integer
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImpactStoreSearchResult'

    LibrarySearchResult:
      type: object
      description: A library item found by **Search the library**. Metrics also have `metric_type` and `choices`; Lists have `choices`.
      additionalProperties: true
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [survey, metric, activity_tracker, outcome, list, unit, field, contact_form, case_form, impact_framework, toolkit, project_type, idea]
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: One line of plain text
        owner:
          type: string
          enum: [your organisation, public library, Makerble]

    ExploreSurvey:
      type: object
      description: A Survey (Story Category) listed on Explore Surveys
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        shared_by:
          type: string
          nullable: true
          description: The organisation (or person) that published it
        tag:
          type: string
          nullable: true
          enum: [Verdicts, Validated, null]
        question_count:
          type: integer
        estimated_minutes:
          type: integer
          nullable: true
          description: About how long it takes to answer, worked out from its questions
        themes:
          type: array
          items:
            type: string
        audiences:
          type: array
          description: Who answers it
          items:
            type: string
        repeats_at_intervals:
          type: boolean
        validated:
          type: boolean
          description: An industry-recognised, validated scale
        verdicts:
          type: boolean
          description: Verdicts are set up, so it classifies each respondent automatically
        libraries_count:
          type: integer
          description: How many organisations have it in one of their projects
        yours:
          type: boolean
          description: Your organisation published it
        added_to_a_project:
          type: boolean
          description: It is already in one of your organisation's projects

    ExploreFacetGroup:
      type: object
      properties:
        key:
          type: string
          enum: [theme, audience, time, feature]
        label:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              count:
                type: integer
                description: How many Surveys this option would return, given the other filters already chosen
              selected:
                type: boolean

    PaginatedExploreSurveys:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          type: integer
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExploreSurvey'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/ExploreFacetGroup'

    ExploreSurveyPreview:
      allOf:
        - $ref: '#/components/schemas/ExploreSurvey'
        - type: object
          properties:
            sections:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                    nullable: true
                  questions:
                    type: array
                    items:
                      type: string

    PaginatedLibrarySearch:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          type: integer
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySearchResult'

    ForceCreate:
      type: boolean
      default: false
      description: Create it even though an item with a near-identical name exists (see the 409 response)

    SurveyDraftQuestion:
      type: object
      description: One question. Give exactly one of metric_id, field_id, activity_tracker_id, new_metric or new_field.
      properties:
        metric_id:
          type: integer
        field_id:
          type: integer
        activity_tracker_id:
          type: integer
        new_metric:
          type: object
          required: [name, metric_type, default_question, outcome_id]
          properties:
            name:
              type: string
            metric_type:
              type: string
              enum: [scale, value, binary]
            default_question:
              type: string
            list_id:
              type: integer
              description: Scale only
            list:
              type: object
              description: Scale only, instead of list_id
              required: [name, choices]
              properties:
                name:
                  type: string
                choices:
                  type: array
                  maxItems: 50
                  items: {type: string}
            outcome_id:
              type: integer
            unit_id:
              type: integer
              description: Value only
            success_direction:
              type: string
              enum: [top to bottom, bottom to top, none]
            description:
              type: string
        new_field:
          type: object
          required: [field_name, field_data_type]
          properties:
            field_name:
              type: string
            field_data_type:
              type: string
              enum: [text, number, date, time, file, section_title, email_address, telephone]
            section_text:
              type: string
            private:
              type: boolean
        is_mandatory:
          type: boolean
        choice:
          type: string
          enum: [single_choice, unlimited_choice, limited_choice]
          description: Scale Metrics only (default single_choice)
        choice_value:
          type: integer
          description: With limited_choice, how many answers may be picked
        external_description:
          type: string
        internal_description:
          type: string

    ContactFormDraftQuestion:
      type: object
      description: One field. Give exactly one of field_id, list_id, new_field or new_list.
      properties:
        field_id:
          type: integer
        list_id:
          type: integer
        new_field:
          type: object
          required: [field_name, field_data_type]
          properties:
            field_name:
              type: string
            field_data_type:
              type: string
              enum: [text, number, date, time, file, section_title, email_address, telephone]
            section_text:
              type: string
            private:
              type: boolean
        new_list:
          type: object
          required: [name, choices]
          properties:
            name:
              type: string
            choices:
              type: array
              maxItems: 50
              items: {type: string}
        is_mandatory:
          type: boolean
        choice:
          type: string
          enum: [single_choice, unlimited_choice, limited_choice]
        choice_value:
          type: integer
        layout:
          type: string
          enum: [compact, expanded]
        external_description:
          type: string
        internal_description:
          type: string

    ImpactFrameworkDraftEntry:
      type: object
      description: One entry. Give a stage and exactly one of activity_tracker_id, new_activity_tracker, outcome_id or new_outcome.
      required: [stage]
      properties:
        stage:
          type: string
          enum: [Activity outputs, Participation outputs, Short-term outcomes, Medium-term outcomes, Long-term outcomes]
        activity_tracker_id:
          type: integer
        new_activity_tracker:
          type: object
          required: [name, category]
          properties:
            name:
              type: string
            category:
              type: string
              description: The cause area it belongs to (Make Change Category), e.g. Education
            description:
              type: string
            instruction:
              type: string
        outcome_id:
          type: integer
        new_outcome:
          type: object
          required: [title]
          properties:
            title:
              type: string
            description:
              type: string
            instruction:
              type: string
        new_metrics:
          type: array
          description: Outcome entries only
          items:
            type: object
            required: [name, metric_type, default_question]
            properties:
              name:
                type: string
              metric_type:
                type: string
                enum: [scale, value, binary]
              default_question:
                type: string
              list_id:
                type: integer
              list:
                type: object
                required: [name, choices]
                properties:
                  name:
                    type: string
                  choices:
                    type: array
                    items: {type: string}
              unit_id:
                type: integer
              success_direction:
                type: string
                enum: [top to bottom, bottom to top, none]
              description:
                type: string

    LibraryItem:
      type: object
      description: A library item in full. The fields beyond these depend on `type`; see **Get a library item**.
      additionalProperties: true
      properties:
        id:
          type: integer
        type:
          type: string
        name:
          type: string
          nullable: true
        owner:
          type: string
          enum: [your organisation, public library, Makerble]

    LibraryUsage:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        name:
          type: string
          nullable: true
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
                nullable: true
        other_projects_count:
          type: integer
        records_count:
          type: integer
        last_used_at:
          type: string
          format: date-time
          nullable: true
        contained_in:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              id:
                type: integer
              name:
                type: string
                nullable: true
        contained_in_count:
          type: integer
        in_use:
          type: boolean

    ContactSummaryResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, stale, pending, failed, empty]
        new_story_count:
          type: integer
          description: Stories you can see that were added since this summary was made
        summary:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ContactSummary'

    ContactSummary:
      type: object
      properties:
        id:
          type: integer
        generated_at:
          type: string
          format: date-time
        model:
          type: string
          example: claude-haiku-4-5-20251001
        source_story_ids:
          type: array
          items:
            type: integer
          description: The Stories the summary was made from
        sections:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
                enum: [Who, Progress, Watch for]
              text:
                type: string
              bio:
                type: boolean
                description: True if any sentence in the section came from the bio
              story_ids:
                type: array
                items:
                  type: integer
              sentences:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    bio:
                      type: boolean
                    story_ids:
                      type: array
                      items:
                        type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Timestamps:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T09:30:00.000+00:00"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T09:30:00.000+00:00"

    EventSummary:
      type: object
      description: An event, as listed on Manage Events.
      properties:
        id: { type: integer }
        name: { type: string }
        charity_id: { type: integer }
        start_datetime: { type: string, format: date-time }
        end_datetime: { type: string, format: date-time }
        timezone: { type: string, nullable: true, description: "IANA time zone the event is held in" }
        location: { type: string, nullable: true }
        event_type:
          type: string
          enum: [one-off, master, subsequent]
          description: "`master` is the first event of a recurring series; `subsequent` are the rest"
        listing_enabled: { type: boolean, description: "Whether the event appears in Events Catalogues" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        project:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        event_category:
          type: object
          description: The Event Format
          properties:
            id: { type: integer }
            name: { type: string }
        master_event_id: { type: integer, nullable: true, description: "For a subsequent event, the master event of its series" }
        guests_count: { type: integer }
        managers_count: { type: integer }
        workers_count: { type: integer }

    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            can_edit: { type: boolean }
            can_delete: { type: boolean }
            recurring_schedule:
              type: object
              nullable: true
              description: For a master event, the rule its series repeats by
              properties:
                rule: { type: object, description: "The IceCube rule" }
                description: { type: string, example: "Weekly on Tuesdays" }
                frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
                interval: { type: integer }
                days_of_week: { type: array, items: { type: string } }
                days_of_month: { type: array, items: { type: integer } }
            recurring_end_date: { type: string, format: date, nullable: true }
            series_events_count: { type: integer, nullable: true, description: "Events in this event's series, or null for a one-off event" }
            custom_fields:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, description: "Custom field id" }
                  name: { type: string }
                  value: { nullable: true, description: "The value; a file is an object with url and file_name" }
            dropdowns:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, description: "Dropdown (Ratio Set) id" }
                  name: { type: string }
                  answer_choices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: "Answer choice (Sub Ratio) id" }
                        name: { type: string }
            signup_page:
              type: object
              nullable: true
              description: The Signup Page (Referral Link Detail) people register through
              properties:
                id: { type: integer }
                name: { type: string }
            self_check_in:
              type: object
              nullable: true
              description: The Survey (and Wave) guests answer when they check themselves in
              properties:
                survey:
                  type: object
                  properties:
                    id: { type: integer, description: "Survey (Story Category) id" }
                    name: { type: string }
                    project_survey_id: { type: integer, description: "The Survey's link to the project (Project Story Category)" }
                wave:
                  type: object
                  nullable: true
                  properties:
                    id: { type: integer }
                    name: { type: string }
            capacity:
              type: object
              properties:
                guests: { type: string, enum: [fixed, unlimited] }
                max_guests: { type: integer }
                allow_signup_after_full: { type: boolean }
                guest_status_for_signup_id: { type: integer, nullable: true, description: "Guest Status (Event State) for people who sign up while there is space" }
                guest_status_after_full_id: { type: integer, nullable: true, description: "Guest Status for people who sign up once the event is full" }
                confirmation_message_after_full: { type: string, nullable: true }
                thank_you_message: { type: string, nullable: true }
                workers: { type: string, enum: [fixed, unlimited] }
                max_workers: { type: integer }
                timesheets_for_workers: { type: boolean }
                timesheets_for_guests: { type: boolean }
            listing:
              type: object
              properties:
                listing_enabled: { type: boolean }
                location: { type: string, nullable: true }
                description: { type: string, nullable: true, description: "HTML" }
                image_url: { type: string, nullable: true }
            links:
              type: object
              description: Links to share with guests; null when the event has no such page
              properties:
                self_check_in: { type: string, nullable: true }
                signup: { type: string, nullable: true }
                signup_and_self_check_in: { type: string, nullable: true }

    PaginatedEvents:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'

    ProjectEventFormat:
      type: object
      required: [id, name, is_default]
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "Drop-in Session"
        is_default:
          type: boolean
          example: false

    PaginatedProjectEventFormats:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProjectEventFormat'

    IdAndName:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: "Booked"

    EventFormField:
      type: object
      required: [name, kind, field_id, data_type, mandatory, priority, validation_hint, dropdown]
      properties:
        name:
          type: string
          description: The event attribute (name, start_datetime, end_datetime), or the custom field's or Dropdown's name.
          example: "Session type"
        kind:
          type: string
          enum: [event_attribute, custom_field, dropdown]
        field_id:
          type: integer
          nullable: true
          description: The custom field's id, or the Dropdown's (Ratio Set's) id. Null for an event attribute.
          example: 15
        data_type:
          type: string
          description: datetime or text for an event attribute; the custom field's type (date, number, text, tickbox, ward, ...); or dropdown.
          example: "dropdown"
        mandatory:
          type: boolean
        priority:
          type: integer
          nullable: true
          example: 4
        validation_hint:
          type: string
          nullable: true
          description: The rule a custom field's answer must follow, as the form shows it.
          example: "Must contain exactly 3 letters and numbers"
        dropdown:
          type: object
          nullable: true
          required: [choice, choice_limit, options]
          properties:
            choice:
              type: string
              enum: [single_choice, unlimited_choice, limited_choice]
            choice_limit:
              type: integer
              nullable: true
              description: How many options may be chosen, for limited_choice.
              example: 2
            options:
              type: array
              description: The answer choices (Sub Ratios).
              items:
                $ref: '#/components/schemas/IdAndName'

    EventForm:
      type: object
      required: [project, event_category, event_id, fields, self_check_in, signup_pages, guest_statuses, event_roles]
      properties:
        project:
          $ref: '#/components/schemas/IdAndName'
        event_category:
          $ref: '#/components/schemas/IdAndName'
        event_id:
          type: integer
          nullable: true
          example: null
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EventFormField'
        self_check_in:
          type: object
          required: [enabled, surveys, waves]
          properties:
            enabled:
              type: boolean
              description: Whether the Event Format has Self Check-in (Survey Kiosk) turned on.
            surveys:
              type: array
              items:
                type: object
                required: [project_story_category_id, story_category_id, name]
                properties:
                  project_story_category_id:
                    type: integer
                    example: 2053
                  story_category_id:
                    type: integer
                    example: 2136
                  name:
                    type: string
                    example: "Attendance"
            waves:
              type: array
              items:
                type: object
                required: [id, name, story_category_id, project_story_category_id]
                properties:
                  id:
                    type: integer
                    example: 31
                  name:
                    type: string
                    example: "Week 1"
                  story_category_id:
                    type: integer
                    nullable: true
                    example: 2136
                  project_story_category_id:
                    type: integer
                    nullable: true
                    example: 2053
        signup_pages:
          type: array
          description: The Project's active Signup Pages (Referral Link Details).
          items:
            $ref: '#/components/schemas/IdAndName'
        guest_statuses:
          type: array
          description: The Event Format's Guest Statuses (Event States), in order. The first is the default for people who sign up.
          items:
            $ref: '#/components/schemas/IdAndName'
        event_roles:
          type: object
          required: [enabled, guests, event_managers_and_workers]
          properties:
            enabled:
              type: boolean
            guests:
              type: array
              items:
                $ref: '#/components/schemas/IdAndName'
            event_managers_and_workers:
              type: array
              items:
                $ref: '#/components/schemas/IdAndName'

    RecurringScheduleInput:
      type: object
      required: [frequency]
      description: How a recurring series repeats.
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1, default: 1, description: "Every this many days, weeks, months or years" }
        days_of_week:
          type: array
          description: Weekly series only
          items: { type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday] }
        days_of_month:
          type: array
          description: Monthly series only; -1 is the last day of the month
          items: { type: integer }

    EventUpdateRequest:
      type: object
      properties:
        event_category_id: { type: integer, description: "The Event Format (event category); one of the project's" }
        name: { type: string }
        start_datetime: { type: string, example: "2030-01-08T18:00", description: "ISO 8601; without an offset it is local to timezone" }
        end_datetime: { type: string, example: "2030-01-08T20:00" }
        timezone: { type: string, example: "Europe/London", description: "IANA time zone name" }
        location: { type: string }
        custom_fields:
          type: object
          description: "Custom field id => value. Dates are YYYY-MM-DD, times HH:MM, tickboxes true or false."
          additionalProperties: true
        dropdowns:
          type: object
          description: "Dropdown (ratio set) id => answer choice (sub ratio) ids, within the Dropdown's choice rule"
          additionalProperties: { type: array, items: { type: integer } }
        manager_ids: { type: array, items: { type: integer }, description: "Event Managers: colleagues in the project or organisation; at least one" }
        worker_ids: { type: array, items: { type: integer }, description: "Event Workers: colleagues in the project or organisation" }
        signup_page_id: { type: integer, nullable: true, description: "One of the project's active Signup Pages (referral link details)" }
        guest_status_for_signup_id: { type: integer, nullable: true, description: "Guest Status (event state) for people who sign up while there is space" }
        self_check_in:
          type: object
          nullable: true
          description: The Self Check-in (kiosk) Survey and Wave, when the Event Format has Self Check-in turned on
          properties:
            project_story_category_id: { type: integer }
            wave_id: { type: integer, nullable: true }
        capacity:
          type: object
          properties:
            guests: { type: string, enum: [fixed, unlimited] }
            max_guests: { type: integer, minimum: 0 }
            allow_signup_after_full: { type: boolean }
            guest_status_after_full_id: { type: integer, nullable: true }
            confirmation_message_after_full: { type: string }
            thank_you_message: { type: string }
            workers: { type: string, enum: [fixed, unlimited] }
            max_workers: { type: integer, minimum: 0 }
            timesheets_for_workers: { type: boolean }
            timesheets_for_guests: { type: boolean }
        listing:
          type: object
          properties:
            listing_enabled: { type: boolean, description: "Needs a Signup Page" }
            description: { type: string, description: "HTML" }
        apply_to: { type: string, enum: [this_event, all_events_in_series], default: this_event }
        recurring_schedule:
          allOf: [{ $ref: '#/components/schemas/RecurringScheduleInput' }]
          description: "Master event only: a new Recurring Schedule for the whole series"
        recurring_end_date: { type: string, format: date, description: "Master event only: a new Recurring End Date for the whole series" }
        keep_event_ids: { type: array, items: { type: integer }, description: "With a schedule change: events that no longer fit, to keep" }
        delete_event_ids: { type: array, items: { type: integer }, description: "With a schedule change: events that no longer fit, to delete" }

    SeriesScheduleChangeRequest:
      type: object
      properties:
        recurring_schedule: { $ref: '#/components/schemas/RecurringScheduleInput' }
        recurring_end_date: { type: string, format: date, example: "2030-02-05" }

    SeriesSchedulePreview:
      type: object
      required: [master_event_id, recurring_schedule, recurring_end_date, required_dates, no_longer_fitting_events]
      properties:
        master_event_id: { type: integer }
        recurring_schedule:
          type: object
          properties:
            frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
            interval: { type: integer }
            days_of_week: { type: array, items: { type: string } }
            days_of_month: { type: array, items: { type: integer } }
            description: { type: string, example: "Every 2 weeks on Tuesdays" }
        recurring_end_date: { type: string, format: date }
        required_dates:
          type: array
          items:
            type: object
            required: [start_datetime, event_id, exists]
            properties:
              start_datetime: { type: string, format: date-time }
              event_id: { type: integer, nullable: true }
              exists: { type: boolean }
        no_longer_fitting_events:
          type: array
          items:
            type: object
            required: [id, name, start_datetime, has_stories, has_timesheets]
            properties:
              id: { type: integer }
              name: { type: string }
              start_datetime: { type: string, format: date-time }
              has_stories: { type: boolean }
              has_timesheets: { type: boolean }

    EventGuest:
      type: object
      required: [contact_id, name, guest_status, event_role, added_at, updated_at]
      properties:
        contact_id: { type: integer, description: "The Contact (beneficiary) id" }
        name: { type: string }
        guest_status:
          type: object
          nullable: true
          properties: { id: { type: integer }, name: { type: string } }
        event_role:
          type: object
          nullable: true
          properties: { id: { type: integer }, name: { type: string } }
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventGuestCount:
      type: object
      required: [event_id, guests_count]
      properties:
        event_id: { type: integer }
        guests_count: { type: integer }

    EventStaffMember:
      type: object
      required: [user_id, name, roles, event_role]
      properties:
        user_id: { type: integer }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [manager, worker] } }
        event_role:
          type: object
          nullable: true
          properties: { id: { type: integer }, name: { type: string } }

    EventCreateRequest:
      allOf:
        - $ref: '#/components/schemas/EventUpdateRequest'
        - type: object
          required: [project_id, event_category_id, name, start_datetime, end_datetime]
          properties:
            project_id: { type: integer }
            recurring_schedule:
              $ref: '#/components/schemas/RecurringScheduleInput'
            recurring_end_date: { type: string, format: date, description: "Last day of the series; required with recurring_schedule" }

    PaginationEnvelope:
      type: object
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 10
        page_count:
          type: integer
          example: 42
        total_count:
          type: integer
          example: 418

    PaginatedGeneric:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object

    PaginatedProjectResults:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            start_date:
              type: string
              format: date
              nullable: true
              example: "2026-04-01"
            end_date:
              type: string
              format: date
              nullable: true
              example: "2027-03-31"
            project_ids:
              type: array
              items:
                type: integer
              example: [619]
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProjectResultsTracker'

    ProjectResultsTracker:
      type: object
      description: One tracker on the Results Canvas. Which figures appear depends on tracker_type.
      properties:
        tracker_type:
          type: string
          enum: [Activity tracker, Engagement tracker, Achievement tracker, Choice tracker, Numerical tracker]
          example: Activity tracker
        backend_type:
          type: string
          example: Change of Activity type
        tracker_id:
          type: integer
          description: The Change ID (Activity and Engagement trackers) or Indicator ID (the others)
          example: 1201
        tracker_name:
          type: string
          example: Sessions delivered
        outcome_name:
          type: string
          description: The Outcome an Indicator sits under
          example: Into employment
        times_recorded:
          type: integer
          example: 13
        contacts:
          type: integer
          example: 6
        contacts_achieved:
          type: integer
        answers:
          type: array
          items:
            type: object
            properties:
              sub_ratio_id:
                type: integer
              sub_ratio:
                type: string
                example: High
              count:
                type: integer
              contacts:
                type: integer
        total:
          type: number
        average_per_contact:
          type: number
          nullable: true
        anonymous_count:
          type: integer
          example: 7
        anonymous_total:
          type: number
        target:
          type: integer
          example: 20
        target_deadline:
          type: string
          format: date
          nullable: true
          example: "2026-03-31"
        percent_of_target:
          type: number
          example: 65.0
        groups:
          type: array
          description: Present with group_by. Each row has `month` ("YYYY-MM") or `project` ({id, name}) plus the same figures; Project rows also carry that Project's target.
          items:
            type: object

    AuthResponse:
      type: object
      properties:
        user_id:
          type: integer
          example: 42
        email:
          type: string
          format: email
          example: user@example.com
        authentication_token:
          type: string
          description: Long-lived token. Does not expire.
          example: "sJxyz_abc123longtoken"

    Charity:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              type: integer
              example: 31
            name:
              type: string
              example: "Greenfield Community Trust"

    ProjectDetail:
      description: A Project as returned by `GET /projects/{id}`.
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            beneficiary_states:
              type: array
              description: |
                The Contact statuses (Beneficiary States) switched on for the
                Project, e.g. Enrolled or Waiting List. Pass an `id` as `beneficiary_state_id` to
                `POST /project_beneficiaries`.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 3
                  name:
                    type: string
                    example: "Enrolled"

    Album:
      type: object
      description: An Album (Bundle; Portfolio on screen) groups Projects so their results can be seen together.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        owner_type:
          type: string
          enum: [Charity, User]
          description: "`Charity` for an Organisation's Album, `User` for a personal one"
        owner_id:
          type: integer
        creator_id:
          type: integer
          description: The user who made the Album
        manager_ids:
          type: array
          items:
            type: integer
          description: The Album's managers, who may change it
        analyst_ids:
          type: array
          items:
            type: integer
          description: The Album's Album Analysts, who may see its results
        project_ids:
          type: array
          items:
            type: integer
        pending_project_ids:
          type: array
          items:
            type: integer
          description: Projects invited to join, until their managers accept. Not in list responses.
        target_type:
          type: string
          nullable: true
          enum: [manual_target, automatic_target, null]
        year_start_date:
          type: string
          format: date
          nullable: true
        automatically_create_survey_progress_board:
          type: boolean
          description: Whether each Survey on the Album's Projects gets a progress board
        default_results_template_id:
          type: integer
          nullable: true
          description: The Impact Framework the Album's Progress Panel opens on; null for All metrics
        cover_image_url:
          type: string
          nullable: true
        url:
          type: string
          description: The Album's page in Makerble
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlbumList:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        page_count:
