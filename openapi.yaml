  /workflow_trackers/{id}/projects/{project_id}/results:
    get:
      tags: [Workflow Trackers]
      summary: Get a Workflow Tracker's result on a Project
      description: |
        A Workflow Tracker's result on a Project's Results Canvas, with the items behind it: what the
        Workflow Tracker card shows, and the list its popup opens. The tracker must be on the Project.

        `result_kind` `additive` (counting each signposting or referral) adds up across periods.
        `snapshot` (counting each Contact once) is worked out for the window on its own and read as of
        `as_of`: the window's last day, or today while that is still to come. `target` is the deadline
        targets dated in the window, added up (for a snapshot, the one on its last day), or else the
        one-off target, or null.

        `data` lists one page of the items counted, newest first: the Contact, `detail` (who they were
        signposted to, or the Project they were referred to), `project_id` (a referral's destination) and
        when it happened. For `time_spent`, `number` is hours to 1 decimal place and each item is a
        Timesheet entry: whose time it is (`user_id`, `user_name`; or the Contact for an Event guest's),
        its `hours`, and the Update, Task or Event it was logged on, which the user must be able to see
        for it to be listed. `total_count` counts every item, whatever the count mode. An item the user may
        not see (a Contact they can't read, or a referral to a Project they can't see) is counted in
        `hidden_count` for that page but never listed. Requires the same rights as viewing that Results
        Canvas.
      operationId: getWorkflowTrackerProjectResults
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CohortTrackerProjectId'
        - $ref: '#/components/parameters/CohortTrackerTimeframe'
        - $ref: '#/components/parameters/CohortTrackerAsOf'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The result and the items behind it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTrackerResult'
              example:
                workflow_tracker_id: 7
                name: Signpostings made
                project_id: 34
                timeframe: period
                starts_on: "2026-07-01"
                ends_on: "2026-12-31"
                result_kind: additive
                as_of: null
                number: 12
                target: 20
                page: 1
                page_size: 9
                page_count: 2
                total_count: 12
                hidden_count: 1
                data:
                  - { contact_id: 501, contact_name: Thandi Mokoena, detail: "Mfuleni Clinic · Nurse Dlamini", project_id: null, happened_at: "2026-09-01T09:00:00Z" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see this Project's Results Canvas
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /workflow_trackers/{id}/albums/{bundle_id}/results:
    get:
      tags: [Workflow Trackers]
      summary: Get a Workflow Tracker's result on an Album
      description: |
        As for a Project, across the Album's open Projects: an item, or in `contacts` mode a Contact,
        counts once however many of its Projects it relates to, so the result is never the sum of the
        Projects'. The tracker must be on one of the Album's Projects. Requires rights to see the Album.
      operationId: getWorkflowTrackerAlbumResults
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CohortTrackerAlbumId'
        - $ref: '#/components/parameters/CohortTrackerTimeframe'
        - $ref: '#/components/parameters/CohortTrackerAsOf'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The result and the items behind it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTrackerResult'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see this Album
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /cohort_trackers/{id}/projects/{project_id}/results:
    get:
      tags: [Cohort Trackers]
      summary: Get a Cohort Tracker's result on a Project
      description: |
        A Cohort Tracker's result on a Project's Results Canvas, with the Contacts behind it. Only data saved
        in the Project counts. The tracker must be on the Project.

        The result is the number of distinct Contacts who meet the tracker's membership setting and all
        its criteria, counting only stories, events and survey responses saved in scope and dated in the
        window. Results are worked out afresh for each window, so a Year to Date result is not the sum
        of the period results. `target` is the tracker's deadline target on the window's last day, or
        else its one-off target; targets are never summed across deadlines.

        `data` lists the Contacts in the cohort alphabetically, with `qualifying_value` (named by
        `qualifying_value_label`, e.g. an attendance rate as a percentage) where the criteria have one.
        A Contact the user may not read is listed as `{restricted: true}` with no details, so the
        list always adds up to `count`. Requires the same rights as viewing that Results Canvas.

        A percentage tracker also returns `denominator_count` and `percentage`, as the canvas shows
        "84% Children attending 75%+" with "42 of 50 contacts with enough data". The cohort is always
        within the denominator. `percentage` is a whole number, or null when `denominator_count` is 0
        (the canvas shows "–"). `cohort=not_in` lists the rest of the denominator.
      operationId: getCohortTrackerProjectResults
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CohortTrackerProjectId'
        - $ref: '#/components/parameters/CohortTrackerTimeframe'
        - $ref: '#/components/parameters/CohortTrackerAsOf'
        - $ref: '#/components/parameters/CohortTrackerCohort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The result and the Contacts behind it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerResult'
              example:
                cohort_tracker_id: 12
                name: Children attending 75%+
                project_id: 34
                timeframe: year_to_date
                starts_on: "2026-04-01"
                ends_on: "2026-06-30"
                count: 42
                eligible_count: 50
                result_type: percentage
                denominator: enough_data
                denominator_count: 50
                percentage: 84
                target: { number: 75, date: "2026-06-30" }
                qualifying_value_label: Attendance rate
                cohort: in
                page: 1
                page_size: 2
                page_count: 21
                total_count: 42
                data:
                  - { restricted: false, id: 101, name: Aisha Dlamini, qualifying_value: 82.5 }
                  - { restricted: true }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see this Results Canvas

  /projects/{project_id}/filtered_metrics:
    parameters:
      - $ref: '#/components/parameters/FilteredMetricProjectId'
    get:
      tags: [Filtered Metrics]
      summary: List a Project's filtered versions of metrics
      description: |
        The filtered versions on a Project's Results Canvas. Visible to the Project's or its
        Organisation's managers (editors), changemakers (reporters) and analysts (observers): the
        same people who can see the Results Canvas.
      operationId: listProjectFilteredMetrics
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of filtered versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFilteredMetrics'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't see the Project's Results Canvas
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Filtered Metrics]
      summary: Add a filtered version of a metric to a Project
      description: |
        Edit Project Metrics > Add filtered version. The metric being filtered must already be on the
        Project: a Change in one of its columns, or an Indicator under one of its Outcomes. A Change's
        filtered version goes directly after it in its column (or at the end of `column` if given); an
        Indicator's sits under the same Outcome, directly after it. Albums show every filtered version on
        their Projects.

        `response_criteria` filters the responses (stories) the metric was recorded in, as a Progress
        Board's "Filter responses/stories by" does: `story_category_ids` (Surveys), `wave_ids`
        (Intervals), `date_range` ("dd/mm/yyyy - dd/mm/yyyy", Date Happened, either end optional),
        `label_ids` and `author_ids`. Project and Album keys are refused: the responses always come from
        the Project or Album it is on.

        `contact_criteria` filters the Contacts tagged in them, in the Contact Filters format (see
        `POST /cohort_trackers/preview`). Age (`age_from` / `age_to`) is worked out at the date of each
        response; other Bio fields use the Contact's current value; the other sections are judged at the
        end of each reporting period. Either may be sent as a JSON string. Requires the right to edit the
        Project's metrics.
      operationId: createFilteredMetric
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilteredMetricRequest'
            example:
              filtered_metric:
                parent_type: "Change"
                parent_id: 4021
                display_name: "Session attendances — Female, under 21"
                response_criteria:
                  wave_ids: ["12"]
                contact_criteria:
                  sub_ratio_ids: ["881"]
                  age_to: {year: "20", month: "11", day: "30"}
      responses:
        "201":
          description: Filtered version added to the Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredMetric'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit the Project's metrics
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{project_id}/filtered_metrics/preview:
    parameters:
