  /versions:
    get:
      tags: [Versions]
      summary: List a record's Versions (audit trail)
      description: |
        Returns every Version of one record, newest first: each time it was created or edited, who did it and when.
        `record_type` is `Contact` (a Contact, i.e. Beneficiary) or `Story` (a Story or Survey Response). A Story is
        named `[story ID] <survey> in <project> by <user> on <date happened>`. A deleted record's Versions are still
        listed, with `record.deleted: true`.

        Visible to Charity Editors (any Contact or Story in their Organisation) and Project Editors (Contacts in at
        least one of their Projects, and Stories in their Projects that they may read: a Story shared only with
        specific individuals is hidden unless they are one of them). Anything the caller may not see returns `404`,
        so the endpoint never confirms that another Organisation's record exists.

        `user_name` is `System` when no signed-in user made the change (e.g. a CSV import run in the background).
        One Save can write several Versions a fraction of a second apart. Use `GET /versions/{id}` to see the full
        record as it was saved in a Version.
      operationId: listVersions
      security: [{tokenAuth: []}]
      parameters:
        - name: record_type
          in: query
          required: true
          schema:
            type: string
            enum: [Contact, Story]
          description: '`Contact` (Beneficiary) or `Story` (a Story or Survey Response)'
        - name: record_id
          in: query
          required: true
          schema:
            type: integer
          description: The Contact (Beneficiary) ID or the Story ID
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 200
          description: Records per page (default 10, max 200)
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of the record's Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVersions'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                record: { record_type: Contact, record_id: 185170, charity_id: 304, name: Bella Thornton, deleted: false }
                data:
                  - { id: 76, record_type: Contact, record_id: 185170, charity_id: 304, event: update, action: Edited, user_id: 190, user_name: Sam Ahmed, created_at: "2026-09-29T07:50:02.709Z" }
                  - { id: 74, record_type: Contact, record_id: 185170, charity_id: 304, event: create, action: Created, user_id: 190, user_name: Sam Ahmed, created_at: "2026-09-29T07:50:02.319Z" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /versions/{id}:
    get:
      tags: [Versions]
      summary: Get a single Version, with the full record snapshot
      description: |
        Returns one Version including `full_object`: every field of the record exactly as it was saved at that
        moment, not just the fields that changed. Compare two Versions' `full_object` to see what changed.
        For a Story, `full_object` is `{schema_version, story, privacy_settings, contact_ids, outcome_ids, label_ids,
        media, answers}`, where each answer carries the survey question's label as it was then.
        Same permissions as `GET /versions`.
      operationId: getVersion
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Version with full_object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /access_logs:
    get:
      tags: [Access Logs]
      summary: List who viewed a record (Access Logs)
      description: |
        Returns the Access Log of one record, newest first: each time a colleague opened it in Makerble or fetched it
        through the API, who it was, when, and how many times. This is the **Access Logs** tab beside Versions on the
        Manage Versions page. Changes are in `GET /versions` instead.
        `record_type` is `Contact` (a Contact, i.e. Beneficiary) or `Story` (a Story or Survey Response).

        Views by the same colleague, through the same route, less than 30 minutes apart are one entry with a
        `view_count`. Entries older than the Organisation's retention period (3 to 12 months, set on Organisation
        Preferences) are rolled up into one entry per colleague per month, with `monthly_summary: true` and
        `first_viewed_at` / `last_viewed_at` spanning that month. `source` is `web` (opened in Makerble), `api` (fetched with `GET /beneficiaries/{id}`) or `mcp`
        (fetched through the Makerble MCP server).

        Visible to Charity Editors (any Contact or Story in their Organisation) and Project Editors (Contacts in at
        least one of their Projects, and Stories in their Projects that they may read: a Story shared only with
        specific individuals is hidden unless they are one of them). Anything the caller may not see returns `404`,
        so the endpoint never confirms that another Organisation's record exists.
      operationId: listAccessLogs
      security: [{tokenAuth: []}]
      parameters:
        - name: record_type
          in: query
          required: true
          schema:
            type: string
            enum: [Contact, Story]
          description: '`Contact` (Beneficiary) or `Story` (a Story or Survey Response)'
        - name: record_id
          in: query
          required: true
          schema:
            type: integer
          description: The Contact (Beneficiary) ID or the Story ID
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Only entries on or after this date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Only entries on or before this date (YYYY-MM-DD)
        - name: user_id
          in: query
          schema:
            type: integer
          description: Only this colleague's views
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 200
          description: Records per page (default 10, max 200)
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Access Log entries for the record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessLogs'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                record: { record_type: Contact, record_id: 185170, charity_id: 304, name: Bella Thornton, deleted: false }
                data:
                  - { id: 912, record_type: Contact, record_id: 185170, charity_id: 304, action: "Viewed ×1", view_count: 1, source: mcp, user_id: 190, user_name: Sam Ahmed, first_viewed_at: "2026-10-02T14:05:00.000+01:00", last_viewed_at: "2026-10-02T14:05:00.000+01:00", monthly_summary: false }
                  - { id: 877, record_type: Contact, record_id: 185170, charity_id: 304, action: "Viewed ×3", view_count: 3, source: web, user_id: 212, user_name: Jane Smith, first_viewed_at: "2026-10-01T09:20:00.000+01:00", last_viewed_at: "2026-10-01T09:30:00.000+01:00", monthly_summary: false }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /audit_trail:
    get:
      tags: [Audit Trail]
      summary: List an Organisation's latest changes and views (Audit Trail)
      description: |
        Returns the Organisation's **Audit Trail**, newest first: the changes (Versions: Created, Edited, Destroyed) and
        views (Access Logs: Viewed) across all its Contacts (Beneficiaries) and Stories (including Survey Responses).
        This is the **Audit Trail** page, reached from Contacts → More Options → Audit trail. For one record's
        complete history use `GET /versions` and `GET /access_logs` instead.

        Views by the same colleague, through the same route, less than 30 minutes apart are one entry with a
        `view_count`. Only views within the Organisation's retention period are listed; older views are monthly
        summaries on `GET /access_logs`. Stories have views but no Versions yet.

        Visible to Charity Editors (everything in their Organisation) and Project Editors (Contacts and Stories in
        their Projects). An Organisation the caller may not audit returns `404`.
      operationId: listAuditTrail
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - name: actions
          in: query
          schema:
            type: string
          example: created,edited
          description: Comma-separated types of action to include, from `created`, `edited`, `destroyed`, `viewed` (default all)
        - name: user_id
          in: query
          schema:
            type: integer
          description: Only this colleague's actions
        - name: record_type
          in: query
          schema:
            type: string
            enum: [Contact, Story]
          description: Only Contacts, or only Stories
        - name: record_id
          in: query
          schema:
            type: integer
          description: Only this record (needs `record_type`)
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 200
          description: Records per page (default 10, max 200)
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Audit Trail entries for the Organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditTrail'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                data:
                  - { entry_type: access_log, id: 912, action: Viewed, record_type: Contact, record_id: 185170, record_name: Bella Thornton, occurred_at: "2026-10-02T14:05:00.000+01:00", user_id: 190, who: Sam Ahmed (via MCP), view_count: 2, source: mcp }
                  - { entry_type: version, id: 50211, action: Edited, record_type: Contact, record_id: 185170, record_name: Bella Thornton, occurred_at: "2026-10-01T09:30:00.000+01:00", user_id: 212, who: Jane Smith, view_count: null, source: null }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

