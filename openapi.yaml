          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                intro_message:
                  type: string
                  description: Shown to people before they start
            example:
              name: "Job readiness check-in"
              intro_message: "This takes about two minutes."
      responses:
        "200":
          $ref: '#/components/responses/LibraryItemUpdated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /surveys/{id}/questions:
    patch:
      tags: [Library, Story Categories]
      summary: Change a Survey's questions
      operationId: updateSurveyQuestions
      description: |
        Adds, removes, replaces and moves a Survey's questions, as the Survey's Edit page does. Send
        the changes in order: each applies to the questions as the changes before it left them.
        Question numbers are as **Get a library item** lists the Survey's questions, starting at 1.

        - `add`: `question`, and optionally `number` to put it at (default: the end).
        - `remove`: `number`. The question is taken off the Survey; the Metric or Field behind it is kept.
        - `replace`: `number` and `question`.
        - `move`: `number` and `to`.

        A new question takes the same format as in **Create a Survey with its questions**: reuse a
        Metric, Field or Activity tracker by id, or define `new_metric` or `new_field`. A new item
        with the same or a near-identical name as one you could reuse is `422`; send `force: true`
        only if none fits.

        Nothing is changed unless every change can be made. A bad change is `422` naming it, e.g.
        "Change 2: there is no question 5".
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    required: [action]
                    properties:
                      action:
                        type: string
                        enum: [add, remove, replace, move]
                      number:
                        type: integer
                      to:
                        type: integer
                        description: move only
                      question:
                        $ref: '#/components/schemas/SurveyDraftQuestion'
                force:
                  $ref: '#/components/schemas/ForceCreate'
            example:
              changes:
                - {action: add, number: 1, question: {metric_id: 14702, is_mandatory: true}}
                - {action: remove, number: 3}
                - {action: move, number: 2, to: 4}
      responses:
        "200":
          $ref: '#/components/responses/LibraryItemUpdated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /contact_forms:
    post:
      tags: [Library, Beneficiary Categories]
      summary: Create a Contact Form with its fields
      operationId: createContactForm
      description: |
        Creates a Contact Form (Beneficiary Category): the form your organisation fills in about each
        Contact of one kind, with its fields in the order given (at most 50). Each field either
        reuses an item you can see by id (`field_id` for a Field, `list_id` for a List of answer
        choices) or defines a new one (`new_field`, `new_list`).

        Only organisations that use Contact Forms can have one (otherwise `403`). Near-identical
        names of new Fields and Lists get `409` with the matches, each with its `question`, unless
        you send `force: true`. Nothing is created unless everything is. Only your organisation uses
        the form unless you are Makerble staff and send `approved: true`.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id, name, department, contact_role, questions]
              properties:
                organisation_id:
                  type: integer
                  description: The organisation (Charity) that will own it; you must be one of its editors
                name:
                  type: string
                department:
                  type: string
                  enum: [Personal, Professional, Public Impact]
                contact_role:
                  type: string
                  description: What the Contacts are to the organisation, e.g. Participant
                contact_type:
                  type: string
                  description: Person (default), Organisation, Animal or Object
                approved:
                  type: boolean
                  description: Makerble staff only
                force:
                  $ref: '#/components/schemas/ForceCreate'
                questions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ContactFormDraftQuestion'
            example:
              organisation_id: 913
              name: "Young person registration"
              department: Personal
              contact_role: Participant
              questions:
                - field_id: 5120
                  is_mandatory: true
                - new_list:
                    name: "School year"
                    choices: ["Year 7", "Year 8", "Year 9"]
                - new_field:
                    field_name: "Date of birth"
                    field_data_type: date
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /impact_frameworks:
    post:
      tags: [Library]
      summary: Create an Impact Framework with its entries
      operationId: createImpactFramework
      description: |
        Creates an Impact Framework (Template), your organisation's theory of change, with its
        entries in order. Each entry has a `stage` and exactly one item:

        - `activity_tracker_id` or `new_activity_tracker` (an Activity or Attendance tracker, a
          Change) in `Activity outputs` or `Participation outputs`;
        - `outcome_id` or `new_outcome` in `Short-term outcomes`, `Medium-term outcomes` or
          `Long-term outcomes`. An Outcome entry can also have `new_metrics`: new Metrics
          (Indicators) that measure it.

        At most 50 entries and new Metrics together. Near-identical names of new items get `409`
        with the matches, each with its `entry`, unless you send `force: true`. Nothing is created
        unless everything is, and an error names the entry. It stays private to your organisation
        unless you are Makerble staff and send `approved: true`.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id, name, entries]
              properties:
                organisation_id:
                  type: integer
                  description: The organisation (Charity) that will own it; you must be one of its editors
                name:
                  type: string
                description:
                  type: string
                color:
                  type: string
                causes:
                  type: array
                  items: {type: string}
                department:
                  type: string
                approved:
                  type: boolean
                  description: Makerble staff only
                force:
                  $ref: '#/components/schemas/ForceCreate'
                entries:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ImpactFrameworkDraftEntry'
            example:
              organisation_id: 913
              name: "Youth employment"
              entries:
                - stage: Activity outputs
                  new_activity_tracker:
                    name: "Workshops delivered"
                    category: Education
                - stage: Short-term outcomes
                  outcome_id: 3301
                  new_metrics:
                    - name: "Job search hours"
                      metric_type: value
                      default_question: "How many hours did you spend looking for work this week?"
                - stage: Long-term outcomes
                  new_outcome:
                    title: "In sustained work"
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /referral_submissions:
    post:
      tags: [Signup Pages]
      summary: Sync a completed offline submission
      description: |
        The endpoint an offline device posts a completed Signup Page submission to,
        once it regains connectivity. Reuses the exact same model methods the live,
        online submission flow calls — there's no separate "offline" data path to
        keep in sync with the online one.

        **Authentication is a `ReferralLinkSubmissionCredential` bearer token** (the
        `submission_credential.token` from the Form Definition), **not** the standard
        `X-User-Email`/`X-User-Token` pair. Deactivating a Signup Page automatically
        revokes its credential — there's no separate revoke action.

        `primary` is used for a **structured** link (one primary person plus zero or
        more `related_people`); `roles` is used instead for a **personalised** link
        (one entry per person, no "primary" concept). Every `contact_form_answers` /
        survey `answers` object is keyed by the field's `id` from the Form Definition,
        never by name. See the Form Definition's Field object for the value shape
        each `field_type` expects (Sub Ratio ids for dropdown/scale fields, digits-only
        for `telephone`, base64-encoded payload for `media`/`file`, etc.).
      operationId: createReferralSubmission
      security: [{submissionBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralSubmissionRequest'
      responses:
        "201":
          description: New submission processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSubmissionResponse'
        "200":
          description: This `idempotency_key` had already been processed — returns the original result, not a new one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSubmissionResponse'
        "401":
          description: Token unknown, or the Signup Page has been deactivated since the token was issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "unauthorized"
        "422":
          description: |
            Either the contact form is a `CustomFieldCategory` ("advanced custom field")
            form — unsupported by this endpoint — or a model validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupportedContactForm:
                  value: { error: "unsupported-contact-form", detail: "..." }
                invalidSubmission:
                  value: { error: "invalid-submission", detail: ["..."] }

  /suggested_merges:
    get:
      tags: [Suggested Merges]
      summary: List Suggested Merges
      description: |
        The Suggested Merges page (Contacts > Merge Contacts > Suggested Merges): sets of Contacts
        that look like the same person. Only suggestions where the user can see every Contact are
        returned: all the Organisation's Contacts for an Organisation Admin, the Contacts in their
        Projects for a Project Admin. Requires permission to merge Contacts in the Organisation.
        Sorted High match strength first, then newest.
      operationId: listSuggestedMerges
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, merged, rejected, stale]
            default: pending
          description: "pending: waiting for review; rejected: marked Not duplicates; stale: a Contact was deleted"
        - name: source
          in: query
          schema:
            type: string
            enum: [merge_rule, name_scan]
          description: "merge_rule: from a Merge Rule in Suggest mode; name_scan: from similar names"
        - name: beneficiary_id
          in: query
          schema:
            type: integer
          description: Only suggestions that include this Contact
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Suggested Merges
          content:
            application/json:
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data:
                  - id: 42
                    status: pending
                    source: merge_rule
                    merge_rule: { id: 7, name: Same email }
                    match_strength: high
                    matched_fields: [{ field_id: 31, field_name: email_address, value: grace@example.com, match_type: exact }]
                    contacts:
                      - { id: 101, name: Grace Mensah, created_at: "2026-09-02T10:15:00Z", created_by: { id: 5, name: Asha Patel } }
                      - { id: 188, name: Grace Mensah, created_at: "2026-10-21T08:02:00Z", created_by: null }
                    created_at: "2026-10-21T09:00:00Z"
                    updated_at: "2026-10-21T09:00:00Z"
                    reviewed_by: null
                    reviewed_at: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't merge Contacts in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /suggested_merges/{id}/merge:
    post:
      tags: [Suggested Merges]
      summary: Merge a Suggested Merge
      description: |
        Merges the suggestion's Contacts into one, as pressing Merge in Compare does. The Contact
        created first is kept unless `winner_id` names another of its Contacts. One merge request is
        made per other Contact; they are merged within a few minutes and can be undone with Unmerge
        on the Merge Contacts page.
      operationId: mergeSuggestedMerge
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                winner_id:
                  type: integer
                  description: The Contact to keep
            example: { winner_id: 101 }
      responses:
        "202":
          description: Merging has begun. Returns `suggested_merge` (now `merged`) and `merge_request_ids`.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: "`{error}`: the Contact to keep isn't one of the suggestion's, or it has already been reviewed"

  /suggested_merges/{id}/reject:
    post:
      tags: [Suggested Merges]
      summary: Mark a Suggested Merge as Not duplicates
      description: |
        Records that the Contacts are different people, as pressing Not duplicates does. The pair
        is not suggested together again, from any source.
      operationId: rejectSuggestedMerge
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Returns `suggested_merge`, now `rejected`, with `reviewed_by` and `reviewed_at`
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: "`{error}`: it has already been reviewed"

  /duplicate_contacts:
    get:
      tags: [Duplicate Contacts]
      summary: Scan for duplicate Contacts
      description: |
        The Duplicate Contacts page: sets of Contacts that look like the same person. Only Contacts
        the user could merge are scanned (all the Organisation's Contacts for an Organisation Admin,
        the Contacts in their Projects for a Project Admin), and sets someone marked as Not
        duplicates are left out. Requires permission to merge Contacts in the Organisation.

        `match: similar` (the default) ignores titles (Mr, Mrs, Dr), capital letters, punctuation,
        word order and small spelling differences. It runs in the background because a large
        Organisation takes several seconds: while it runs the call answers 202 with
        `status: running`; call again after `retry_after` seconds to get the sets. A finished scan
        is reused for 10 minutes. `match: exact` finds only names spelt exactly the same and
        answers straight away.

        `match_strength` is `high` when the names are the same once normalised or the Contacts
        share a date of birth, email or mobile, and `medium` otherwise. `reasons` are
        `similar_name`, `same_name`, `same_date_of_birth`, `same_email` and `same_mobile`.
      operationId: listDuplicateContacts
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - name: match
          in: query
          schema:
            type: string
            enum: [similar, exact]
            default: similar
          description: "similar: names that look alike; exact: names spelt exactly the same"
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: Paginated list of sets of duplicate Contacts, High first
          content:
            application/json:
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                match: similar
                status: completed
                scanned_at: "2026-10-28T09:00:00Z"
                data:
                  - contacts:
                      - { id: 101, name: Jane Doe, created_at: "2026-09-02T10:15:00Z", created_by: { id: 5, name: Asha Patel } }
                      - { id: 188, name: Mrs Jane Doe, created_at: "2026-10-21T08:02:00Z", created_by: null }
                    match_strength: high
                    reasons: [similar_name, same_date_of_birth]
        "202":
          description: A similar-name scan is running; call again after `retry_after` seconds
          content:
            application/json:
              example: { match: similar, status: running, retry_after: 5 }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't merge Contacts in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /duplicate_contacts/not_duplicates:
    post:
      tags: [Duplicate Contacts]
      summary: Mark Contacts as Not duplicates
      description: |
        Records that a set of Contacts are different people, as pressing Not duplicates on the
        Duplicate Contacts page does. They are never suggested together again: not by the scan,
        the background check of new Contacts or a Merge Rule.
      operationId: markNotDuplicates
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids]
              properties:
                contact_ids:
                  type: array
                  items: { type: integer }
                  description: At least two Contacts
                match_strength:
                  type: string
                  enum: [high, medium]
            example: { contact_ids: [101, 188], match_strength: high }
      responses:
        "200":
          description: "`{contact_ids, message}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't merge Contacts in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: "`{error}`: fewer than two Contacts, or a Contact the user can't merge"

  /duplicate_contacts/merge:
    post:
      tags: [Duplicate Contacts]
      summary: Merge a set of duplicate Contacts
      description: |
        Merges the Contacts into one, as Merge Selected Contacts on the Duplicate Contacts page
        does. The Contact created first is kept unless `winner_id` names another of them. One merge
        request is made per other Contact; they are merged within a few minutes and can be undone
        with Unmerge on the Merge Contacts page.
      operationId: mergeDuplicateContacts
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids]
              properties:
                contact_ids:
                  type: array
                  items: { type: integer }
                  description: At least two Contacts
                winner_id:
                  type: integer
                  description: The Contact to keep
            example: { contact_ids: [101, 188], winner_id: 101 }
      responses:
        "202":
          description: "Merging has begun: `{winner_id, merge_request_ids, message}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't merge Contacts in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: "`{error}`: fewer than two Contacts, a Contact the user can't merge, or a Contact to keep that isn't one of them"

  /duplicate_contacts/settings:
    get:
      tags: [Duplicate Contacts]
      summary: Read "Suggest possible duplicates when contacts are created"
      description: |
        The setting on the Merge Contacts page. When it is on (the default), every Contact created
        is compared with the Organisation's other Contacts each hour, and similar names appear in
        Suggested Merges for someone to review. Requires permission to merge Contacts in the
        Organisation.
      operationId: getDuplicateContactSettings
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
      responses:
        "200":
          description: The setting
          content:
            application/json:
              example: { charity_id: 12, suggest_on_create: true }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't merge Contacts in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Duplicate Contacts]
      summary: Change "Suggest possible duplicates when contacts are created"
      description: Turns the setting on or off. Requires an Organisation Admin (editor).
      operationId: updateDuplicateContactSettings
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id, suggest_on_create]
              properties:
                charity_id: { type: integer }
                suggest_on_create: { type: boolean }
            example: { charity_id: 12, suggest_on_create: false }
      responses:
        "200":
          description: The setting, changed
          content:
            application/json:
              example: { charity_id: 12, suggest_on_create: false }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user isn't an Organisation Admin
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /merge_rules:
    get:
      tags: [Merge Rules]
      summary: List an Organisation's Merge Rules
      description: |
        The Manage Merge Rules page. Requires an Admin or Creator (editor or reporter) of the
        Organisation.
      operationId: listMergeRules
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Merge Rules
          content:
            application/json:
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data:
                  - id: 7
                    name: Same email
                    conditions: [{ id: 31, field_name: email_address }]
                    match_type: and
                    merge_mode: suggest
                    status: Active
                    created_by: { id: 5, name: Asha Patel }
                    last_edited_by: { id: 5, name: Asha Patel }
                    last_edited_at: "2026-10-20T14:00:00Z"
                    created_at: "2026-10-20T14:00:00Z"
                    updated_at: "2026-10-20T14:00:00Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user isn't an Admin or Creator of the Organisation
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Merge Rules]
      summary: Create a Merge Rule
      description: |
        Create a Merge Rule. `conditions` are Contact field (Current Field) ids from the
        Organisation's Contact forms that must be identical. `match_type` `and` needs every
        condition to match, `or` any one. `merge_mode` is required ("When contacts match this
        rule"): `automatic` merges matching Contacts within 2 hours, keeping the one created first;
        `suggest` puts matches in Suggested Merges for someone to review. New rules are Active.
      operationId: createMergeRule
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id, name, conditions, merge_mode]
              properties:
                charity_id: { type: integer }
                name: { type: string }
                conditions: { type: array, items: { type: integer } }
                match_type: { type: string, enum: [and, or], default: and }
                merge_mode: { type: string, enum: [automatic, suggest] }
                status: { type: string, enum: [Active, Inactive] }
            example: { charity_id: 12, name: Same email or mobile, conditions: [31, 32], match_type: or, merge_mode: suggest }
      responses:
        "201":
          description: The new Merge Rule
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user isn't an Admin or Creator of the Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /merge_rules/{id}:
    get:
      tags: [Merge Rules]
      summary: Get a Merge Rule
      operationId: getMergeRule
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The Merge Rule
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Merge Rules]
      summary: Update a Merge Rule
      description: |
        Change any of `name`, `conditions`, `match_type`, `merge_mode` and `status`; anything not
        sent is kept, including the match type when only the conditions change. Set `merge_mode` to
        `suggest` to stop a rule merging automatically, or `status` to `Inactive` to turn it off.
      operationId: updateMergeRule
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                conditions: { type: array, items: { type: integer } }
                match_type: { type: string, enum: [and, or] }
                merge_mode: { type: string, enum: [automatic, suggest] }
                status: { type: string, enum: [Active, Inactive] }
            example: { merge_mode: suggest }
      responses:
        "200":
          description: The updated Merge Rule
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /checklists:
    get:
      tags: [Checklists]
      summary: List an Organisation's Checklists
      description: |
        The Checklists of an Organisation (Charity). Visible to the Organisation's editors and
        reporters, and to managers (editors) of its Projects.
      operationId: listChecklists
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Checklists, each with id, charity_id, name, description, created_by_id and actions_count
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user has no role in the Organisation that lets them see Checklists
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Checklists]
      summary: Create a Checklist
      description: |
        Creates a Checklist (Create > Checklist). Each action has an `action_type` and, unless the
        type has no criteria keys, `criteria` saying what counts as done; see
        `GET /checklists/action_types`. Actions keep the order sent. Requires an editor or reporter
        of the Organisation.

        "What counts as done": send specific values under the type's criteria keys, or
        `criteria: {any: true}` ("Any relationship", "Any survey" and so on) for any record of the
        kind; `any` replaces specific values sent with it. An action with neither is saved as "Not set
        yet" and can't be done for any Contact until its criteria are set.

        Each action may say who is responsible for it ("Who is responsible?"): `owner_kind` is `none`
        (nobody in particular, the default), `adder` (the colleague who added the Checklist to the
        Contact, or the Project's Project Managers when a Project added it automatically), `user`
        (`owner_user_id`, a colleague), `team` (`owner_team_id`, anyone in one of the Organisation's
        Teams who can see the Contact) or `relationship` (`owner_relationship_side`
        "<relationship_category_id>:parent|child", any colleague with that kind of Relationship with
        the Contact, e.g. their Therapist). See `GET /checklists/owner_options`.

        "Only count records in this project": set `only_this_project: true` on an action whose type has
        `project_scopable: true` in `GET /checklists/action_types` (surveys, events, labelled stories,
        cases, project states). Then only records made in the Project through which the Checklist was
        added to the Contact count towards it. It is ignored for other types.

        "Due within N days of the checklist being added": set `due_within_days` (a whole number from 0
        to 3650) to give an action a deadline. Each Contact's due date is the day the Checklist was
        added to them plus that many days, so changing it moves the due date for everyone. Leave it
        out, or send `null`, for no deadline. `GET /beneficiaries/{beneficiary_id}/checklists` then
        says which actions are done late or overdue.

        "Allow colleagues to tick this off by hand with a note": set `allow_manual_completion: true`
        on an action that can happen offline (a phone call, a home visit, a paper form). Colleagues
        who can edit a Contact can then mark it done by hand with
        `POST /beneficiaries/{beneficiary_id}/checklists/{checklist_id}/actions/{action_id}/completion`.
        It is false unless sent; on an update, an action that doesn't mention it keeps its setting.

        "If earlier steps aren't done": set `if_earlier_steps_not_done` to say what a colleague sees
        when they start an action for a Contact before the actions above it are done. `remind` (the
        default, "Show a reminder, let them continue") shows a reminder they can dismiss; `ask_reason`
        ("Warn and ask for a reason to skip") makes them give a reason, which is logged. On an update,
        an action that doesn't mention it keeps its setting.

        Participant Journey stages: send `stages`, in order, each with a `key` of your choosing, a
        `name` and an `icon` (see `GET /checklists/stage_icons`; `clipboard` if left out), and give
        each action the `stage_key` of its stage. The Journey view on the Checklist's profile page
        shows each stage as a column with its actions, left to right. Each stage's actions are kept
        together, in stage order. Stages are optional; an action without a stage shows as its own
        column.

        An action may leave out `action_type`: it is saved as "Not set yet", e.g. while mapping a
        participant journey before deciding how each step is recorded, and can't be done until a type
        is chosen. An action with neither a type nor a title is skipped.
      operationId: createChecklist
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            example:
              charity_id: 913
              checklist:
                name: "Induction"
                description: "Steps for every new contact"
                stages:
                  - key: "signup"
                    name: "Sign up"
                    icon: "clipboard"
                  - key: "support"
                    name: "Arrange support"
                    icon: "calendar"
                actions:
                  - title: "How participants sign up"
                    stage_key: "signup"
                  - action_type: "add_role"
                    title: "Give them a Role"
                    stage_key: "support"
                    criteria:
                      beneficiary_role_ids: ["12", "14"]
                  - action_type: "add_relationship"
                    title: "Record a caregiver"
                    criteria:
                      any: true
                  - action_type: "invite_to_event"
                    title: "Invite them to an induction event"
                    only_this_project: true
                    due_within_days: 14
                    criteria:
                      project_event_categories: ["301:7"]
                  - action_type: "create_task"
                    title: "Set a follow-up task"
                    owner_kind: "team"
                    owner_team_id: 18
                    allow_manual_completion: true
                    if_earlier_steps_not_done: "ask_reason"
      responses:
        "201":
          description: The Checklist, with its actions, projects and contacts_count
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Checklists for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /checklists/action_types:
    get:
      tags: [Checklists]
      summary: List the actions a Checklist can contain
      description: |
        Every action type with its name, the `criteria_keys` it stores, and `any_name`, the "Any"
        choice for it, e.g. "Any relationship" (`criteria: {any: true}`). Criteria values are strings:
        IDs, or pairs such as `project_states` "<project_id>:<beneficiary_state_id>",
        `project_event_categories` "<project_id>:<event_category_id>", `relationship_sides`
        "<relationship_category_id>:parent|child", and `survey_waves` "<Survey Campaign id>:<Wave id, or 0
        for a campaign without Waves>". The "for a relative" types take `relatives: [{relationship_side,
        beneficiary_category_ids | survey_waves}]`.
      operationId: listChecklistActionTypes
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: "`{data: [{action_type, name, criteria_keys, any_name, project_scopable}]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'

  /checklists/stage_icons:
    get:
      tags: [Checklists]
      summary: List the icons a Checklist stage can have
      description: |
        The icons a Participant Journey stage can have, in the order the icon picker shows them:
        clipboard (sign-up clipboard), calendar, people, chart, flag, message, home, heart, school and book.
      operationId: listChecklistStageIcons
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: "`{data: [{icon, name}]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'

  /checklists/owner_options:
    get:
      tags: [Checklists]
      summary: List the choices for who is responsible for a Checklist action
      description: |
        The "Who is responsible?" dropdown on the Create / Edit Checklist page: the kinds of owner, the
        Organisation's Teams and its relationship sides ("Therapist from Therapist & Client"). Colleagues
        for `owner_kind: user` come from `GET /users`. Visible to anyone who can see the Organisation's
        Checklists.
      operationId: listChecklistOwnerOptions
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
      responses:
        "200":
          description: "`{kinds: [{owner_kind, name}], teams: [{id, name}], relationship_sides: [{owner_relationship_side, name}]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user has no role in the Organisation that lets them see Checklists
        "404":
          $ref: '#/components/responses/NotFound'

  /checklists/sketch:
    get:
      tags: [Checklists]
      summary: Draft a Checklist from a Project's setup
      description: |
        "Sketched from your setup" on the Checklists page: a participant journey drafted from what one of
        the Organisation's Projects already has. Nothing is saved. Without `project_id`, the draft comes
        from the running Project with the most Contacts that has at least two of: an active Signup Page, a
        Contact Form (other than the Organisation's default), a Waiting List or Alumni status, and a
        Survey. With `project_id`, it comes from that Project.

        The draft uses the five Participant Journey stages, leaving out any with nothing found: Sign up
        (one "Complete a form" step per Signup Page), Arrange support (the Contact Forms, then Waiting
        List → Enrolled), Provide support (each Survey's first Wave, and "Invite to an event" for the
        Project's Event Formats), Monitor progress (later Waves) and Achieve the goal (Move to Alumni).
        Every step already says what counts as done.

        `checklist` is in the shape `POST /checklists` takes, so it can be created as it is or after
        changes. Every field is null when no Project has enough to draft from. Needs someone who can
        create Checklists for the Organisation.
      operationId: sketchChecklist
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: The Organisation (Charity) ID
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
          description: Draft from this Project instead of the one Makerble would choose
      responses:
        "200":
          description: The draft
          content:
            application/json:
              example:
                project_id: 7
                project_name: "Youth Programme 2026"
                name: "Youth Programme 2026 journey"
                summary: "Youth Programme 2026 has the Referral Signup Page, the Intake form, a Waiting List → Enrolled → Alumni flow and the Wellbeing survey."
                checklist:
                  name: "Youth Programme 2026 journey"
                  stages:
                    - {key: "stage0", name: "Sign up", icon: "clipboard", position: 0}
                    - {key: "stage1", name: "Arrange support", icon: "calendar", position: 1}
                  actions:
                    - title: "Referral"
                      action_type: "complete_form"
                      criteria: {beneficiary_category_ids: ["31"]}
                      stage_key: "stage0"
                      position: 0
                    - title: "Waiting List → Enrolled"
                      action_type: "add_to_project"
                      criteria: {project_states: ["7:2"]}
                      stage_key: "stage1"
                      position: 1
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Checklists for the Organisation
        "404":
          $ref: '#/components/responses/NotFound'

  /checklists/{id}:
    get:
      tags: [Checklists]
      summary: Get a Checklist
      description: |
        A Checklist with its ordered actions, the Projects that offer it and how many Contacts have it.
        Each action includes who is responsible for it: `owner_kind`, `owner_user_id`, `owner_team_id`,
        `owner_relationship_side` and a readable `owner_description`, and its settings
        `due_within_days`, `only_this_project`, `allow_manual_completion` and
        `if_earlier_steps_not_done` (`remind` or `ask_reason`), and its `stage_id`. `stages` lists the
        Participant Journey stages in order, each with `id`, `name`, `icon`, `position` and `colour`.
        An action whose type isn't chosen yet has a null `action_type` and `action_name` "Not set yet".
      operationId: getChecklist
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The Checklist, with actions, projects ({project_id, project_name, assignment_mode}) and contacts_count
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Not found, or another Organisation's

    patch:
      tags: [Checklists]
      summary: Update a Checklist
      description: |
        Updates the name, description or actions. An action sent with its `id` is changed;
        `{id, _destroy: true}` removes it; an action without an `id` is added. Requires an editor or
        reporter of the Organisation. Send `due_within_days: null` to remove an action's deadline.

        Stages work the same way: a stage sent with its `id` is renamed, given a new `icon` or moved
        (`position`); `{id, _destroy: true}` removes it; a stage without an `id` is added, with a `key`.
        An action joins a stage with `stage_key`: a new stage's `key`, or an existing stage's `id` as a
        string. An empty `stage_key` takes the action out of its stage, and an action that doesn't send
        `stage_key` stays where it is. A stage left without actions is removed.
      operationId: updateChecklist
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              checklist:
                name: "Induction (2027)"
                actions:
                  - id: 55
                    action_type: "add_role"
                    title: "Give them any Role"
                    criteria:
                      beneficiary_role_ids: ["12"]
                  - id: 56
                    _destroy: true
                  - id: 57
                    owner_kind: "adder"
                    due_within_days: 7
                    stage_key: "88"
                stages:
                  - id: 88
                    name: "Arrange support"
                    icon: "people"
      responses:
        "200":
          description: The updated Checklist
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit this Checklist
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /checklists/{id}/skips:
    get:
      tags: [Checklists]
      summary: List a Checklist's skipped steps
      description: |
        The times colleagues did one of the Checklist's actions for a Contact before the earlier steps
        were done, newest first: the exceptions shown on the Checklist's Board. Each skip has
        `beneficiary_id`, `checklist_action_id`, `action_title`, `skipped_actions` ({id, title,
        required_first}), `reason`, `user_id`, `user_name`, `story_id` (its story on the Contact's
        timeline) and `created_at`. Only Contacts the user can see are included.
      operationId: listChecklistSkips
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: "`{page, page_size, page_count, total_count, data: [skip]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /checklists/{id}/projects/{project_id}:
    patch:
      tags: [Checklists]
      summary: Set how a Project offers a Checklist
      description: |
        The Add to Projects popup. `manual`: colleagues may add the Checklist to the Project's Contacts
        by hand. `automatic`: every Contact now in the Project gets it (in the background), and so does
        every Contact who later joins or is created in it. `none`: stop offering it; Contacts who
        already have it keep it. Requires an Organisation editor, or a Project Manager of the Project.
      operationId: setChecklistProject
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              mode: "automatic"
      responses:
        "200":
          description: "`{project_id, assignment_mode}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't add Checklists to Projects in this Organisation
        "404":
          description: The Checklist or Project wasn't found, or the user can't edit the Project

  /checklists/{id}/progress:
    get:
      tags: [Checklists]
      summary: Get a Checklist's progress
      description: |
        Where the Contacts on a Checklist have got to: the Progress section of the Checklist's profile
        page. For each action, in order: `completed` (Contacts who have done it), `furthest` (Contacts
        for whom it is the furthest action done) and `waiting` (Contacts for whom it is the first action
        not done, so a Contact who did steps 1 and 3 is waiting on step 2). Each list gives its full
        count (`completed_count`, `furthest_count`, `waiting_count`) and the first `list_limit` (30)
        Contacts alphabetically as `{beneficiary_id, name}`. Each Contact in `waiting` also has the Board's
        details: `days_waiting` (since the Checklist was added or the previous action was done),
        `overdue` (the action is past its due date), `skipped_a_step` (a colleague logged starting a later
        action first) and `responsible` (who is responsible for the action). `contacts_count` is every
        Contact counted, `complete_count` those with every action done (the first of them in `complete`)
        and `overdue_count` those whose waiting action is overdue. Only Contacts the user can see are counted.
      operationId: getChecklistProgress
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: project_id
          in: query
          required: false
          description: Count only the Contacts in this Project, which must be one the Checklist is added to
          schema:
            type: integer
        - name: responsible
          in: query
          required: false
          description: "Count only the Contacts whose waiting action this person or Team is responsible for: `me` (directly or through one of the user's Teams), `user:<id>` or `team:<id>`"
          schema:
            type: string
      responses:
        "200":
          description: The counts and lists for each action
          content:
            application/json:
              example:
                checklist_id: 42
                project_id: null
                responsible: null
                contacts_count: 3
                complete_count: 1
                overdue_count: 1
                list_limit: 30
                complete: [{beneficiary_id: 904, name: "Refilwe Mahlangu"}]
                actions:
                  - id: 55
                    number: 1
                    action_type: "complete_form"
                    title: "Complete the Intake form"
                    completed_count: 2
                    completed: [{beneficiary_id: 901, name: "Ayanda Dlamini"}, {beneficiary_id: 902, name: "Kagiso Mokoena"}]
                    furthest_count: 0
                    furthest: []
                    waiting_count: 1
                    waiting: [{beneficiary_id: 903, name: "Mpho Sithole", days_waiting: 9, overdue: true, skipped_a_step: false, responsible: "Anyone in Youth Workers"}]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /checklists/{id}/journey:
    get:
      tags: [Checklists]
      summary: Get a Checklist's Participant Journey
      description: |
        The Journey view on the Checklist's profile page: its steps left to right, grouped into stages.
        `columns` are in order: each stage with its `stage_id`, `name`, `icon` and `colour`, then its
        `steps`. A Checklist without stages has one column per step, named "Step 1", "Step 2" and so on,
        with a null `stage_id` and `icon`; so does a step left outside the stages. Each step has
        `action_id`, `number` (its place in the Checklist), `title`, `action_type`, `action_name` ("Not
        set yet" while no type is chosen), `done_count` (Contacts who have done it) and `waiting_count`
        (Contacts for whom it is the first step not done), out of `contacts_count`. Only Contacts the user
        can see are counted.
      operationId: getChecklistJourney
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The columns of the Journey view
          content:
            application/json:
              example:
                checklist_id: 42
                contacts_count: 10
                columns:
                  - stage_id: 88
                    name: "Sign up"
                    icon: "clipboard"
                    colour: "#AC3898"
                    steps:
                      - action_id: 55
                        number: 1
                        title: "How participants sign up"
                        action_type: "complete_form"
                        action_name: "Complete a form"
                        done_count: 10
                        waiting_count: 0
                  - stage_id: 89
                    name: "Arrange support"
                    icon: "calendar"
                    colour: "#2F7DC0"
                    steps:
                      - action_id: 56
                        number: 2
                        title: "Initial assessment"
                        action_type: null
                        action_name: "Not set yet"
                        done_count: 8
                        waiting_count: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiaries/{beneficiary_id}/checklists:
    get:
      tags: [Checklists]
      summary: Get a Contact's Checklists
      description: |
        The Checklists box on a Contact's profile: each Checklist with `done_count` of `actions_count`,
        and every action with `done: true|false`. Only Contacts the user can see are returned.

        A done action has a `completion` (null while it isn't done) saying when, by whom and with what
        record it was done: `completed_at` (when that record was made, e.g. the survey's date),
        `completed_by_user_id` and `completed_by_name` (null when the record doesn't say who made it),
        `completion_method` (`detected`, or `manual` when a colleague ticked it), `proof_type` and
        `proof_id` (the record, e.g. `Story` 123, `BeneficiariesBeneficiaryRole`, `EventBeneficiary`)
        and `proof_deleted` (true once that record has been deleted). An action stays done even if
        its record is later edited or deleted. Actions are marked done in the background a few seconds
        after the record that completes them is saved.

        Each action also says who is responsible for it for this Contact: the owner fields
        (`owner_kind`, `owner_user_id`, `owner_team_id`, `owner_relationship_side`), `owner_overridden`
        (true when a colleague changed it for this Contact only), `owner_description` (e.g.
        "Safeguarding Team"), `responsible_user_ids` (only colleagues who can see the Contact) and
        `owner_warning` when nobody responsible can see them (e.g. "No one in Safeguarding Team can see
        this contact").

        An action whose Checklist gives it a deadline (`due_within_days`) has `due_on`: the day the
        Checklist was added to the Contact plus that many days (null when there is no deadline).
        `done_late` is true when it was done after `due_on`; `overdue` is true when it isn't done and
        `due_on` has passed. Both are false for an action with no deadline.

        `allow_manual_completion` says whether colleagues may tick the action off by hand
        (`POST .../actions/{action_id}/completion`).
      operationId: listContactChecklists
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: Paginated list of the Contact's Checklists with their progress
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Checklists]
      summary: Add a Checklist to a Contact
      description: |
        Add a Checklist on the Contact's profile. Only a Checklist that one of the Contact's Projects
        lets the user add by hand is allowed; see `GET /beneficiaries/{beneficiary_id}/checklists/available`.
        It is added through a Project, the one whose records count for actions set to "Only count
        records in this project": the only Project that allows it, or `project_id` when more than one
        does (required then).
      operationId: addContactChecklist
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              checklist_id: 42
              project_id: 301
      responses:
        "201":
          description: "`{checklist_id, beneficiary_id, added_by_user_id, project_id, created_at}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries/{beneficiary_id}/checklists/{checklist_id}/actions/{action_id}/owner:
    patch:
      tags: [Checklists]
      summary: Change who is responsible for an action for one Contact
      description: |
        The Change link under an action in a Contact's Checklists box. Sets who is responsible for this
        action for this Contact only; other Contacts keep the Checklist's default. Choosing the
        Checklist's own default removes the change. Takes the same owner fields as an action of
        `POST /checklists`. Requires edit access to the Contact.
      operationId: setContactChecklistActionOwner
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
        - name: checklist_id
          in: path
          required: true
          schema:
            type: integer
        - name: action_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              owner_kind: "user"
              owner_user_id: 5021
      responses:
        "200":
          description: "`{checklist_id, action_id, owner_kind, owner_user_id, owner_team_id, owner_relationship_side, owner_overridden, owner_description, responsible_user_ids, owner_warning}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can see the Contact but can't edit it
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Checklists]
      summary: Go back to the Checklist's own owner for one Contact
      description: Removes a change made with the PATCH above, so this Contact follows the Checklist's default again. Requires edit access to the Contact.
      operationId: resetContactChecklistActionOwner
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
        - name: checklist_id
          in: path
          required: true
          schema:
            type: integer
        - name: action_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The action's owner fields, as for the PATCH
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can see the Contact but can't edit it
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiaries/{beneficiary_id}/checklists/{checklist_id}/actions/{action_id}/completion:
    post:
      tags: [Checklists]
      summary: Mark a Contact's Checklist action as done by hand
      description: |
        The "Mark as done…" link under an action in a Contact's Checklists box, for steps that leave
        no record Makerble can detect, such as a phone call, a home visit or a paper consent form.
        Only an action whose Checklist allows it (`allow_manual_completion: true`) can be ticked off
        this way, and only while it isn't done. Requires edit access to the Contact.

        `completed_on` is the date it happened (`YYYY-MM-DD`, today or earlier) and `note` says what
        happened. The note, and the `evidence` file when one is sent as multipart form data, are
        saved as a Story on the Contact's timeline, which becomes the action's proof. The Story goes
        in the Project the Checklist was added through, otherwise the Contact's only Project the user
        can record stories in; when there is more than one, send `project_id`.

        The action's `completion` then has `completion_method: manual`, `completed_by_user_id` the
        user, `completed_at` the date given, and `proof_type: Story` with the new Story's `proof_id`.
      operationId: markContactChecklistActionDone
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
        - name: checklist_id
          in: path
          required: true
          schema:
            type: integer
        - name: action_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              completed_on: "2026-10-20"
              note: "Paper consent signed at the home visit, scanned to file"
              project_id: 301
          multipart/form-data:
            schema:
              type: object
              required: [completed_on, note]
              properties:
                completed_on:
                  type: string
                  format: date
                note:
                  type: string
                project_id:
                  type: integer
                evidence:
                  type: string
                  format: binary
      responses:
        "201":
          description: "`{checklist_id, action_id, done: true, completion: {completed_at, completed_by_user_id, completed_by_name, completion_method, proof_type, proof_id, proof_deleted}}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can see the Contact but can't edit it
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Checklists]
      summary: Undo marking a Contact's Checklist action as done by hand
      description: |
        Takes back a tick made by hand. Only the colleague who made it, or an Organisation Admin, can
        undo it, and only a manual completion can be undone. The Story stays on the Contact's
        timeline. Makerble then looks again for a record that proves the action done, so the
        response can still say `done: true` with a `detected` completion. Requires edit access to the
        Contact.
      operationId: undoContactChecklistActionDone
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
        - name: checklist_id
          in: path
          required: true
          schema:
            type: integer
        - name: action_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "`{checklist_id, action_id, done, completion}` (completion null when not done)"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can see the Contact but can't edit it
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries/{beneficiary_id}/checklists/next_step:
    get:
      tags: [Checklists]
      summary: Get a Contact's next step
      description: |
        What to do next for a Contact, as on the Next step card of their profile: the first action
        not yet done on each of their Checklists, the most pressing first (overdue, then the earliest
        `due_on`, then by Checklist name), so `data[0]` is the next step. Each step has the Checklist
        (`checklist_id`, `checklist_name`), its place in it (`number` of `total`), the action
        (`action_id`, `action_type`, `action_name`, `title`, `description`), its deadline (`due_on`,
        `overdue`), `if_earlier_steps_not_done` and who is responsible for it (the same owner fields as
        `GET /beneficiaries/{beneficiary_id}/checklists`). `others_count` is how many other Checklists
        are waiting; `all_done` is true when every action on the Contact's Checklists is done. Not
        paginated: a Contact has few Checklists.
      operationId: getContactNextStep
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "`{all_done, others_count, data: [{checklist_id, checklist_name, number, total, action_id, action_type, action_name, title, description, due_on, overdue, if_earlier_steps_not_done, owner_kind, owner_description, responsible_user_ids, ...}]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiaries/{beneficiary_id}/checklists/{checklist_id}/actions/{action_id}/gate:
    get:
      tags: [Checklists]
      summary: Check the earlier steps before a Checklist action
      description: |
        The "soft gate" a colleague sees on the Contact's profile when they start an action before the
        earlier steps on the same Checklist are done. `gated` is true when some aren't; `missing` lists
        them ({action_id, number, action_type, title, required_first}); `reason_required` is true when
        one is set to "Warn and ask for a reason to skip" (Required first). Nothing is blocked: to go
        ahead, record the skip with `POST .../skips`.
      operationId: getContactChecklistGate
      security: [{tokenAuth: []}]
      parameters:
        - {name: beneficiary_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
        - {name: action_id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: "`{gated, reason_required, missing: [{action_id, number, action_type, title, required_first}]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiaries/{beneficiary_id}/checklists/{checklist_id}/actions/{action_id}/skips:
    post:
      tags: [Checklists]
      summary: Skip the earlier steps of a Checklist action
      description: |
        Records that the action is being done for the Contact before its earlier steps ("Continue
        anyway" on the profile): who, when, which steps and why. The skip is also put on the Contact's
        timeline as a story. `reason` is required when a missing step is Required first. Needs edit
        access to the Contact.
      operationId: skipContactChecklistSteps
      security: [{tokenAuth: []}]
      parameters:
        - {name: beneficiary_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
        - {name: action_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            example:
              reason: "The induction is this week; consent is in the post"
      responses:
        "201":
          description: The skip ({id, beneficiary_id, checklist_id, checklist_action_id, action_title, skipped_actions, reason, user_id, user_name, story_id, created_at})
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit this Contact
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries/{beneficiary_id}/checklists/available:
    get:
      tags: [Checklists]
      summary: List the Checklists that can be added to a Contact
      description: |
        The Checklists the user may add to this Contact by hand, other than those it already has, each
        with the Projects it can be added through (`projects: [{id, name}]`). When there is more than
        one, pass the chosen one as `project_id` to `POST /beneficiaries/{beneficiary_id}/checklists`.
      operationId: listAvailableContactChecklists
      security: [{tokenAuth: []}]
      parameters:
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "`{data: [{id, name, projects: [{id, name}]}]}`"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /cohort_trackers:
    get:
      tags: [Cohort Trackers]
      summary: List an Organisation's Cohort Trackers
      description: |
        The Cohort Trackers of an Organisation (Charity). Visible to the Organisation's
        editors and reporters, and to managers (editors) of its Projects.
      operationId: listCohortTrackers
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
