    get:
      tags: [Automations]
      summary: List Contact Automations
      description: |
        The Contact Automations the user can see: those of Organisations where they are an editor or
        observer, those on Projects they manage, and those they made. `active` false means paused.
      operationId: listContactAutomations
      security: [{tokenAuth: []}]
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
          description: Only the Contact Automations on this Project
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Contact Automations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactAutomations'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Automations]
      summary: Create a Contact Automation
      description: |
        Creates a Contact Automation on a Project, the same as one made on the Contact Automations
        page: when the Project's Contacts meet the `criteria`, the `actions` run, once per Contact until
        that alert is resolved.

        `criteria` names one field: `field` (an `other_fields` key from the options, e.g.
        `minutes_since_contact_enrolled`), `current_field_id` (a Contact or Survey field),
        `relationship_category_id` or `event_state_id`. Then a `condition` from that field's
        conditions and a `value` (minutes, for the "Amount of time" fields), `state_ids` (Ratio Set
        states) or `text`. For `field: survey_verdict_is`, give `survey_id` and `verdict_ids`.

        `actions` can be any of `send_survey`, `in_app_alert`, `change_status` (statuses on this
        Project, or `removed`) and `flags`. Every id must be one that
        `GET /contact_automations/options` offers; any other is refused with 422, naming it.

        `active` defaults to true; send false to save the automation paused, then check who it would
        act on with `GET /contact_automations/{id}/matching_contacts` before resuming it. Requires an
        editor of the Organisation or of the Project.
      operationId: createContactAutomation
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactAutomationRequest'
            examples:
              surveyOnEnrolment:
                summary: Send a Survey an hour after a Contact is enrolled, saved paused
                value:
                  project_id: 821
                  active: false
                  criteria:
                    field: minutes_since_contact_enrolled
                    condition: greater_than_or_equal_to
                    value: 60
                  actions:
                    send_survey:
                      survey_id: 5194
                      via_email: true
                      email_message: "Please tell us how you are getting on."
      responses:
        "201":
          description: Contact Automation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAutomation'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

