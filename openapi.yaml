  /indicators/create_v2:
    post:
      tags: [Indicators]
      summary: Create a Metric
      operationId: createIndicator
      description: |
        Creates a Metric (an Indicator) for one of your organisations, or for yourself, and links it
        to the Outcomes it measures. This is the request the Metric form in the Makerble app sends,
        so its body uses the form's field names.

        To create a Metric by type name (`scale`, `binary` or `value`) as part of a Survey or an
        Impact Framework, use **Create a Survey** (`new_metric`) or **Create an Impact Framework**
        (`new_metrics`) instead. They also create a new List for a scale Metric in the same call.

        Search the library first (**Search the library**) and reuse a Metric that fits. If your
        organisation or the public library already has a Metric with the same or a near-identical
        name (ignoring case, spacing and punctuation), nothing is created and you get `409` with the
        matches. Send `force: true` to create it anyway.

        The Metric is visible only to your organisation's editors and leaders. It is recorded as made
        through the API, or through the MCP server when the request comes from it.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [indicator]
              properties:
                indicator:
                  type: object
                  required: [name, indicator_type_id]
                  properties:
                    name:
                      type: string
                    indicator_type_id:
                      type: integer
                      description: |
                        The ID of the Metric type: scale (multiple choice from a List), binary (tickbox)
                        or value (a number). These IDs differ between environments.
                    unit_id:
                      type: integer
                      description: The Unit shown beside a value Metric's number, e.g. hours
                    owner_type:
                      type: string
                      enum: [Charity, User]
                      description: "Charity: owned by the organisation in owner_id. User: owned by you."
                    owner_id:
                      type: integer
                      description: The organisation (Charity) that will own it; it must be one of yours
                outcome_ids:
                  type: array
                  items:
                    type: integer
                  description: Outcomes it measures, owned by one of your organisations or by you
                department_ids:
                  type: array
                  items:
                    type: integer
                  description: Cause areas (Departments); defaults to the first one
                selected_ratio_set_id:
                  type: integer
                  description: For a scale Metric, the List (Ratio Set) of answer choices; one you can see
                current_field_id:
                  type: integer
                  description: A question on one of your organisations' Surveys that this Metric should answer
                force:
                  $ref: '#/components/schemas/ForceCreate'
            example:
              indicator:
                name: "Felt more confident"
                indicator_type_id: 2
                owner_type: Charity
                owner_id: 913
              outcome_ids: [5844]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  indicator:
                    type: string
                    description: The new Metric as a JSON-encoded string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: |
            An owner, Outcome, List or Survey question you may not use. `errors` says which, e.g.
            "These outcomes (outcome_ids) can't be used: 5844".
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "500":
          description: The Metric is invalid, e.g. a missing name; `errors` lists the problems and nothing is created
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

  /indicators/{id}:
    get:
      tags: [Indicators]
      summary: Get a single Indicator
      description: |
        Returns 404 for an Indicator the signed-in user cannot see, with the same body as
        for an ID that does not exist. A public-library Indicator owned by another
        organisation is returned only when `include_public_library=true`.
      operationId: getIndicator
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IncludePublicLibrary'
      responses:
        "200":
          description: Indicator record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Indicators, Library]
      summary: Change a Metric's name or question
      operationId: updateIndicator
      description: |
        Renames a Metric (an Indicator) or rewords its default question, the question people see
        when it is asked in a Survey. Nothing else about the Metric changes, and results already
        recorded stay against it, so only reword a Metric when its meaning stays the same.

        You must be able to edit the Metric: it belongs to one of your organisations. A Metric you
        can see but not edit, such as another organisation's public Metric, is `403`; one you can't
        see is `404`. Sending neither `name` nor `default_question` is `422`.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                default_question:
                  type: string
            example:
              default_question: "How confident do you feel about getting a job?"
      responses:
        "200":
          $ref: '#/components/responses/LibraryItemUpdated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

