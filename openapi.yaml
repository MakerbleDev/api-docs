      description: |
        What a formula gives on one of the Organisation's Projects, before it is saved: the result for
        the current Period (ending at the Project's next deadline, or today when it has none ahead), Year
        to Date and All-time, each tracker's own result, and warnings worth checking (a tracker used
        twice, a Numerical tracker added to a count, different units added together, dividing by a
        tracker that could be 0). A formula with errors is refused (422) with `errors` and `warnings`.
        Send `formula_tracker_id` when editing a tracker, so a formula that uses it is caught.
      operationId: previewFormulaTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
