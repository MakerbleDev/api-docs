      enum: [contact.created, contact.updated, story.created, story.updated, project.created, project.updated, import.completed]

    WebhookEndpointRequest:
      type: object
      required: [webhook_endpoint]
      properties:
        webhook_endpoint:
          type: object
          properties:
            charity_id:
              type: integer
              description: The Organisation (Charity) ID. Required when creating
            url:
              type: string
              format: uri
              description: HTTPS URL of the receiver. Required when creating
            description:
              type: string
            event_types:
              type: array
              items:
                $ref: '#/components/schemas/WebhookEvent'
              description: Defaults to every event
            active:
              type: boolean
              description: false pauses the endpoint; true resumes it

    WebhookEndpoint:
      type: object
      properties:
        id:
          type: integer
        charity_id:
          type: integer
        url:
          type: string
          example: "https://crm.example.org/makerble"
        description:
          type: string
          nullable: true
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        active:
          type: boolean
          description: false while paused
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: Set when Makerble switched the endpoint off after repeated failure
        failure_count:
          type: integer
          description: Deliveries in a row that failed every attempt
        last_success_at:
          type: string
          format: date-time
          nullable: true
        created_by_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          properties:
            secret:
              type: string
              example: "whsec_3f1c..."
              description: The signing secret. Returned only when created or rotated

    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: string
          example: "evt_6f0c2a4e-8d1b-4b7e-9a53-2f1d6c3e9b10"
          description: The `id` the receiver saw
        event:
          type: string
          example: contact.updated
        resource_type:
          type: string
          nullable: true
          description: Beneficiary (Contact), Story, Project, RecordImporter or ImportPlan
        resource_id:
          type: integer
          nullable: true
        occurred_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, succeeded, failed]
        attempts:
          type: integer
        response_code:
          type: integer
          nullable: true
          description: The receiver's HTTP status on the last attempt; null after a timeout or connection error
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedWebhookEndpoints:
