  /outcomes:
    get:
      tags: [Outcomes]
      summary: List all Outcomes
      description: |
        Each Outcome has a stage (short/medium/long-term) placing it in Progress Panel cols 3–5.

        Returns only the Outcomes the signed-in user can see: their own, those of every
        organisation where they are an editor, reporter or observer, and those used by one of
        their Projects. Outcomes from the public library shared by all organisations are
        added only when `include_public_library=true`.
      operationId: listOutcomes
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - $ref: '#/components/parameters/IncludePublicLibrary'
      responses:
        "200":
          description: Paginated list of Outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOutcomes'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Outcomes, Library]
      summary: Create an Outcome
      operationId: createOutcome
      description: |
        Creates an Outcome: a change your organisation wants to see in the people it works with,
        e.g. "Improved confidence". It stays unapproved and private to your organisation unless you
        are Makerble staff: `approved`, `private` and `is_default` are honoured for staff only and
        ignored for everyone else. Near-identical titles get `409`, as for **Create a List**.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id, title, stage]
              properties:
                organisation_id:
                  type: integer
                  description: The organisation (Charity) that will own it; you must be one of its editors
                title:
                  type: string
                stage:
                  type: string
                  enum: [Short-term outcomes, Medium-term outcomes, Long-term outcomes]
                description:
                  type: string
                instruction:
                  type: string
                  description: Guidance for staff recording it
                department:
                  type: string
                  description: A cause area (Department) name, e.g. Health
                approved:
                  type: boolean
                  description: Makerble staff only
                private:
                  type: boolean
                  description: Makerble staff only
                is_default:
                  type: boolean
                  description: Makerble staff only
                force:
                  $ref: '#/components/schemas/ForceCreate'
            example:
              organisation_id: 913
              title: "Improved confidence"
              stage: "Short-term outcomes"
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /outcomes/{id}:
    get:
      tags: [Outcomes]
