openapi: 3.0.3
info:
  title: Makerble API
  description: |
    The Makerble API enables developers to integrate with the Makerble CRM and impact measurement platform — reading and writing data on contacts, projects, surveys, cases, outcomes, metrics, and more.

    ## Base URL
    ```
    https://makerble.com/api/v2
    ```
    A staging environment is also available at `https://staging.makerble.com/api/v2`.

    ## Authentication
    All endpoints (except `/users/sign_in` and the password reset endpoints) require token-based authentication. Pass both headers on every authenticated request:

    | Header | Value |
    |---|---|
    | `X-User-Email` | The authenticated user's email address |
    | `X-User-Token` | The user's long-lived authentication token |

    Tokens are obtained via `POST /users/sign_in` and **do not expire**. Each user has one fixed token.

    > **Multi-user integrations:** If activity must be attributed to specific users, authenticate separately per user. A single Organisation Admin token is acceptable when attribution to one admin is sufficient.

    ## Creating Users via the API
    `POST /users` requires a separate API Key (`auth_code`). Request one at [api-key-request@makerble.com](mailto:api-key-request@makerble.com).

    ## Terminology
    Makerble uses different terms in the UI and the API:

    | Front-end | API |
    |---|---|
    | Organisation | Charity |
    | Contact | Beneficiary |
    | Contact Bio Form | Beneficiary Category |
    | Contact Type | Beneficiary Type |
    | Survey | Story Category |
    | Survey Campaign | Project Story Category |
    | Survey Response / Timeline Update / Instant Update | Story |
    | Activity / Engagement tracker | Change (stage: activity / participation) |
    | Achievement / Choice / Numerical tracker | Indicator (type: binary / scale / value) |
    | Dropdown / List field | Ratio Set |
    | Answer Choice | Sub Ratio |
    | Case Form | Custom Field Category |
    | Case Owner | Case Creator |
    | Case Worker | Case Member |
    | Project Manager | Project Editor |
    | Changemaker | Project Reporter |
    | Analyst | Project Observer |

    ## Story timestamps
    Stories carry three timestamps:

    | API field | Front-end label | Meaning |
    |---|---|---|
    | `actual_created_at` | Date Posted | Real database insertion time |
    | `created_at` | Date Happened | Activity date chosen by the user (can be backdated) |
    | `updated_at` | Date Edited | Most recent modification |

    ## Pagination
    All list endpoints accept:

    | Parameter | Type | Default | Max | Description |
    |---|---|---|---|---|
    | `page` | integer | 1 | — | Page number |
    | `per_page` | integer | 10 | 200 | Records per page |
    | `last_sync_datetime` | string (ISO 8601) | — | — | Return only records updated after this datetime |

    Paginated responses use this envelope:
    ```json
    { "page": 1, "page_size": 10, "page_count": 146, "total_count": 1458, "data": [] }
    ```

  version: "2.0.0"
  contact:
    name: Makerble Support
    url: https://discover.makerble.com
    email: support@makerble.com
  license:
    name: Proprietary

servers:
  - url: https://makerble.com/api/v2
    description: Production
  - url: https://staging.makerble.com/api/v2
    description: Staging
  - url: /mock
    description: Mock server (safe for testing — no real data)

tags:
  - name: Authentication
    description: Obtain and manage authentication tokens
  - name: Users
    description: Platform users with login credentials
  - name: Charities
    description: Organisations — the top-level entity that owns Projects
  - name: Projects
    description: The primary organisational unit — every Story and Case belongs to a Project
  - name: Beneficiaries
    description: Contacts — the people your organisation works with
  - name: Beneficiary Categories
    description: Contact Bio Forms — field schemas for creating and editing Beneficiary records
  - name: Beneficiary Types
    description: The four contact types — Person, Organisation, Animal, Object
  - name: Cases
    description: Cases linked to a Beneficiary and a Project
  - name: Stories
    description: Survey responses, timeline updates, and instant updates — the primary content format
  - name: Story Categories
    description: Surveys — form templates used to create Stories
  - name: Project Story Categories
    description: Survey Campaigns — a Survey assigned to a specific Project
  - name: Story Metrics
    description: Per-story metric records (Story Changes, Story Indicators, Story Beneficiaries)
  - name: Changes
    description: Activity and Participation custom KPIs tracked across Projects
  - name: Indicators
    description: Scale, Binary, and Value progress trackers linked to Outcomes
  - name: Outcomes
    description: Impact outcomes that Indicators are grouped under
  - name: Outcome Indicators
    description: Join table linking Outcomes to Indicators
  - name: Ratio Sets
    description: Dropdown / List field definitions
  - name: Sub Ratios
    description: Individual answer choices within a Ratio Set
  - name: Ratio Set Choiceables
    description: Selection rules governing how many Sub Ratios can be chosen from a Ratio Set
  - name: Custom Field Categories
    description: Case Forms — field schemas for creating Case records

paths:

  /users/sign_in:
    post:
      tags: [Authentication]
      summary: Sign in — obtain an authentication token
      description: |
        Authenticates with email and password. Returns a long-lived token for all subsequent requests.
        Tokens **do not expire**. No auth headers needed on this endpoint.
      operationId: signIn
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: ["user[email]", "user[password]"]
              properties:
                "user[email]":
                  type: string
                  format: email
                  example: user@example.com
                "user[password]":
                  type: string
                  format: password
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                user_id: 42
                email: user@example.com
                authentication_token: "sJxyz_abc123longtoken"
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List all Users
      operationId: listUsers
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Users]
      summary: Create a new User
      description: |
        Registers a new user. Requires an `auth_code` API Key — request one at [api-key-request@makerble.com](mailto:api-key-request@makerble.com).

        **Password rules:** min 8 chars · at least 1 number · 1 special character · 1 capital letter
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_code, user, charity_id]
              properties:
                auth_code:
                  type: string
                  description: API Key from api-key-request@makerble.com
                user:
                  type: object
                  required: [email, first_name, last_name, password, password_confirmation]
                  properties:
                    email:
                      type: string
                      format: email
                    first_name:
                      type: string
                    last_name:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                charity_id:
                  type: integer
                charity_controlled:
                  type: boolean
                  default: false
                disable_email_notification:
                  type: boolean
                  default: false
            example:
              auth_code: "qspehLnbRlUS0uiA2mN..."
              user:
                email: "jane@charity.org"
                first_name: "Jane"
                last_name: "Smith"
                password: "Secur3!Pass"
                password_confirmation: "Secur3!Pass"
              charity_id: 31
              charity_controlled: true
              disable_email_notification: false
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                  message:
                    type: string
                    example: "Sign up successfully!!!"
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a single User
      operationId: getUser
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /users/permissions:
    get:
      tags: [Users]
      summary: Get user permissions
      description: Returns the authenticated user's permissions across all Projects and Organisations.
      operationId: getUserPermissions
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: Permissions object
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users/request_password_reset_code:
    get:
      tags: [Users]
      summary: Request a password reset code
      description: Sends a reset code to the user's email. No authentication required.
      operationId: requestPasswordResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Reset code sent

  /users/check_password_reset_code:
    get:
      tags: [Users]
      summary: Verify a password reset code
      operationId: checkPasswordResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: reset_code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_reset_code_correct:
                    type: boolean

  /users/reset_password:
    post:
      tags: [Users]
      summary: Reset a user's password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reset_code, password]
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                  example: "DD3CB5B7C260"
                password:
                  type: string
      responses:
        "200":
          description: Password reset successful
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /charities/{id}:
    get:
      tags: [Charities]
      summary: Get a single Organisation
      description: Returns a single Charity (Organisation). Each Charity owns one or more Projects.
      operationId: getCharity
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Charity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /projects:
    get:
      tags: [Projects]
      summary: List all Projects
      description: |
        Returns all Projects accessible to the authenticated user. Every Story and Case belongs to a Project.

        Users hold one of three roles per Project:

        | Role | API name | Front-end | Permissions |
        |---|---|---|---|
        | Editor | `editor` | Manager | Admin — edit Project, manage users |
        | Reporter | `reporter` | Changemaker | Create Stories |
        | Observer | `observer` | Analyst | Read-only |
      operationId: listProjects
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get a single Project
      operationId: getProject
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Project record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /projects/add_colleague.json:
    post:
      tags: [Projects]
      summary: Add users to a Project
      description: Grants roles on a Project. A user can hold Editor, Reporter, and Observer simultaneously.
      operationId: addColleague
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_data]
              properties:
                role_data:
                  type: array
                  items:
                    type: object
                    required: [project_id]
                    properties:
                      project_id:
                        type: integer
                        example: 619
                      editor_ids:
                        type: array
                        items:
                          type: integer
                        example: [559]
                      reporter_ids:
                        type: array
                        items:
                          type: integer
                        example: [560]
                      observer_ids:
                        type: array
                        items:
                          type: integer
                        example: [561]
      responses:
        "200":
          description: Users added
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries:
    get:
      tags: [Beneficiaries]
      summary: List all Beneficiaries (Contacts)
      description: |
        Returns all Contacts visible to the authenticated user. Filter by `charity_id` or `project_id`.
        Response includes `custom_fields` defined by the Beneficiary Category.
      operationId: listBeneficiaries
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - name: charity_id
          in: query
          schema:
            type: integer
          description: Filter to Contacts in this Organisation
        - name: project_id
          in: query
          schema:
            type: integer
          description: Filter to Contacts enrolled in this Project
      responses:
        "200":
          description: Paginated list of Beneficiaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBeneficiaries'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Beneficiaries]
      summary: Create a Beneficiary (Contact)
      description: |
        Creates a new Contact. Required: `name`, `owner_id`.

        Call `GET /beneficiary_types` for `beneficiary_type_id` values and `GET /custom_fields` for available custom field IDs.
      operationId: createBeneficiary
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryCreateRequest'
            example:
              beneficiary:
                name: "Jack Smith"
                date_of_birth: "13-05-1990"
                address: "123 Example Street, London"
                latitude: "51.5074"
                longitude: "-0.1278"
                beneficiary_type_id: 1
                owner_id: 237
              project_ids: [572]
              beneficiary_category_ids: [294]
              custom_fields:
                "173": "some value"
      responses:
        "200":
          description: Beneficiary created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /beneficiaries/{id}:
    get:
      tags: [Beneficiaries]
      summary: Get a single Beneficiary (Contact)
      description: Returns full profile including all custom fields.
      operationId: getBeneficiary
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Beneficiary record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiaries/advanced_custom_fields:
    get:
      tags: [Beneficiaries]
      summary: Get advanced custom fields for all Beneficiaries
      description: Returns the per-record custom field values for all Beneficiaries.
      operationId: listBeneficiaryAdvancedCustomFields
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated custom field records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneric'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /beneficiaries/impact_box_data:
    get:
      tags: [Beneficiaries]
      summary: Get Impact Box data (Progress Trackers per Contact)
      description: Aggregated metric progress per Beneficiary — the data shown in the Progress Trackers box on a Contact Profile page.
      operationId: getBeneficiaryImpactBoxData
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated impact box records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneric'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /project_beneficiaries:
    get:
      tags: [Beneficiaries]
      summary: List Project–Beneficiary associations
      description: Join table linking Beneficiaries to Projects (many-to-many).
      operationId: listProjectBeneficiaries
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated Project–Beneficiary records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneric'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /beneficiary_categories:
    get:
      tags: [Beneficiary Categories]
      summary: List all Beneficiary Categories (Contact Bio Forms)
      operationId: listBeneficiaryCategories
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBeneficiaryCategories'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /beneficiary_categories/{id}:
    get:
      tags: [Beneficiary Categories]
      summary: Get a single Beneficiary Category
      operationId: getBeneficiaryCategory
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Beneficiary Category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryCategory'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /beneficiary_categories/current_fields:
    get:
      tags: [Beneficiary Categories]
      summary: Get current active fields for Beneficiary Categories
      operationId: getBeneficiaryCategoryCurrentFields
      security: [{tokenAuth: []}]
      responses:
        "200":
          description: Current field definitions
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'

  /custom_fields:
    get:
      tags: [Beneficiary Categories]
      summary: List Custom Field definitions (Contact Bio Forms)
      description: Filter by `beneficiary_category_ids[]` to get fields for specific forms.
      operationId: listCustomFields
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - name: "beneficiary_category_ids[]"
          in: query
          schema:
            type: integer
          description: Filter by Beneficiary Category ID (repeat for multiple)
      responses:
        "200":
          description: Paginated Custom Field definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneric'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /beneficiary_types:
    get:
      tags: [Beneficiary Types]
      summary: List all Beneficiary Types
      description: Returns the four types — Person (1), Organisation (2), Animal (3), Object (4). The ID is required when creating a Beneficiary.
      operationId: listBeneficiaryTypes
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: Paginated list of Beneficiary Types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBeneficiaryTypes'
              example:
                page: 1
                page_size: 4
                page_count: 1
                total_count: 4
                data:
                  - id: 1
                    name: "Person"
                    updated_at: "2020-09-28T15:19:24.310+01:00"
                    created_at: "2020-09-28T15:19:24.310+01:00"
                  - id: 2
                    name: "Object"
                    updated_at: "2020-09-28T15:19:24.319+01:00"
                    created_at: "2020-09-28T15:19:24.319+01:00"
                  - id: 3
                    name: "Organisation"
                    updated_at: "2020-09-28T15:19:24.324+01:00"
                    created_at: "2020-09-28T15:19:24.324+01:00"
                  - id: 4
                    name: "Animal"
                    updated_at: "2021-09-11T10:04:59.074+01:00"
                    created_at: "2021-09-11T10:04:59.074+01:00"
        "401":
          $ref: '#/components/responses/Unauthorized'

  /beneficiary_types_categories:
    get:
      tags: [Beneficiary Types]
      summary: List Beneficiary Type–Category associations
      operationId: listBeneficiaryTypesCategories
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneric'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /stories:
    get:
      tags: [Stories]
      summary: List all Stories
      description: |
        Returns all Stories visible to the authenticated user. Stories capture text, media, and progress towards Changes and Indicators, and can be tagged to Beneficiaries.

        **Timestamp note:** `actual_created_at` = Date Posted · `created_at` = Date Happened · `updated_at` = Date Edited
      operationId: listStories
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Stories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStories'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Stories]
      summary: Create a Story
      description: |
        Creates a Story tagged to zero, one, or multiple Beneficiaries.

        **Recommended workflow:**
        1. `GET /story_categories/:id` — retrieve the survey's fields, Indicators, Outcomes, and scale choices
        2. `GET /sub_ratios?ratio_set_ids[]=N` — retrieve valid answer choice IDs for Scale Indicators
        3. Submit this endpoint with the full payload

        | Field | Notes |
        |---|---|
        | `story.story_group` | Always `"change_created"` |
        | `story.story_format` | Always `"old"` |
        | `story.created_at` | Date Happened in `YYYY-MM-DD` |
        | `story_changes` | Activity/Participation totals — `[{change_id, number}]` |
        | `story_change_beneficiaries` | Per-contact Participation records — `[{change_id, beneficiary_id}]` |
        | `story_indicator_beneficiaries` | Per-contact indicator responses (see schema) |
        | `custom_fields` | `{custom_field_id: value}` for text/date/time fields |

        > For binary indicators: include `binray_indicator_value: "on"` if ticked; omit the record entirely if not.
        > Activity Changes: include in `story_changes` only — cannot be tagged to beneficiaries.
      operationId: createStory
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCreateRequest'
            example:
              story:
