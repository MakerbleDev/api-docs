                  $ref: '#/components/schemas/FormulaTrackerAttributes'
            example:
              charity_id: 913
              project_id: 4510
              formula_tracker:
                expression:
                  - { kind: tracker, type: Change, id: 5120 }
                  - { kind: operator, value: "+" }
                  - { kind: tracker, type: WorkflowTracker, id: 41 }
      responses:
        "200":
          description: The results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaTrackerPreview'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Formula Trackers for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

