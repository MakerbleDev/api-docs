        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /events/{id}/staff:
    get:
      tags: [Events]
      summary: List an event's Event Managers and Workers
      operationId: listEventStaff
      description: |
        The event's Event Managers and Event Workers, with their roles on the event and, when
        the Event Format has Event Roles turned on, their Event Role. Anyone who can open the
        event page can see them.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: A page of staff, by name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventStaffMember' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Events]
      summary: Add Event Managers or Workers
      operationId: addEventStaff
      description: |
        Adds colleagues in the event's project or organisation as Event Managers or Event
        Workers, as the Edit Event form does, respecting a fixed worker limit. `event_role_id`
        must be one of the Event Format's Event Roles for Event Managers and Workers, and is
        set on this event. For a master event, `apply_to: all_events_in_series` adds them to
        the whole series. Needs permission to edit the event.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, role]
              properties:
                user_ids: { type: array, items: { type: integer } }
                role: { type: string, enum: [manager, worker] }
                event_role_id: { type: integer }
                apply_to: { type: string, enum: [this_event, all_events_in_series], default: this_event }
            example:
              user_ids: [301]
              role: worker
              event_role_id: 7
      responses:
        "200":
          description: The event, as Get an event returns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /events/{id}/staff/{user_id}:
    patch:
      tags: [Events]
      summary: Change an Event Manager's or Worker's Event Role
      operationId: updateEventStaffMember
      description: "Sets or clears (`event_role_id: null`) the Event Role of one of the event's Event Managers or Workers."
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_role_id: { type: integer, nullable: true }
            example:
              event_role_id: 7
      responses:
        "200":
          description: The event, as Get an event returns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'
    delete:
      tags: [Events]
      summary: Remove an Event Manager or Worker
      operationId: removeEventStaffMember
      description: |
        Removes the user as an Event Manager and/or Worker (`role` to remove only one). At
        least one Event Manager must remain. For a master event, `apply_to:
        all_events_in_series` removes them from the whole series.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - { name: user_id, in: path, required: true, schema: { type: integer } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [manager, worker] } }
        - { name: apply_to, in: query, required: false, schema: { type: string, enum: [this_event, all_events_in_series], default: this_event } }
      responses:
        "200":
          description: The event, as Get an event returns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /projects/{id}/event_categories:
