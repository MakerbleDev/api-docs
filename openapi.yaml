  /media_items:
    get:
      tags: [Media Gallery]
      summary: List Media Gallery files
      description: |
        Lists every photo, video, audio file and document attached to Stories and to Contacts' bios in one organisation — the files shown on the **Media Gallery** page (Impact → Media Gallery).

        Only files from Stories and Contacts the user is already allowed to view are returned, so two users can get different results for the same organisation. Filters combine with AND.

        `kind_counts` gives the number of files of each kind for the same filters, ignoring `kind` — the counts on the File type buttons.
      operationId: listMediaItems
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: true
          schema:
            type: integer
          description: Organisation ID
        - name: kind
          in: query
          schema:
            type: string
            enum: [photo, video, audio, document]
          description: File type
        - name: search
          in: query
          schema:
            type: string
          description: Matches the start of words in the file name, Story title, Contact name and caption
        - name: source[]
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [stories, contacts]
          style: form
          explode: true
          description: Story files, Contact bio files, or both (default both)
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
          description: By upload date
        - name: story_filters
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          example: { project_ids: [19], story_category_ids: [327] }
          description: |
            Timeline (Story) Filters, as on the homepage. Keys (arrays of ids unless noted): `project_ids`, `story_category_ids` (Surveys), `bundle_ids` (Albums), `beneficiary_ids` (Contacts tagged in the Story), `label_ids`, `outcome_ids`, `change_ids` (Engagement), `indicator_ids`, `user_ids` (Authors), `charity_ids`, and `created_at_from` (Date Happened range, `YYYY/MM/DD - YYYY/MM/DD`).

            Story files must match them. For Contact bio files, `project_ids` matches the Contact's Project memberships, and any other key means the Contact must appear in at least one matching Story.
        - name: contact_filters
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          example: { group_ids: [4], beneficiary_types: [1] }
          description: |
            Contact Filters, as on Manage Contacts. Common keys (arrays of ids): `project_ids`, `group_ids`, `beneficiary_types` (Contact types: 1 Person, 2 Object, 3 Organisation, 4 Animal), `beneficiary_state_ids`, `created_by_ids`, `bundle_ids`.

            Contact bio files must match them, and Story files must involve at least one matching Contact.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Media Gallery files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaItems'
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                kind_counts: { all: 1, photo: 1, video: 0, audio: 0, document: 0 }
                data:
                  - id: 512
                    kind: photo
                    file_name: harvest_day.jpg
                    content_type: image/jpeg
                    file_size: 248310
                    caption: Volunteers at the allotment
                    source_type: story
                    source_id: 90211
                    source_title: Harvest day at the allotment
                    project_id: 19
                    project_name: Growing Together
                    uploaded_by_id: 6207
                    uploaded_at: "2026-09-12T10:14:00Z"
                    updated_at: "2026-09-12T10:15:02Z"
                    thumbnail_url: https://makerble.s3.amazonaws.com/medias/files/000/000/512/thumbnail/harvest_day.jpg
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user is not a member of that organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: forbidden
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /media_items/{id}:
    get:
      tags: [Media Gallery]
      summary: Get one Media Gallery file, with a download link
      description: |
        Returns one file from the **Media Gallery**, as shown in its preview panel, with a signed `download_url` that downloads the file.

        Permissions are checked again on every request. The user must still be able to view the Story or Contact the file belongs to.

        The link expires after `download_url_expires_in` seconds, so request the file again for a fresh link rather than storing it.
      operationId: getMediaItem
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The file, its field name and a short-lived download link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemDetail'
              example:
                id: 512
                kind: document
                file_name: consent_form.pdf
                content_type: application/pdf
                file_size: 84211
                caption: null
                source_type: contact
                source_id: 30144
                source_title: Jordan T.
                project_id: null
                project_name: null
                uploaded_by_id: 6207
                uploaded_at: "2026-09-12T10:14:00Z"
                updated_at: "2026-09-12T10:15:02Z"
                thumbnail_url: null
                field_name: Consent form (file field)
                download_url: https://files.example.com/medias/files/000/000/512/original/consent_form.pdf?X-Amz-Expires=300&X-Amz-Signature=...
                download_url_expires_in: 300
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The file exists, but the user can't view its Story or Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: forbidden
        "404":
          $ref: '#/components/responses/NotFound'

  /organisations/{organisation_id}/seats:
    parameters:
      - $ref: '#/components/parameters/OrganisationId'
    get:
      tags: [Seats]
      summary: List an Organisation's seats per colleague
      description: |
        The Organisation's (Charity's) current Contracts, with seats bought and used per Billing Role
        (Organiser, Practitioner, Helper) on Role-based Pricing or in total on Flat Pricing, and a page
        of colleagues. Each colleague has the seat they hold on each Contract, the lowest seat their
        roles allow, and a status: `covered`, `no_seat` (a role that needs a seat but no seat),
        `seat_too_low` (a seat below what their roles need) or `no_seat_needed` (they still hold a
        seat but no longer have a role that needs one).

        This is the Seats per Colleague page under Our Account › Seats. Organisation Admins and
        Makerble staff can read it. Nobody loses access because of their seat.
      operationId: listSeats
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: The Contracts and a page of colleagues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSeats'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /organisations/{organisation_id}/seats/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganisationId'
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: The colleague's user ID
    put:
      tags: [Seats]
      summary: Change a colleague's seat on one Contract
      description: |
        Gives a colleague a seat on one of the Organisation's current Contracts, changes it or takes it
        away. On a Role-based Pricing Contract send the Billing Role to give, or `null` to take the seat
        away. On a Flat Pricing Contract send `has_seat` instead. The old seat is kept in Seat History.
        Nothing stops you going over the seats bought; the Organisation then shows as over its seat count.

        Only the Organisation's admins (and Makerble admins) can change seats. The colleague must have a
        role in the Organisation or still hold a seat there. Returns the colleague as the list does.
      operationId: changeSeat
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatChangeRequest'
            examples:
              roleBased:
                value:
                  contract_id: 31
                  billing_role_id: 2
              takeAway:
                value:
                  contract_id: 31
                  billing_role_id: null
              flat:
                value:
                  contract_id: 32
                  has_seat: true
      responses:
        "200":
          description: The colleague's seats after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatColleague'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

