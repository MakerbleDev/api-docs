              schema:
                $ref: '#/components/schemas/PaginatedCohortTrackers'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user has no editor or reporter role in the Organisation
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Cohort Trackers]
      summary: Create a Cohort Tracker
      description: |
        Creates a Cohort Tracker (Create a metric > Cohort Tracker). Every tracker counts only
        members of the Project or Album it is placed on: `membership` is `ever_enrolled`
        (default: anyone whose status History shows them Enrolled at any time) or
        `currently_enrolled` (their current Project State). `criteria` adds further conditions, in
        the Contact Filters format; see `POST /cohort_trackers/preview` for the keys.
        Requires an editor or reporter of the Organisation. `criteria` may also be sent as a JSON string.
      operationId: createCohortTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CohortTrackerRequest'
            example:
              cohort_tracker:
                charity_id: 913
                name: "Bambanani children who start Ignite"
                membership: "ever_enrolled"
                criteria:
                  bundle_ids: ["57", "58"]
      responses:
        "201":
          description: Cohort Tracker created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortTrackerDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Cohort Trackers for this Organisation
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /cohort_trackers/preview:
    post:
      tags: [Cohort Trackers]
      summary: Preview Cohort Tracker criteria
      description: |
        How many of the Organisation's Contacts currently meet some criteria, before the tracker is
        placed on a Project or Album ("Currently matches N contacts across your organisation"), and
        the criteria as they would be stored. `criteria` takes any key the Contacts page's Filters
        sidebar sends; keys no filter reads are dropped from the stored criteria.

        These keys follow the Project or Album the tracker is placed on and the reporting period:
        - `project_ids` (with `project_ids_narrow: "true"` to require all of them), in any state
        - `bundle_ids` (Albums) and `narrow_bundle_ids`
        - `projects_states_hash`: `{project_id: beneficiary_state_id}`, current Project State in each
        - `project_beneficiary_states`: `{project_id: {state_id: {enabled: "true", added_from_date, removed_from_date}}}`, dates as `dd/mm/yyyy - dd/mm/yyyy`, matched against status History
        - `project_story_category_ids` (Survey Campaigns completed) with `project_story_category_filter_data: {id: {story_date_from}}`
        - `attendance_rate`: `{change_id, from, to, event_scope}`
        - `same_day_rate` (Same-day rate): `{change_id, event_scope, event_filter_params, qualifying_change_ids, match: all|any, qualifying_event_scope, qualifying_event_filter_params, from, to}`. On the days the `change_id` Engagement Tracker was recorded for a Contact at an event, the percentage of those days on which the `qualifying_change_ids` Engagement Trackers (all of them, or any one) were also recorded for them at an event on the same date, in the Organisation's time zone. A day with no matching record counts as not met; Contacts with no such days never match. E.g. children who received all four meals on every day they attended class: `from: "100", to: "100"`
        - `distance_travelled`: `{trackers: [{indicator_id, directions: [improved|no_change|worsened]}], same_project}`
        - `indicator_comparisons`: `{indicator_id: {response: any|latest, op, sub_ratio_ids, values}}`
        - `indicator_sub_ratios_hash`: `{indicator_id: [sub_ratio_id]}`

        The Contacts page's other sections apply as they do there, against the Contacts' current
        details, e.g. `group_ids`, `beneficiary_types`, `age_from` / `age_to` (`{year, month, day}`),
        `date_of_birth_from` and `created_at_from` (`yyyy/mm/dd - yyyy/mm/dd`), `created_by_ids`,
        `story_creator_ids`, `case_owner_ids`, `case_worker_ids`, `open_cases`, `closed_cases`,
        `custom_field_value_hash`, `custom_field_definition_hash`, `changes_hash`, `indicators_hash`,
        `outcome_hash`, `event_ids`, `flag_hash`, `relationship_category_hash` and `beneficiary_roles_hash`.
      operationId: previewCohortTracker
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charity_id]
              properties:
                charity_id:
                  type: integer
                cohort_tracker:
                  type: object
                  properties:
                    criteria:
                      type: object
                    membership:
                      type: string
                      enum: [ever_enrolled, currently_enrolled]
            example:
              charity_id: 913
              cohort_tracker:
                criteria:
                  attendance_rate: { change_id: "412", from: "75", to: "100" }
      responses:
        "200":
          description: The count and the normalised criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 42
                  criteria:
                    type: object
                  names_projects_or_albums:
                    type: boolean
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't create Cohort Trackers for this Organisation
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /cohort_trackers/{id}:
    get:
      tags: [Cohort Trackers]
      summary: Get a Cohort Tracker
      description: |
        A Cohort Tracker with where it is used. `names_projects_or_albums` is true when its criteria
        point at specific Projects or Albums, so it counts against those same ones wherever it is placed.
      operationId: getCohortTracker
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
