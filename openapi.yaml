  /project_story_categories/{id}/survey_links:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The Survey Campaign (Project Story Category) ID
    post:
      tags: [Project Story Categories]
      summary: Generate personal survey links for Contacts (without sending them)
      description: |
        Generates a personal survey link (Survey Invitation link) for each Contact, as the
        **Send Survey** page does, and returns the links. **Nothing is emailed or texted.**
        Each response submitted through a link is recorded against that Contact.

        - `beneficiary_ids` must be Contacts already in the Survey Campaign's Project.
        - `emails` are matched to an existing Contact of the organisation with that email
          address; if there is none, a new Contact is created for the organisation.
        - At most 200 `beneficiary_ids` and `emails` per request.
        - `link_expiry`: `use_once` (default) — the link stops working after one response;
          `evergreen` — the link stays active.

        Requires Project Editor or Organisation Editor access to the Survey Campaign's Project.
        The links then appear on the Unique Survey Links page.
      operationId: createSurveyLinks
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beneficiary_ids:
                  type: array
                  items:
                    type: integer
                  description: Contacts (Beneficiaries) in the Survey Campaign's Project
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: Email addresses, matched to or creating Contacts. No email is sent.
                send_survey_wave_id:
                  type: integer
                  description: Optional Wave, from GET /project_story_categories/{id}/survey_waves
                link_expiry:
                  type: string
                  enum: [use_once, evergreen]
                  default: use_once
                is_anonymised:
                  type: boolean
                  default: false
            example:
              beneficiary_ids: [1201, 1202]
              emails: ["sam@example.org"]
              link_expiry: use_once
              is_anonymised: false
      responses:
        "201":
          description: Links generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  send_survey_id:
                    type: integer
                    description: The Survey Invitation batch the links belong to
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SurveyLink'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user may not send surveys for this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: |
            Invalid request: Contacts outside the Project (listed in `invalid_beneficiary_ids`),
            more than 200 recipients, no recipients, an unknown `link_expiry`, or a Wave that
            is not available for this Survey Campaign.

            Refused Contacts are also split in two. `beneficiary_ids_not_in_project` are Contacts of
            the organisation who aren't in the Survey Campaign's Project: add them with
            `POST /project_beneficiaries`, then try again, or pass their email addresses in `emails`.
            `beneficiary_ids_not_found` aren't Contacts of the organisation (the same answer whether
            the id belongs to another organisation or doesn't exist). A Contact created from an
            email address joins the organisation but not the Project. The three lists are only
            present when Contacts were refused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  invalid_beneficiary_ids:
                    type: array
                    items:
                      type: integer
                  beneficiary_ids_not_in_project:
                    type: array
                    items:
                      type: integer
                  beneficiary_ids_not_found:
                    type: array
                    items:
                      type: integer
              example:
                errors:
                  - >-
                    These contacts are in your organisation but not in the project "Understanding Italian": 9876.
                    Add them to the project first (API: POST /api/v2/project_beneficiaries; MCP:
                    makerble_add_contacts_to_project; in Makerble: Contacts page, More options, Assign Contacts
                    to projects), then try again. Or pass their email addresses in emails instead, which doesn't
                    need them to be in the project.
                  - "These contacts were not found in your organisation: 9877."
                invalid_beneficiary_ids: [9876, 9877]
                beneficiary_ids_not_in_project: [9876]
                beneficiary_ids_not_found: [9877]
    get:
      tags: [Project Story Categories]
      summary: List personal survey links for a Survey Campaign
      description: |
        Lists the personal survey links already generated for a Survey Campaign, e.g. to
        reuse a Contact's existing link. A `use_once` link that has been answered has
        `expired: true`. Requires Project Editor or Organisation Editor access.
      operationId: listSurveyLinks
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - name: beneficiary_id
          in: query
          schema:
            type: integer
          description: Only this Contact's links
        - name: send_survey_wave_id
          in: query
          schema:
            type: integer
          description: Only links for this Wave
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSurveyLinks'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user may not send surveys for this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/responses/NotFound'

