  /impact_store/search:
    get:
      tags: [ImpactStore]
      summary: Search the ImpactStore
      operationId: searchImpactStore
      description: |
        Searches the Makerble ImpactStore: the ready-made Surveys, Contact Forms, Case Forms, Impact
        Frameworks, Report Templates, Toolkits and Project Types published for any organisation to
        reuse. Use it before making one of these from scratch.

        - Only published items are searched: those the Explore pages list (approved, shared with
          everyone, and with a name and, except for Contact and Case Forms, a description), and every
          Project Type, since only Makerble makes them. Withdrawn Report Templates never appear.
        - Items matching more of the words in `query` come first; an item matching none of them is
          left out. Common words such as "a", "for" and "the" are ignored. `matched_words` says how
          many words each item matched.
        - `item_type` limits the search to one kind: `survey` (Survey), `contact_form` (Contact
          Form), `case_form` (Case Form), `impact_framework` (Impact Framework), `report_template`
          (Report Template), `toolkit` (Toolkit) or `project_type` (Project Type). Front-end names
          such as `Contact form` work too. Default: every kind.
        - `cause` keeps items tagged with that cause or subcause from the Explore page (a cause takes
          in its subcauses). Contact Forms, Case Forms, Report Templates and Project Types have no
          causes, so a cause leaves them out. With a `cause`, `query` may be left out to list everything for the cause.
        - `used_by_count` is how many organisations use the item: those with a Project using the
          Survey, Impact Framework, Toolkit or Project Type, those that added the Contact Form, those
          with a Case made from the Case Form, and those with the Report Template in their library.
        - `explore_url` is null for a Project Type, which has no Explore page.
        - Read any item but a Report Template in full with **Get a library item**, using the same
          `type` and `id`.
      security: [{tokenAuth: []}]
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          example: wellbeing young people
          description: Words to look for in the name and description
        - name: item_type
          in: query
          required: false
          schema:
            type: string
            enum: [survey, contact_form, case_form, impact_framework, report_template, toolkit, project_type]
          description: Only this kind of item (default every kind)
        - name: cause
          in: query
          required: false
          schema:
            type: string
          example: Mental health
          description: Only items tagged with this cause or subcause, by name, in any case
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Matching published items, best match first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImpactStoreSearch'
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data:
                  - id: 431
                    type: survey
                    type_label: Survey
                    name: Youth wellbeing check-in
                    description: A short wellbeing survey for young people aged 11 to 18
                    causes: [Health, Mental health]
                    used_by_count: 12
                    explore_url: https://www.makerble.com/story_categories/431
                    matched_words: 3
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          description: An unknown `item_type` or `cause`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /explore/surveys:
    get:
      tags: [Explore]
      summary: Explore Surveys
      operationId: listExploreSurveys
      description: |
        Lists the Surveys (Story Categories) published to the Makerble® ImpactStore™ and approved,
        with the same search, filters, counts and sort as the Explore Surveys page. Every caller
        sees the same Surveys; `yours` and `added_to_a_project` depend on the caller's organisations.

        - `query` matches the Survey's name or description.
        - The filters take option keys, as arrays (`theme[]=health`) or comma-separated
          (`theme=health,organisational`). Options in one filter combine with OR and filters
          combine with AND:
          - `theme`: `mental_health_and_wellbeing`, `children_and_young_people`,
            `employment_and_skills`, `community_and_culture`, `health`, `organisational`
          - `audience` (Who answers it): `children_under_16`, `young_people_16_to_25`, `adults`,
            `staff_and_volunteers`
          - `time` (Time to complete): `under_5`, `5_to_15`, `over_15`
          - `feature`: `validated` (Validated scale), `verdicts` (Verdicts set up), `repeats`
            (Repeat at intervals)
        - `chip` is one of the page's Popular chips: `Wellbeing`, `Young people`, `Employment`,
          `Feedback`, `Staff and volunteers`.
        - `facets` gives each filter's options with how many Surveys each would return, given the
          other filters already chosen.
        - `sort` is `added` (most organisations using it first, the default), `new` or `az`.
        - Add a Survey to a project in the app with **Add to a project** on Explore Surveys.
      security: [{tokenAuth: []}]
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          example: wellbeing
          description: Words to look for in the Survey's name or description
        - name: theme
          in: query
          required: false
          schema:
            type: string
          example: mental_health_and_wellbeing
          description: Theme option keys, comma-separated or repeated as theme[]
        - name: audience
          in: query
          required: false
          schema:
            type: string
          example: children_under_16
          description: Who answers it option keys, comma-separated or repeated as audience[]
        - name: time
          in: query
          required: false
          schema:
            type: string
          example: under_5,5_to_15
          description: Time to complete option keys, comma-separated or repeated as time[]
        - name: feature
          in: query
          required: false
          schema:
            type: string
          example: validated
          description: Feature option keys, comma-separated or repeated as feature[]
        - name: chip
          in: query
          required: false
          schema:
            type: string
            enum: [Wellbeing, Young people, Employment, Feedback, Staff and volunteers]
          description: One of the Popular chips
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [added, new, az]
            default: added
          description: Most added, Newest, or A to Z
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: The listed Surveys that match, and each filter's option counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExploreSurveys'
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data:
                  - id: 412
                    name: Stirling Children's Wellbeing Scale
                    description: Positive emotional state and outlook for children aged 8 to 15.
                    shared_by: Makerble Templates
                    tag: Verdicts
                    question_count: 15
                    estimated_minutes: 5
                    themes: [mental_health_and_wellbeing, children_and_young_people]
                    audiences: [children_under_16]
                    repeats_at_intervals: true
                    validated: true
                    verdicts: true
                    libraries_count: 31
                    yours: false
                    added_to_a_project: false
                facets:
                  - key: audience
                    label: Who answers it
                    options:
                      - value: children_under_16
                        label: Children under 16
                        count: 1
                        selected: true
        "401":
          $ref: '#/components/responses/Unauthorized'

  /explore/surveys/{id}:
    get:
      tags: [Explore]
      summary: Preview an Explore Survey
      operationId: getExploreSurvey
      description: |
        One Survey listed on Explore Surveys, as its Preview shows it: the fields of
        **Explore Surveys** plus `sections`, each with its `title` (null for questions before the
        first section header) and its `questions` in the order the Survey asks them. A Survey
        that isn't listed on Explore (unpublished, unapproved or without a description) is a 404.
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 412
      responses:
        "200":
          description: The Survey's preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreSurveyPreview'
              example:
                id: 412
                name: Stirling Children's Wellbeing Scale
                description: Positive emotional state and outlook for children aged 8 to 15.
                shared_by: Makerble Templates
                tag: Verdicts
                question_count: 2
                estimated_minutes: 1
                themes: [mental_health_and_wellbeing]
                audiences: [children_under_16]
                repeats_at_intervals: true
                validated: true
                verdicts: true
                libraries_count: 31
                yours: false
                added_to_a_project: false
                sections:
                  - title: Positive emotional state
                    questions: ["I've been feeling calm", "I've been in a good mood"]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /library/search:
    get:
      tags: [Library]
      summary: Search the library
      operationId: searchLibrary
      description: |
        Searches the reusable building blocks you may see: your organisation's own library, the
        public library shared by every organisation, or both. Use it before making a new Survey,
        Metric or List, so results keep adding up with those recorded against the original.

        - Every word of `query` must match the item's name or description. Surveys also match on
          their question wording, Lists on their choices, and Metrics on their default question.
        - `item_types` limits the search to some types (comma-separated): `survey` (Survey),
          `metric` (Metric), `activity_tracker` (Activity or Attendance tracker), `outcome`,
          `list` (List of answer choices), `unit`, `field`, `contact_form` (Contact Form),
          `case_form` (Case Form), `impact_framework` (Impact Framework), `toolkit`,
          `project_type` and `idea`. Default: every type.
        - `source` is `organisation` (default), `public` or `both`. The public library holds items
          approved for everyone; Makerble staff also see public items awaiting approval. Units and
          Project Types belong to no organisation and are always included.
        - `page` and `per_page` apply to each type, so a page holds up to `per_page` results of
          each type. `total_count` adds up every type's matches and `page_count` is the page count
          of the type with the most matches.
        - Each result has `owner`: `your organisation`, `public library` or `Makerble`. Metrics also
          have `metric_type` (`scale`, `value` or `binary`) and `choices`; Lists have `choices`.
      security: [{tokenAuth: []}]
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          example: agree disagree
          description: Words to look for. Leave it out to list everything of the chosen types.
        - name: item_types
          in: query
          required: false
          schema:
            type: string
          example: metric,list
          description: Comma-separated item types to search (default every type)
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [organisation, public, both]
            default: organisation
          description: Which library to search
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Matching items, up to `per_page` of each type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLibrarySearch'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                data:
                  - id: 812
                    type: metric
                    name: Confidence
                    description: How confident the person feels about the future
                    owner: your organisation
                    metric_type: scale
                    choices: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]
                  - id: 97
                    type: list
                    name: Agree – Disagree
                    description: null
                    owner: public library
                    choices: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          description: An unknown `item_types` value or `source`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unknown item type 'spreadsheet'. Use one of: survey, metric, activity_tracker, outcome, list, unit, field, contact_form, case_form, impact_framework, toolkit, project_type, idea"

  /library/{item_type}/{id}:
    get:
      tags: [Library]
      summary: Get a library item
      operationId: getLibraryItem
      description: |
        Reads one library item in full, so it can be reused or copied. Use the `type` and `id` from
        **Search the library**. Besides `id`, `type`, `name` and `owner`:

        - **survey**: `description` and `questions` in the order the Survey shows them. A question
          has `question` (its wording), `mandatory` and `item` (the Metric, List, Field or Activity
          tracker behind it, with `metric_type`, `unit` and `choices` where they apply). A section
          title is `{section, text}`.
        - **metric**: `description`, `metric_type`, `default_question`, `unit`, `list` (with
          `choices`), `success_direction` and `outcomes`.
        - **list**: `choices` in order, each with `id`, `name` and `points`.
        - **contact_form**: `fields`, shaped like a Survey's questions. **case_form**: `fields`,
          each with `name`, `field_type`, `mandatory` and `choices`.
        - **impact_framework**: `description` and `stages`, each with its `outcomes`,
          `activity_trackers` and `metrics`.
        - **toolkit**: `description` and `contents`, each with `type`, `id` and `name`.
        - **activity_tracker**: `description`, `instruction`. **outcome**: `description`, `metrics`.
          **unit**: `alignment`. **field**: `field_type`. **project_type**: `strapline`,
          `description`. **idea**: `description`.

        Linked Outcomes and Metrics are named only when you may see them. An item you may not see
        returns `404`.
      security: [{tokenAuth: []}]
      parameters:
        - name: item_type
          in: path
          required: true
          schema:
            type: string
          example: survey
          description: The item's type, as in **Search the library**
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItem'
              example:
                id: 3051
                type: survey
                name: Wellbeing check
                owner: your organisation
                description: Monthly check-in
                questions:
                  - section: About you
                    text: A few questions about you
                  - question: How confident do you feel?
                    mandatory: true
                    item:
                      type: metric
                      id: 812
                      name: Confidence
                      metric_type: scale
                      unit: null
                      choices: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: An unknown `item_type`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /library/{item_type}/{id}/usage:
    get:
      tags: [Library]
      summary: See where a library item is used
      operationId: getLibraryItemUsage
      description: |
        Says whether anything depends on a library item before you change it.

        - `projects`: up to 50 projects you can see that use it, and `other_projects_count` for the rest.
        - `records_count` and `last_used_at`: survey responses for a Survey; recorded values for a
          Metric, Activity tracker, Outcome or List; Contacts for a Contact Form; Cases for a Case Form.
        - `contained_in`: up to 50 Surveys, Contact Forms, Outcomes, Impact Frameworks, Metrics or
          Toolkits that include it and that you may see. `contained_in_count` counts them all.
        - `in_use` is true when any of these is above zero.

        Counts only: no records are returned. An item you may not see returns `404`.
      security: [{tokenAuth: []}]
      parameters:
        - name: item_type
          in: path
          required: true
          schema:
            type: string
          example: metric
          description: The item's type, as in **Search the library**
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Where the item is used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryUsage'
              example:
                id: 812
                type: metric
                name: Confidence
                projects:
                  - id: 4410
                    name: Breakfast club
                other_projects_count: 3
                records_count: 40
                last_used_at: "2026-10-14T09:12:00.000Z"
                contained_in:
                  - type: survey
                    id: 3051
                    name: Wellbeing check
                contained_in_count: 1
                in_use: true
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: An unknown `item_type`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lists:
    post:
      tags: [Library]
      summary: Create a List
      operationId: createList
      description: |
        Creates a List (a Ratio Set): the answer choices for a multiple-choice question or a scale
        Metric, e.g. "Agree - Disagree". The choices keep the order you send, at most 50, each
        different. The List stays private to your organisation.

        Search the library first (**Search the library**) and reuse a List that fits. If your
        organisation or the public library already has a List with the same or a near-identical
        name (ignoring case, spacing and punctuation), nothing is created and you get `409` with the
        matches. Send `force: true` to create it anyway. Your organisation can never have two Lists
        with exactly the same name, so that is a `409` even with `force`.

        Nothing is created unless everything is: a bad choice creates no List.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id, name, choices]
              properties:
                organisation_id:
                  type: integer
                  description: The organisation (Charity) that will own it; you must be one of its editors
                name:
                  type: string
                choices:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                force:
                  $ref: '#/components/schemas/ForceCreate'
            example:
              organisation_id: 913
              name: "Agree - Disagree"
              choices: ["Strongly agree", "Agree", "Neutral", "Disagree", "Strongly disagree"]
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /lists/{id}:
    patch:
      tags: [Library]
      summary: Change a List
      operationId: updateList
      description: |
        Renames a List (a Ratio Set) or changes its answer choices. Choices keep their place: the
        first choice you send renames the first choice, and so on. Extra choices are added at the
        end, and saved choices past the last one you send are removed.

        Every Metric and Survey that uses the List sees the change. Check where it is used first
        (**See where a library item is used**), and create a new List instead when other Surveys use it.
        You must be able to edit the List: its creator, or an editor of the organisation that owns
        it. A List you can see but not edit is `403`; one you can't see is `404`. No choices, or
        nothing to change, is `422`.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                choices:
                  type: array
                  items:
                    type: string
                  description: Every choice, in order
            example:
              name: "Interview confidence scale"
              choices: ["Very confident", "Quite confident", "Not very confident", "Not at all confident"]
      responses:
        "200":
          $ref: '#/components/responses/LibraryItemUpdated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /units:
    post:
      tags: [Library]
      summary: Create a Unit
      operationId: createUnit
      description: |
        Creates a Unit: the unit of measure shown beside a number answer, e.g. "hours" or "£".
        Units are shared by every organisation, so only Makerble staff may create one; anyone else
        gets `403` and should reuse an existing Unit. A Unit that already exists is never changed.
        Near-identical names get `409`, as for **Create a List**.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, alignment]
              properties:
                name:
                  type: string
                alignment:
                  type: string
                  enum: [left, right]
                  description: Which side of the number it goes, e.g. left for £10, right for 10 hours
                force:
                  $ref: '#/components/schemas/ForceCreate'
            example:
              name: "sessions"
              alignment: right
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /fields:
    post:
      tags: [Library]
      summary: Create a Field
      operationId: createField
      description: |
        Creates a Field (a Custom Field): a question with a free answer rather than a Metric, e.g.
        "Date of birth" (date) or "Postcode" (text), for a Survey or Contact Form. A `section_title`
        Field is a heading with `section_text` under it; it isn't listed in the library, so the
        response has only its `id`, `type`, `name` and `approved`. Fields are never shared in the
        public library. Near-identical names get `409`, as for **Create a List**.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id, field_name, field_data_type]
              properties:
                organisation_id:
                  type: integer
                  description: The organisation (Charity) that will own it; you must be one of its editors
                field_name:
                  type: string
                field_data_type:
                  type: string
                  enum: [text, number, date, time, file, section_title, email_address, telephone]
                section_text:
                  type: string
                  description: For a section_title Field only
                private:
                  type: boolean
                  description: True if only the organisation's staff may see the answers
                force:
                  $ref: '#/components/schemas/ForceCreate'
            example:
              organisation_id: 913
              field_name: "Postcode"
              field_data_type: text
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /surveys:
    post:
      tags: [Library, Story Categories]
      summary: Create a Survey with its questions
      operationId: createSurvey
      description: |
        Creates a Survey (Story Category) with all its questions, in the order given (at most 50).
        Each question either reuses an item your organisation or the public library already has, by
        id, or defines a new one:

        - `metric_id`, `field_id` or `activity_tracker_id`: reuse a Metric (Indicator), Field
          (Custom Field) or Activity tracker (Change). Any id you can't see is `404`.
        - `new_metric`: a new Metric, with `outcome_id` for the Outcome it measures. A scale
          Metric needs `list_id` (an existing List) or `list` (a new List with its choices).
        - `new_field`: a new Field; `section_title` makes a heading.

        Search the library first and reuse what fits: results recorded against a copy of a Metric
        don't add up with the original. If a new Metric, List or Field has the same or a
        near-identical name to one you could reuse, nothing is created and you get `409` with the
        matches, each with the `question` it belongs to. Send `force: true` to create them anyway.

        Nothing is created unless everything is: an invalid question creates nothing, and the error
        names it ("Question 3: ..."). The Survey and its new items stay private to your organisation
        unless you are Makerble staff and send `approved: true`.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id, name, questions]
              properties:
                organisation_id:
                  type: integer
                  description: The organisation (Charity) that will own it; you must be one of its editors
                name:
                  type: string
                description:
                  type: string
                intro_message:
                  type: string
                departments:
                  type: array
                  items: {type: string}
                causes:
                  type: array
                  items: {type: string}
                sub_causes:
                  type: array
                  items: {type: string}
                approved:
                  type: boolean
                  description: Makerble staff only
                force:
                  $ref: '#/components/schemas/ForceCreate'
                questions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/SurveyDraftQuestion'
            example:
              organisation_id: 913
              name: "Job readiness check-in"
              questions:
                - metric_id: 4412
                  is_mandatory: true
                - new_metric:
                    name: "Job search hours"
                    metric_type: value
                    default_question: "How many hours did you spend looking for work this week?"
                    outcome_id: 3301
                - new_metric:
                    name: "Interview confidence"
                    metric_type: scale
                    default_question: "How confident do you feel about interviews?"
                    outcome_id: 3301
                    list_id: 2210
                - new_field:
                    field_name: "Postcode"
                    field_data_type: text
      responses:
        "201":
          $ref: '#/components/responses/LibraryItemCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/LibraryCreateForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/LibraryDuplicates'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /surveys/{id}/projects:
    post:
      tags: [Library, Story Categories]
      summary: Add a Survey to Projects
      operationId: addSurveyToProjects
      description: |
        Adds a Survey (Story Category) to Projects, as **Add survey to project(s)** on a Survey's
        page does, so people in those Projects can answer it and its results show there.

        - The Survey must be one you can see in your library: your organisation's own, or the
          public library. Otherwise `404`.
        - You must manage each Project, or be an Admin of its organisation. Otherwise `404`,
          naming the Project.
        - A closed Project, or one whose Project Category doesn't allow other Surveys, is `422`.

        Every Project is checked first, so if one is refused none is added. A Project that
        already uses the Survey is left as it is and listed in `existing_project_ids`.
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The Survey's (Story Category's) id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_ids]
              properties:
                project_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                  description: The Projects to add it to
            example:
              project_ids: [4021, 4022]
      responses:
        "200":
          description: The Survey is in every Project given
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      survey_id:
                        type: integer
                      added_project_ids:
                        type: array
                        items:
                          type: integer
                        description: Projects the Survey was added to now
                      existing_project_ids:
                        type: array
                        items:
                          type: integer
                        description: Projects that already used it
              example:
                data:
                  survey_id: 812
                  added_project_ids: [4021]
                  existing_project_ids: [4022]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /surveys/{id}:
    patch:
      tags: [Library, Story Categories]
      summary: Change a Survey
      operationId: updateSurvey
      description: |
        Changes a Survey's (Story Category's) name, description and intro message, as the Survey's
        Edit page does. Send only what changes. You must be able to edit the Survey: an editor of the
        organisation that owns it.

        A name your organisation already uses for another Survey (ignoring case) is `422`, naming
        that Survey. A Survey you can see but not edit, such as another organisation's public
        Survey, is `403`; one you can't see is `404`.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
