          type: integer
        user_id:
          type: integer
          nullable: true
        expression:
          type: array
          items:
            $ref: '#/components/schemas/FormulaToken'
        formula_text:
          type: string
          example: "External referrals + Internal referrals"
        display_format:
          type: string
          enum: [number, percentage]
        decimal_places:
          type: integer
          minimum: 0
          maximum: 3
        unit_label:
          type: string
          nullable: true
          example: "h per child"
        result_kind:
          type: string
          enum: [additive, snapshot]
          description: additive adds up across periods (only + and − of trackers that add up); snapshot works each timeframe out from its own totals
