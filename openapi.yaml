  /organisations/{organisation_id}/age_band_counts:
    parameters:
      - $ref: '#/components/parameters/OrganisationId'
    get:
      tags: [Age Bands]
      summary: Count an Organisation's Contacts by age band
      description: |
        What the Age band panel on the Demographics tab of Manage Contacts shows: how many of the
        Organisation's Contacts (Beneficiaries) are in each age band, with ages worked out from Date of
        Birth as of today. Send `album_id` or `project_id` to count only that Album's or Project's
        Contacts by its age bands (`source` says whose bands were used).

        "Under X" appears only when a Contact is younger than the first band, "Date of birth in the
        future" only when a Contact's Date of Birth is after today (a data-entry error worth fixing),
        and "No date of birth" only when a Contact has none (and not at all when the Organisation
        hides untagged Contacts from demographics charts). Bands with fewer Contacts than the Organisation's Minimum Results
        Threshold have `contacts: null` and are added up under "Below Threshold". Anyone in the
        Organisation can read the counts.
      operationId: countContactsByAgeBand
      security: [{tokenAuth: []}]
      parameters:
        - name: album_id
          in: query
          schema:
            type: integer
          description: Count only this Album's (Bundle's) Contacts, by its age bands
        - name: project_id
          in: query
          schema:
            type: integer
          description: Count only this Project's Contacts, by its age bands
      responses:
        "200":
          description: Contacts per age band
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeBandCounts'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

