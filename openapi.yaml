    post:
      tags: [Workflow Trackers]
      summary: Add a Workflow Tracker to a Project
      description: |
        Places the tracker in a column of the Project's Impact Scorecard (Edit Project Metrics),
        optionally with a one-off target. The Project's Albums pick it up automatically. The tracker
        and Project must belong to the same Organisation, and the user needs rights to edit the
        Project's metrics.
      operationId: addWorkflowTrackerToProject
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CohortTrackerProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column]
              properties:
                column:
                  type: string
                  enum: [activities, engagement, potential, behaviour, growth]
                target:
                  type: integer
            example:
              column: activities
              target: 40
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTrackerPlacement'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The user can't edit this Project's metrics
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    patch:
      tags: [Workflow Trackers]
      summary: Set a Workflow Tracker's targets on a Project
      description: |
        Sets the one-off target and/or replaces this tracker's deadline targets on the Project (Set
        Targets). A tracker counting items adds its targets up across deadlines; one counting each
        Contact once uses each deadline's target on its own. `deadlines: []` clears the deadline
        targets. Requires rights to edit the Project's targets.
      operationId: setWorkflowTrackerProjectTargets
