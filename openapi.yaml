      operationId: getSubRatio
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Sub Ratio record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubRatio'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /ratio_set_choiceables:
    get:
      tags: [Ratio Set Choiceables]
      summary: List all Ratio Set Choiceables
      description: |
        Selection rules for Ratio Sets within forms. Choice types:
        - `single` — one answer only (default)
        - `limited_multiple` — up to `limit` answers
        - `unlimited_multiple` — any number of answers
      operationId: listRatioSetChoiceables
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
        - name: "beneficiary_category_ids[]"
          in: query
          schema:
            type: integer
          description: Filter by Contact Bio Form ID
      responses:
        "200":
          description: Paginated records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRatioSetChoiceables'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /referral_link_details/{id}/definition:
    get:
      tags: [Signup Pages]
      summary: Get a Signup Page's Form Definition (staff API access)
      description: |
        Returns the Form Definition JSON for a Signup Page — its contact form/survey
        fields, skip logic, branding, and settings — the same document format the
        Offline Collector renderer ingests.

        This is the **staff, token-authenticated** variant: standard `X-User-Email` /
        `X-User-Token` headers, scoped to Signup Pages belonging to a charity the
        authenticated user has access to. Useful for testing or integration work
        without a browser session.

        Unlike the anonymous device-fetch variant (`GET /offline_collector_definition`),
        this response does **not** include `submission_credential` — that bearer token
        is only issued to the offline device itself.
      operationId: getReferralLinkDetailDefinition
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: Form Definition JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Signup Page not found, or not accessible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offline_collector_definition:
    get:
      tags: [Signup Pages]
      summary: Get a Signup Page's Form Definition (offline device fetch)
      description: |
        The **anonymous** variant of the Form Definition endpoint, called automatically
        by the installed Offline Collector PWA (`/offline/:token`) when it first loads.
        There is no Devise session and no `X-User-Email`/`X-User-Token` pair involved —
        the query-param token stands in for both identifying the Signup Page and
        authorising the request.

        The response is identical to the staff API variant, **plus one extra key**:
        `submission_credential` — the bearer token the device later uses to post the
        completed submission back via `POST /referral_submissions`.
      operationId: getOfflineCollectorDefinition
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The offline collector token embedded in the Signup Page's "Offline QR Code" / "Offline version" links
      responses:
        "200":
          description: Form Definition JSON, including submission_credential
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FormDefinition'
                  - type: object
                    properties:
                      submission_credential:
                        $ref: '#/components/schemas/SubmissionCredential'
        "401":
          description: Token unknown, or the Signup Page has been deactivated since the token was issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "unauthorized"

  /event_categories:
    get:
      tags: [Event Formats]
      summary: List Event Formats
      operationId: listEventFormats
      description: |
        Lists the Event Formats (Event Categories in the API) of the organisations you are an
        **Organisation Admin** of, as on the Manage Event Formats page. Use it to find the `id`
        for **Delete an Event Format**, and to see beforehand whether deletion will be allowed.

        - Pass `charity_id` to list one organisation's Event Formats.
        - Only Organisation Admins can list Event Formats. Anyone else gets `403`, as does a
          `charity_id` of an organisation you don't administer.
        - `events_count` and `projects_count` say what is blocking deletion, and
          `delete_blocked_reason` gives the same reason **Delete an Event Format** would return.
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: false
          schema:
            type: integer
          description: Only this Organisation's (Charity's) Event Formats
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of Event Formats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventFormats'
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                data:
                  - id: 4521
                    name: "Workshops"
                    is_default: true
                    charity_id: 123
                    created_at: "2026-03-02T10:15:00.000Z"
                    updated_at: "2026-09-14T08:30:00.000Z"
                    events_count: 3
                    projects_count: 2
                    can_delete: false
                    delete_blocked_reason: "This Event Format can't be deleted because it has 3 events. Delete or move those events first. This Event Format can't be deleted because it is added to 2 projects. Remove it from those projects first."
                  - id: 4530
                    name: "Drop-in Sessions"
                    is_default: false
                    charity_id: 123
                    created_at: "2026-10-01T12:00:00.000Z"
                    updated_at: "2026-10-01T12:00:00.000Z"
                    events_count: 0
                    projects_count: 0
                    can_delete: true
                    delete_blocked_reason: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: You are not an Organisation Admin (of the organisation in `charity_id`, if given)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Only an Organisation Admin can list Event Formats."

  /event_categories/{id}:
    delete:
      tags: [Event Formats]
      summary: Delete an Event Format
      operationId: deleteEventFormat
      description: |
        Permanently deletes an Event Format (Event Category in the API). This is the
        same action as **Delete** in the Actions menu on the Manage Event Formats page,
        and runs through the same permission and blocking rules.

        - Only an **Organisation Admin** of the organisation that owns the Event Format
          may delete it. Other members of that organisation get `403`.
        - An Event Format belonging to an organisation you are not a member of returns
          `404`, as does an unknown id.
        - Deletion is refused with `422` while the Event Format still has any events, or
          is still added to any project. The `error` gives the reason and the counts.
        - Default Event Formats (Appointments, Classes, Conferences, Gatherings, Meetings,
          Other Events, Sessions, Workshops) can be deleted under the same rules.
      security: [{tokenAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        "200":
          description: The Event Format was deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
              example:
                id: 4521
                message: "Event Format was successfully deleted."
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: You are not an Organisation Admin of the organisation that owns this Event Format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Only an Organisation Admin can delete Event Formats."
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: The Event Format has events or is added to projects, so it can't be deleted yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "This Event Format can't be deleted because it has 3 events. Delete or move those events first. This Event Format can't be deleted because it is added to 2 projects. Remove it from those projects first."

  /events:
    get:
      tags: [Events]
      summary: List events
      operationId: listEvents
      description: |
        Lists the events you can see, as on the **Manage Events** page, soonest first.
        Organisation Admins see every event in their organisation; other users see the events
        of the projects they are an editor of and the events they are an Event Manager or Event
        Worker at.

        Filter by `project_id`, `event_category_id` (Event Format), `event_type`, a
        `start_date`/`end_date` range (the event's start falls between them), or
        `master_event_id` to list every event in one recurring series (the master event and
        its subsequent events). Pass `charity_id` to list one organisation; one you are not a
        member of returns `404`.

        Filter by the answers on the events' **Event Creation Form** (the custom fields and
        Dropdowns of their Event Format) with `form_field_filters`, as the "Event Creation Form
        fields" section of the Filter Events panel does. Get the keys from
        `GET /event_filter_fields`. Values: text the answer contains for a Text or Email Address
        field; digits for a Telephone field; `yes` or `no` for a Tickbox, Attachment or
        Signature field; `<key>_from` and/or `<key>_to` for a Number, Date (`YYYY-MM-DD`) or
        Time (`HH:MM`) range, inclusive; a list of answer choice (Sub Ratio) ids for a Dropdown,
        matching an event that has any of them. Every key given must match.

        `sort` orders the whole list, not just one page, by those fields: a `sort_key` from
        `GET /event_filter_fields` and optionally `asc` (the default) or `desc`, several
        separated by commas. Blank answers come last. An unknown filter or sort key returns `422`.
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: false
          schema:
            type: integer
          description: Only this Organisation's (Charity's) events
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
        - name: event_category_id
          in: query
          required: false
          schema:
            type: integer
          description: Only events of this Event Format (Event Category)
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            enum: [one-off, master, subsequent]
          description: "`master` is the first event of a recurring series; `subsequent` are the rest of the series"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Only events starting on or after this date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Only events starting on or before this date
        - name: master_event_id
          in: query
          required: false
          schema:
            type: integer
          description: Only the events of this recurring series
        - name: form_field_filters
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          example:
            custom_field_12: archery
            custom_field_15_from: 5
            custom_field_15_to: 10
            ratio_set_7: [31, 32]
          description: Event Creation Form answers to match, keyed by the `filter_keys` of `GET /event_filter_fields`, e.g. `form_field_filters[custom_field_12]=archery&form_field_filters[ratio_set_7][]=31`
        - name: sort
          in: query
          required: false
          schema:
            type: string
          example: "custom_field_12 desc, ratio_set_7 asc"
          description: "Sort by Event Creation Form fields: `sort_key` values from `GET /event_filter_fields`, each optionally followed by `asc` or `desc`. Default: soonest first"
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/LastSyncDatetime'
      responses:
        "200":
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
              example:
                page: 1
                page_size: 1
                page_count: 1
                total_count: 1
                data:
                  - id: 9120
                    name: "Yoga 2"
                    charity_id: 123
                    start_datetime: "2030-01-15T14:00:00.000Z"
                    end_datetime: "2030-01-15T15:00:00.000Z"
                    timezone: "Europe/London"
                    location: "Main Hall"
                    event_type: "subsequent"
                    listing_enabled: false
                    created_at: "2026-10-01T09:00:00.000Z"
                    updated_at: "2026-10-01T09:00:00.000Z"
                    project: { id: 456, name: "Youth Club" }
                    event_category: { id: 4521, name: "Workshops" }
                    master_event_id: 9119
                    guests_count: 12
                    managers_count: 1
                    workers_count: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

    post:
      tags: [Events]
      summary: Create an event
      operationId: createEvent
      description: |
        Creates a one-off event, or a recurring series when `recurring_schedule` and
        `recurring_end_date` are given: the master event plus every subsequent event up to the
        Recurring End Date, as the Create Event form does.

        Work out the ids first: list the Event Formats you can use in the project
        (`GET /projects/{id}/event_categories`), then get the form for the one you choose
        (`GET /projects/{id}/event_form`). Every id in the request is checked against that form.
        Problems are returned together as `422`.

        Times are ISO 8601. A time without an offset is a local time in `timezone`, an IANA
        time zone name that defaults to yours; daylight saving is worked out for you.
        You become the Event Manager unless you give `manager_ids`.

        Not handled by the API: an event image, and Event Steps (project automations).
        To add a Contact as a guest, use the guests endpoints.
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
            examples:
              recurringSeries:
                summary: A weekly series with a Dropdown, a custom field and a Signup Page
                value:
                  project_id: 456
                  event_category_id: 42
                  name: "Youth Club"
                  start_datetime: "2030-01-08T18:00"
                  end_datetime: "2030-01-08T20:00"
                  timezone: "Europe/London"
                  location: "Main Hall"
                  custom_fields: { "77": "B-114" }
                  dropdowns: { "3012": [88101] }
                  signup_page_id: 310
                  guest_status_for_signup_id: 7
                  capacity:
                    guests: fixed
                    max_guests: 20
                    allow_signup_after_full: true
                    guest_status_after_full_id: 8
                    confirmation_message_after_full: "We're full, but we'll let you know if a place comes up."
                  recurring_schedule: { frequency: weekly, interval: 1, days_of_week: [tuesday] }
                  recurring_end_date: "2030-03-26"
      responses:
        "201":
          description: The event, as Get an event returns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntityList'

  /event_filter_fields:
    get:
      tags: [Events]
      summary: List the fields events can be filtered and sorted by
      operationId: listEventFilterFields
      description: |
        Lists the custom fields and Dropdowns used on the **Event Creation Forms** of your
        organisations' Event Formats, alphabetically, as the "Event Creation Form fields"
        section of the Filter Events panel on the Manage Events page lists them. Use their
        `filter_keys` in the `form_field_filters` of `GET /events`, and their `sort_key` in its
        `sort`.

        `data_type` is one of `text`, `email_address`, `telephone`, `number`, `date`, `time`,
        `tickbox`, `file` (Attachment), `signature` or `dropdown`. A Number, Date or Time field
        has two filter keys, `<key>_from` and `<key>_to`. A Dropdown's filter takes answer
        choice ids: list them with `GET /event_filter_fields/{id}/choices`.
      security: [{tokenAuth: []}]
      parameters:
        - name: charity_id
          in: query
          required: false
          schema:
            type: integer
          description: Only this Organisation's (Charity's) Event Creation Forms
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: Paginated list of fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  page_count: { type: integer }
                  total_count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        id: { type: integer, description: The custom field or Dropdown (Ratio Set) id }
                        name: { type: string }
                        data_type: { type: string }
                        filter_keys: { type: array, items: { type: string } }
                        filter_hint: { type: string }
                        sort_key: { type: string }
              example:
                page: 1
                page_size: 2
                page_count: 1
                total_count: 2
                data:
                  - key: ratio_set_7
                    id: 7
                    name: Activity
                    data_type: dropdown
                    filter_keys: [ratio_set_7]
                    filter_hint: A list of answer choice ids; an event matches if it has any of them
                    sort_key: ratio_set_7
                  - key: custom_field_15
                    id: 15
                    name: Age
                    data_type: number
                    filter_keys: [custom_field_15_from, custom_field_15_to]
                    filter_hint: A number for either or both ends of the range, inclusive
                    sort_key: custom_field_15
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /event_filter_fields/{id}/choices:
