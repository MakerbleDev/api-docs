    post:
      tags: [Stories]
      summary: Create a Story
      description: |
        Creates a Story tagged to zero, one, or multiple Beneficiaries.

        **Recommended workflow:**
        1. `GET /story_categories/:id` — retrieve the survey's fields, Indicators, Outcomes, and scale choices
        2. `GET /sub_ratios?ratio_set_ids[]=N` — retrieve valid answer choice IDs for Scale Indicators
        3. Submit this endpoint with the full payload

        | Field | Notes |
        |---|---|
        | `story.story_group` | Always `"change_created"` |
        | `story.story_format` | Always `"old"` |
        | `story.created_at` | Date Happened in `YYYY-MM-DD` |
        | `story_changes` | Activity/Participation totals — `[{change_id, number}]` |
        | `story_change_beneficiaries` | Per-contact Participation records — `[{change_id, beneficiary_id}]` |
        | `story_indicator_beneficiaries` | Per-contact indicator responses (see schema) |
        | `custom_fields` | `{custom_field_id: value}` for text/date/time fields |

        > For binary indicators: include `binray_indicator_value: "on"` if ticked; omit the record entirely if not.
        > Activity Changes: include in `story_changes` only — cannot be tagged to beneficiaries.
      operationId: createStory
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCreateRequest'
            example:
              story:
                story_group: "change_created"
                story_format: "old"
                project_id: 19
                story_category_id: 327
                text: "Session notes from today."
                created_at: "2024-06-01"
                source_of_story: "api"
                is_public: false
              story_privacy: "only_charity_colleagues"
              beneficiary_ids: [413]
              story_changes:
                - change_id: 199
                  number: 2
              story_change_beneficiaries:
                - change_id: 199
                  beneficiary_id: 413
              story_indicator_beneficiaries:
                - indicator_id: 243
                  indicator_type: "scale"
                  outcome_id: 145
                  sub_ratio_id: 54
                  beneficiary_id: 413
              custom_fields:
                "19": "2024-06-01"
                "26": "Some text answer"
      responses:
        "200":
          description: Story created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /draft_stories:
    post:
      tags: [Stories]
      summary: Save an Answer In Progress (draft Story)
      description: |
        Saves a partly completed survey response as an **Answer In Progress** (a draft Story).
        It appears on the organisation's Answers In Progress page, where a colleague can
        review it, finish it and publish it as a Story in Makerble. Use this instead of
        `POST /stories` when a response should be checked by a person before it is published.

        **Who can save one** (otherwise the response is `403`):
        - for a Project: its editors, reporters and observers, and the organisation's editors and reporters (open Projects only);
        - for an Event's Project: the Event's workers and managers too, when `story.event_id` belongs to that Project;
        - with no Project: the organisation's editors and reporters for `story.charity_id`.

        A `story.charity_id` that isn't the Project's organisation, a closed or unknown Project,
        or a request with neither `project_id` nor `charity_id` is refused with `403`.
        Contacts (Beneficiaries) go in the top-level `beneficiaries` array.
      operationId: createDraftStory
      security: [{tokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftStoryCreateRequest'
            example:
              story:
                project_id: 19
                story_category_id: 327
                text: "Notes from today's session, to be reviewed."
                event_id: 88
              beneficiaries: [413]
              story_privacy: "only_charity_colleagues"
              custom_fields:
                "26": "Some text answer"
      responses:
        "201":
          description: Answer In Progress saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftStoryCreated'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
