      tags: [Events]
      summary: List a Dropdown's answer choices for filtering events
      operationId: listEventFilterFieldChoices
      description: |
        Lists the answer choices (Sub Ratios) of a Dropdown (Ratio Set) from
        `GET /event_filter_fields`, alphabetically, as the Filter Events panel's typeahead
        offers them. Pass their ids in `form_field_filters[ratio_set_<id>]` of `GET /events`.
        A Dropdown that isn't on an Event Creation Form of your organisations returns `404`.
      security: [{tokenAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The Dropdown (Ratio Set) id
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Only answer choices whose name contains this, ignoring case
        - name: charity_id
          in: query
          required: false
          schema:
            type: integer
          description: Only this Organisation's Event Creation Forms
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: Paginated list of answer choices
          content:
            application/json:
              schema:
